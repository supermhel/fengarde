# Contract D — Scoring model (machine-readable)
# Consumed by WS-4 (compute score) and WS-5 (funnel routing).
version: 1

# Funnel thresholds -- every value here is actually read by
# services/ws4-detection/scoring.py::Scorer.route(). "store" (index only, no
# classifier/LLM call) is not a third threshold: it's simply score <
# classifier_min, the implicit else in route(). A `store_only_below` key
# used to sit here too, implying store/classifier had its own independent
# boundary -- it was dead config (gap-hunt finding, 2026-08-23: grepped the
# whole repo, zero code or doc ever read it) that happened to equal
# classifier_min's own value, so changing it alone would have silently done
# nothing. Removed rather than wired in: nothing needs a boundary distinct
# from classifier_min today, and an unused knob that LOOKS load-bearing is
# worse than no knob.
thresholds:
  classifier_min: 20        # 20..59      -> light ML classifier
  llm_min: 60               # >= 60       -> enqueue ai.requests for LLM

# Severity floors: a matching rule of this level guarantees at least this score.
severity_floor:
  informational: 0
  low: 10
  medium: 40
  high: 70
  critical: 80

# Combine strategy for multiple matching rules on one event: Scorer.score()/
# routing_score() hardcode max(sum of score_weight, severity floor), clamped
# -- there has only ever been the one implemented strategy. A `combine:
# capped_sum` key used to sit here describing only HALF of that formula (the
# comment said "sum ... clamped", omitting the floor) and was never actually
# read by any code (gap-hunt finding, 2026-08-23) -- a config value that
# looks authoritative but is decorative, and whose own description didn't
# match the real behavior it claimed to select. Removed for the same reason
# as `store_only_below` above.
clamp:
  min: 0
  max: 100

# ============================================================================
# Exposure-aware risk adjustment (WP-2-F / roadmap finding S5).
# PARTIALLY WIRED as of Phase 5 (2026-09-04) -- read this before assuming
# every factor below does something.
# ============================================================================
# `asset_criticality` is REAL: Scorer._exposure_points()
# (services/ws4-detection/scoring.py) reads `enabled` and this factor's
# `tiers`, looks up an OT event's `unmapped.ot.address` against
# `contracts/ot-points/*.yml`'s `points[].criticality` (WP-2-E, no longer
# "read by nothing" for this one purpose), and adds the matching tier's
# points to both score() (analyst-facing) and routing_score() (funnel
# decision), each re-clamped to clamp.min..clamp.max and capped at
# `cap.ceiling`.
#
# `internet_exposure` and `tenant_tier` are STILL INERT -- Scorer never
# reads either sub-key. Not an oversight: no network-topology config or
# tenant-commercial-tier config exists anywhere in this repo yet to feed
# them. `enabled: true` below only activates the ONE factor with a real
# input; the other two stay published schema for a future reader, same
# "deploy the schema first, wire it later" posture this section always had
# -- just now true of two factors instead of three. Their multiplier math
# (prod(exposure_multipliers) in the formula below) is UNIMPLEMENTED in
# Scorer; only the absolute-points half (`asset_criticality`/`tenant_tier`
# tiers) has a real code path today.
#
# Adjustment semantics (asset_criticality's real path; the still-inert
# multiplier half is documented for whoever wires internet_exposure next):
#     score' = clamp(clamp_min, clamp_max, min(cap.ceiling,
#                    score + asset_criticality.tiers[ot_point.criticality]))
# `cap.ceiling` guarantees the adjusted score can never exceed what the
# clamp already allows, so the exposure pass can only ever raise a score
# into a higher funnel tier, never past clamp_max.
exposure:
  enabled: true             # asset_criticality is real; internet_exposure/tenant_tier stay inert (see above)
  factors:
    asset_criticality:      # ot-points criticality (low/medium/high/critical) -> +pts; REAL, wired 2026-09-04
      tiers:
        default: 0
        low: 0
        medium: 5
        high: 10
        critical: 20
        crown_jewel: 15     # kept for a future WS-6 asset-tier source distinct from ot-points criticality
    internet_exposure:      # where the asset/segment sits on the network (multiplier) -- STILL INERT, no reader
      levels:
        internal_only: 1.0
        dmz: 1.1
        internet_facing: 1.25
    tenant_tier:            # commercial tier of the consuming tenant (tier -> +pts) -- STILL INERT, no reader
      tiers:
        default: 0
        premium: 10
  cap:
    ceiling: 100            # adjusted score is still bounded by clamp.max above
