# Contract D — Scoring model (machine-readable)
# Consumed by WS-4 (compute score) and WS-5 (funnel routing).
version: 1

# Funnel thresholds -- every value here is actually read by
# services/ws4-detection/scoring.py::Scorer.route(). "store" (index only, no
# classifier/LLM call) is not a third threshold: it's simply score <
# classifier_min, the implicit else in route(). A `store_only_below` key
# used to sit here too, implying store/classifier had its own independent
# boundary -- it was dead config (gap-hunt finding, 2026-08-23: grepped the
# whole repo, zero code or doc ever read it) that happened to equal
# classifier_min's own value, so changing it alone would have silently done
# nothing. Removed rather than wired in: nothing needs a boundary distinct
# from classifier_min today, and an unused knob that LOOKS load-bearing is
# worse than no knob.
thresholds:
  classifier_min: 20        # 20..59      -> light ML classifier
  llm_min: 60               # >= 60       -> enqueue ai.requests for LLM

# Severity floors: a matching rule of this level guarantees at least this score.
severity_floor:
  informational: 0
  low: 10
  medium: 40
  high: 70
  critical: 80

# Combine strategy for multiple matching rules on one event: Scorer.score()/
# routing_score() hardcode max(sum of score_weight, severity floor), clamped
# -- there has only ever been the one implemented strategy. A `combine:
# capped_sum` key used to sit here describing only HALF of that formula (the
# comment said "sum ... clamped", omitting the floor) and was never actually
# read by any code (gap-hunt finding, 2026-08-23) -- a config value that
# looks authoritative but is decorative, and whose own description didn't
# match the real behavior it claimed to select. Removed for the same reason
# as `store_only_below` above.
clamp:
  min: 0
  max: 100

# ============================================================================
# Exposure-aware risk adjustment (WP-2-F / roadmap finding S5).  INERT TODAY.
# ============================================================================
# THIS SECTION IS READ BY NOTHING.  Do not treat it as load-bearing.
#
# Scorer (services/ws4-detection/scoring.py) constructs from exactly three
# top-level blocks -- `thresholds`, `severity_floor`, `clamp` -- plus the
# document `version` key (validated at construction, warn-only).  Nothing in
# any workstream or tool opens `exposure`.  Per this file's own honest-status
# rule (see the `store_only_below` and `combine` notes above), a knob that
# looks authoritative but reads nothing is worse than no knob -- so this
# section ships DEFAULT-OFF (`enabled: false`) and the ONLY reader it has is
# this comment.  Until a package wires it into the scorer, it has no effect on
# any score, floor, or funnel decision, and `version: 1` above is intentionally
# NOT bumped: the v1 layout this scorer is written against is unchanged by an
# inert additive section.
#
# Why it is here at all: roadmap finding S5 scopes exposure-aware risk as an
# EXTENSION of this file, not a new subsystem.  It is published now as the
# agreed JSON-safe schema so a future reader can wire it into Scorer without
# a contract rewrite -- on the same principle as the ot-points-style asset
# config: deploy the schema first, wire it later, and stay explicit that it
# is not yet wired.
#
# Adjustment semantics agreed for that future reader (a single pass applied to
# the already-clamped max(severity_floor, sum(score_weight)) from the blocks
# above, then re-clamped to clamp.min..clamp.max):
#     score' = clamp(clamp_min, clamp_max,
#                    score + sum(absolute_tier_adds)
#                          + round(score * (prod(exposure_multipliers) - 1)))
# `asset_criticality.tiers` and `tenant_tier.tiers` contribute ABSOLUTE points
# (a crown-jewel asset is worth +15 regardless of base score); `cap.ceiling`
# guarantees the adjusted score can never exceed what the clamp already
# allows, so the exposure pass can only ever raise a score into a higher
# funnel tier, never past clamp_max.  A multiplier of 1.0 == neutral.
exposure:
  enabled: false            # MUST stay false until a reader exists; the off-switch
  factors:
    asset_criticality:      # from the ot-points-style WS-6 asset config (tier -> +pts)
      tiers:
        default: 0
        crown_jewel: 15
    internet_exposure:      # where the asset/segment sits on the network (multiplier)
      levels:
        internal_only: 1.0
        dmz: 1.1
        internet_facing: 1.25
    tenant_tier:            # commercial tier of the consuming tenant (tier -> +pts)
      tiers:
        default: 0
        premium: 10
  cap:
    ceiling: 100            # adjusted score is still bounded by clamp.max above
