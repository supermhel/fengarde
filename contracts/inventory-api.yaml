openapi: 3.1.0
info:
  title: SIEM Inventory API (Contract C)
  version: "1.0.0"
  description: >
    Asset inventory keyed by MAC (stable). IP is historised because it changes (DHCP).
    Implemented by WS-6, consumed by WS-2 (enrichment) and WS-7 (dashboard).
servers:
  - url: http://inventory:8000
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    # R3-#46 (2026-08-27): the tenant-key auth this service actually enforces.
    # When the TenantKeyStore is empty (auth off), a request without a key is
    # permitted (open, single-tenant default). Once any key is seeded, every
    # request MUST present a valid tenant-scoped X-Api-Key (401/429 otherwise).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Tenant-scoped API key. Auth ON once the TenantKeyStore holds at least one
        key; empty keystore = open default. Read routes are tenant-narrowed by the
        key's scope; write routes validate the key; failed attempts are rate-limited
        per source IP (429).
paths:
  /assets:
    get:
      summary: List / search assets
      parameters:
        - { name: ip, in: query, schema: { type: string } }
        - { name: mac, in: query, schema: { type: string } }
        - { name: sector, in: query, schema: { type: string, enum: [bank, datacenter, common] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: tenant_id, in: query, schema: { type: string, default: "default" },
            description: "F1 (2026-07-29 audit): scopes the search to one tenant's assets. Omitted -> 'default', the single-tenant behavior every deployment had before this field existed." }
      responses:
        "200":
          description: matching assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
  /keys:
    get:
      summary: >
        Key metadata (2026-08-20) -- id, tenant, scope, source, created/last-used
        timestamps, NEVER key material. Tenant-narrowed like every other GET here:
        the unrestricted '*' admin key (or an unauthenticated request when auth is
        disabled) sees every tenant's keys; a tenant-scoped key sees only its own.
        Existed in TenantKeyStore.list_keys() since the keystore shipped but had no
        HTTP route (CLI-only, manage_keys.py) until the dashboard needed it.
      responses:
        "200":
          description: key metadata visible to the caller's own scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_id: { type: string }
                        tenant_id: { type: string }
                        scope: { type: string, enum: [read_only, read_write] }
                        source: { type: string }
                        created_at: { type: string }
                        last_used_at: { type: [string, "null"] }
  /assets/resolve:
    get:
      summary: Resolve which MAC held an IP at a given time (historically correct)
      parameters:
        - { name: ip, in: query, required: true, schema: { type: string } }
        - { name: at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: tenant_id, in: query, schema: { type: string, default: "default" } }
      responses:
        "200":
          description: the asset that owned the IP at that instant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { description: no asset held that IP at that time }
  /assets/{mac}:
    get:
      summary: Get one asset by MAC
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string, default: "default" } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { description: not found }
  /assets/upsert:
    post:
      summary: Upsert from an observation (bus consumer also calls this internally)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Observation" }
      responses:
        "200": { description: upserted, returns the asset, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
components:
  schemas:
    IpInterval:
      type: object
      required: [ip, from]
      properties:
        ip: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, nullable: true }
    Asset:
      type: object
      required: [mac, last_seen, status]
      properties:
        mac: { type: string, description: "primary logical key" }
        tenant_id: { type: string, default: "default", description: "F1 (2026-07-29 audit): the logical key is actually (tenant_id, mac) -- two tenants may share a mac without colliding." }
        vendor: { type: string }
        hostname: { type: string }
        ip_current: { type: string, nullable: true }
        ip_history:
          type: array
          items: { $ref: "#/components/schemas/IpInterval" }
        protocols_seen:
          type: array
          items: { type: string }
        open_ports:
          type: array
          items: { type: integer }
        sector: { type: string, enum: [bank, datacenter, common] }
        type: { type: string, description: "router, switch, server, vm, hypervisor, db, medical, plc" }
        last_seen: { type: string, format: date-time }
        status: { type: string, enum: [active, inactive] }
        new_device: { type: boolean, description: "M7 Track Y: true when THIS observation was an alertable first-ever sighting of the mac for its tenant. Only ever present on POST /assets/upsert's response -- it describes the write, not the stored asset, so reads (GET /assets, /assets/{mac}) never carry it. False during the tenant's initial baseline window (INVENTORY_BASELINE_SECONDS) so populating an existing segment is not reported as a fleet of new devices." }
    Observation:
      type: object
      required: [mac, ip, seen_at]
      properties:
        mac: { type: string }
        tenant_id: { type: string, default: "default", description: "F1 (2026-07-29 audit): which tenant this observation belongs to. Omitted -> 'default'." }
        ip: { type: string }
        hostname: { type: string }
        protocol: { type: string }
        seen_at: { type: string, format: date-time }
