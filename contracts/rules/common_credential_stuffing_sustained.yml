title: Sustained credential stuffing (one account from many distinct source IPs over 24 hours)
id: 9cfa2df1-e480-4260-aefb-0e7a1701bb43
status: experimental
description: >
  One account failing authentication from 20+ DISTINCT source IPs within 24
  hours (OCSF Authentication, class 3002, activity 4 Failure). The slow tier of
  common_password_spray.yml (8 distinct sources in 300 s): a stuffing campaign
  that rotates a proxy pool at a few addresses per hour never puts 8 sources in
  one 5-minute window and was invisible to the burst rule.

  Why this exists (owner decision Q16, 2026-10-14, option A): the 300 s burst
  stays the fast tier, unchanged; this separately named rule is the sustained
  tier beside it. See docs/handoff/2026-10-14-q15-q16-measurements.md.

  Companion of the burst rule: same account key, same distinct field. When both
  fire on one event and their windows hold the SAME source set (a fast burst
  that alone reaches 20 addresses) this alert is the duplicate and WS-4 drops
  it; when the 24 h window holds more addresses than the burst's 5 minutes, it
  is emitted beside it. It adds no score weight of its own (companion
  convention); its level is the floor when it fires alone.

  False-positive honesty: an account behind carrier-grade NAT or a large VPN
  egress pool can fail from many addresses in a day (a user with a stale saved
  password on many mobile networks). 20 distinct sources in 24 h is the
  starting point the independent review proposed, not a measured site value --
  tune it to the estate. Same naming rule as the burst tier: this is T1110.004
  (credential stuffing, many sources -> ONE account), NOT T1110.003 password
  spraying (one source -> many accounts), which stays a known gap.
level: medium
logsource:
  category: authentication
detection:
  failed_auth:
    class_uid: 3002
    activity_id: 4
  condition: failed_auth
fields:
  - actor.user.name
  - src_endpoint.ip
siem:
  sector: common
  score_weight: 0
  companion_of: 4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90   # tenant-disabling the burst tier disables this too
  window_seconds: 86400
  threshold: 20
  group_by: actor.user.name
  distinct_field: src_endpoint.ip
mitre:
  tactic: TA0006        # Credential Access
  technique: T1110.004  # Brute Force: Credential Stuffing
