title: Lateral movement (one account auth success to many distinct hosts)
id: 2e3d4c5b-6f70-4819-9b02-1c2d3e4f5061
status: stable
description: >
  One account successfully authenticating to 5+ DISTINCT destination hosts within
  300 seconds. Targets OCSF Authentication (class 3002, activity 1 Logon) with
  status Success. Distinct-count on dst_endpoint.hostname catches an attacker
  reusing valid credentials to hop across hosts -- Windows 4624 records the target
  host as dst_endpoint.hostname.
  Parser-coverage honesty (fixed 2026-08-26): dst_endpoint.hostname is populated
  only by parsers that map the logon target onto dst_endpoint (the
  windows_eventlog parser does this for 4624; the shape is pinned by
  test_engine_distinct_rules.py). The active_directory parser currently maps a
  4624 logon's host onto src_endpoint.hostname instead and NEVER emits
  dst_endpoint, so logons normalized under source_type=active_directory cannot
  count toward this rule at all (fail-closed: no dst_endpoint.hostname value =
  no distinct count) -- a real blind spot tracked as finding #136 in the
  2026-08-26 gap hunt; the corrective action belongs to the active_directory
  parser (align its host mapping with windows_eventlog), not to this rule's
  shape.
level: high
logsource:
  category: authentication
detection:
  auth_success:
    class_uid: 3002
    activity_id: 1
    status: Success
  condition: auth_success
fields:
  - actor.user.name
  - dst_endpoint.hostname
siem:
  sector: common
  score_weight: 65
  window_seconds: 300
  threshold: 5
  group_by: actor.user.name
  distinct_field: dst_endpoint.hostname
mitre:
  tactic: TA0008      # Lateral Movement
  technique: T1021    # Remote Services
