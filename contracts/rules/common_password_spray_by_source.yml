title: Password spray (one source failing against many distinct accounts)
id: 8c2f6a14-3d97-4e05-b1a8-7f4d9c0e5b26
status: stable
description: >
  One source IP failing authentication against 8+ DISTINCT accounts within 300 seconds (OCSF Authentication,
  class 3002, activity 4 Failure). This is true password spraying: one host cycling a few passwords across many
  accounts, deliberately staying under any per-account lockout and per-account failure threshold. It is the
  inverse of common_password_spray.yml (many sources -> one account, credential stuffing) and complements
  common_bruteforce.yml (many failures, any accounts). Closes the gap that rule's description recorded
  (added 2026-10-20, owner-approved). Noise: shared egress (NAT, VPN, a mail gateway or service that
  authenticates on behalf of many users) can look like a spray from one address - allowlist known aggregators.
level: high
logsource:
  category: authentication
detection:
  failed_auth:
    class_uid: 3002
    activity_id: 4
  condition: failed_auth
fields:
  - src_endpoint.ip
  - actor.user.name
siem:
  sector: common
  score_weight: 70
  window_seconds: 300
  threshold: 8
  group_by: src_endpoint.ip
  distinct_field: actor.user.name
mitre:
  tactic: TA0006        # Credential Access
  technique: T1110.003  # Brute Force: Password Spraying
