title: New OT device appeared on the OT inventory segment
id: 7f8091a2-b3c4-4d53-9e6f-1a2b3c4d5e6f
# PROVISIONAL -- DORMANT IN PRODUCTION (M7 Track Y, 2026-08-05).
# This rule has NO live producer. Nothing in the deployed system publishes an
# inventory-diff notification to `raw.events`: WS-6 owns the durable per-tenant
# new-device state (InventoryStore.upsert_with_diff) but is deliberately
# stdlib-only with no bus client, and nothing consumes `assets.updates` either.
# The only thing that has ever fired this rule is its own anti-dormancy fixture
# in tools/check_rule_producers.py, so a green eval/attack/fire_check.py proves
# it CAN fire, never that it WILL. Do not read its presence here, or the
# "28 rules shipped" count in SSOT.md, as a working detection.
# Promote to `status: stable` only once the bus transport lands.
status: experimental
description: >
  An inventory-diff worker observed a previously unknown MAC/device appear on
  the OT segment.  The worker is expected to emit an OCSF Network Activity open
  event (`class_uid` 4001, `activity_id` 1) annotated with
  `siem.source_type=inventory_diff`, `siem.sector=datacenter`,
  `unmapped.ot.sector=ot` and `unmapped.ot.device_type` from the asset
  inventory.  This rule is a coarse, single-shot watch: one unknown OT device
  is already worth attention; legitimate onboarding will also fire until the
  inventory allowlist is tuned per deployment.  Unlike the existing
  `ot_new_engineering_connection` rule, this does NOT key on OPC UA logons --
  it keys on inventory state, which is exactly the missing signal called out in
  the task.
level: high
logsource:
  category: network_activity
detection:
  ot_new_device:
    class_uid: 4001
    activity_id: 1
    siem.source_type: inventory_diff
    siem.sector: datacenter
    unmapped.ot.sector: ot
  condition: ot_new_device
fields:
  - src_endpoint.ip
  - src_endpoint.mac
  - unmapped.ot.device_type
  - unmapped.ot.vendor
  - unmapped.ot.hostname
siem:
  sector: datacenter
  score_weight: 55
mitre:
  framework: attack-ics
  tactic: TA0108      # Initial Access (ICS)
  technique: T0864    # Transient Cyber Asset
