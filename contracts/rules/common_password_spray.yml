title: Credential stuffing (one account attempted from many distinct source IPs)
id: 4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90
status: stable
description: >
  One account failing authentication from 8+ DISTINCT source IPs within 300
  seconds (OCSF Authentication, class 3002, activity 4 Failure). This is
  distributed credential stuffing: cached/leaked credentials for a single
  account tried from many egress points (proxy pools, residential networks,
  VPNs) to evade a per-source-IP brute-force threshold -- the inverse shape of
  common_bruteforce.yml (which is per-source-IP).
  Naming honesty (fixed 2026-08-26): this rule was previously titled
  "Password spray" and tagged T1110.003, but its logic detects many-sources ->
  ONE-account (credential stuffing), NOT one-source -> many-accounts (true
  password spraying). The logic is deliberately UNCHANGED (pinned by
  test_v03_new_rules.py), so the label was corrected instead: re-tagged
  T1110.004 (Credential Stuffing) and renamed. True password spraying -- one
  source host cycling a few passwords across MANY accounts -- is NOT covered by
  any shipped rule today; that shape needs its own rule (group on
  src_endpoint.ip, distinct-count actor.user.name) and is a known gap.
level: high
logsource:
  category: authentication
detection:
  failed_auth:
    class_uid: 3002
    activity_id: 4
  condition: failed_auth
fields:
  - actor.user.name
  - src_endpoint.ip
siem:
  sector: common
  score_weight: 70
  window_seconds: 300
  threshold: 8
  group_by: actor.user.name
  distinct_field: src_endpoint.ip
mitre:
  tactic: TA0006        # Credential Access
  technique: T1110.004  # Brute Force: Credential Stuffing