title: Privileged database operation on a banking DB
id: 2a9d7b41-5e6c-4f88-bb12-3c0a1e7d4f02
status: stable
description: >
  Privileged datastore operation (grant/alter) on a banking DB, any time of
  day -- this rule has NO time predicate (unlike e.g.
  ot_write_outside_maintenance.yml), despite an earlier title implying one;
  corrected to match the actual detection.block below rather than add an
  outside_hours gate to a shipped rule's behavior. High weight because it
  maps directly to PCI-DSS access-control monitoring.
level: critical
logsource:
  category: datastore_activity
detection:
  priv_op:
    class_uid: 6005
    activity_id: 5
  bank:
    siem.sector: bank
  condition: priv_op and bank
fields:
  - actor.user.name
  - dst_endpoint.hostname
siem:
  sector: bank
  score_weight: 85
mitre:
  tactic: TA0004      # Privilege Escalation
  technique: T1548    # Abuse Elevation Control Mechanism
