# evasion_tables.yaml -- the SECURITY-JUDGEMENT inputs of the adaptive-evasion lane.
#
# Two questions the harness cannot answer by measurement, answered here with a
# cited basis so a finding is classified BY LOOKUP, never by tuning an operator
# until something evades:
#
#   attacker_control  can an adversary choose the bytes that end up in this log field?
#                     yes | conditional | no.  "no" means an operator on that field is
#                     NOT_REACHABLE: it is listed as not_searched with its reason and is
#                     excluded from every rate (never silently skipped, never a free pass).
#   identity          which respellings does the SOURCE SYSTEM treat as the SAME entity?
#                     equivalent_ops are identity-preserving: an evasion that needs one is
#                     a BUG (the detector keys on a spelling the source does not).
#                     try_ops not in equivalent_ops need a genuinely different identity:
#                     an evasion by them is INHERENT (its cost reduces to forgone events).
#
# EVERY ROW IS ratified: false.  These are judgement calls about real systems that the
# owner has not signed (owner decision #1 of step 5).  An unratified row produces INFO
# lines and floors derived from it do not gate; flipping a row to ratified: true is the
# deliberate act that turns its finding into a gate.  Rows marked ASSUMED were not
# verified against the vendor and must be before ratification.
version: 1

attacker_control:
  linux_ssh.username:
    ocsf_path: actor.user.name
    attacker_controlled: conditional
    ratified: false
    basis: >
      The username in "Failed password for [invalid user] <name> from <ip>" is the
      string the client sent. OpenSSH versions differ in how they escape unusual
      characters in logged names (ASSUMED: whitespace is not always escaped), so
      whether "<name> from <ip> port 1 ssh2 ..." survives into the syslog line is
      version-dependent. The parser trusts the FIRST " from <ip>" in the line.
  linux_ssh.source_address:
    ocsf_path: src_endpoint.ip
    attacker_controlled: "no"
    ratified: false
    basis: Written by sshd from the TCP peer address, not from client-supplied text.
  linux_ssh.sshd_message_text:
    ocsf_path: activity_id
    attacker_controlled: "no"
    ratified: false
    basis: >
      The "Failed password" / "Accepted password" phrase is generated by the server.
      A lower-case variant is dead-lettered by the parser but an attacker cannot make
      sshd emit it, so it is NOT_REACHABLE, not a silent_drop bug.
  dns_query.qname:
    ocsf_path: dst_endpoint.hostname
    attacker_controlled: "yes"
    ratified: false
    basis: The queried name is chosen by whoever issues the query (the tunnel client).

identity:
  linux_ssh.account:
    class: posix_user
    attacker_controlled: conditional
    try_ops: [casefold]
    equivalent_ops: []
    ratified: false
    basis: POSIX user names are case-sensitive, so "Deploy" and "deploy" are different accounts.
  windows_eventlog.account:
    class: windows_account
    attacker_controlled: conditional
    try_ops: [casefold, strip, domain_prefix, upn_suffix]
    equivalent_ops: [casefold, strip, domain_prefix, upn_suffix]
    ratified: false
    basis: >
      Windows account names are case-insensitive; a logon names the account as typed
      for NTLM (Kerberos canonicalises), and DOMAIN\name, name@upn and the bare name
      address the same principal. Stripping DOMAIN\ or the UPN suffix would AMEND the
      ratified ADR-009 canonical actor definition (strip + casefold) -- owner decision.
  windows_eventlog.target_account:
    class: windows_account
    attacker_controlled: conditional
    try_ops: [casefold, strip, domain_prefix]
    equivalent_ops: [casefold, strip, domain_prefix]
    ratified: false
    basis: Same as windows_eventlog.account (TargetUserName of an account-change event).
  active_directory.account:
    class: windows_account
    attacker_controlled: conditional
    try_ops: [casefold, strip, domain_prefix]
    equivalent_ops: [casefold, strip, domain_prefix]
    ratified: false
    basis: Same as windows_eventlog.account (TargetUserName of a failed logon).
  vmware_vsphere.account:
    class: vsphere_user
    attacker_controlled: conditional
    try_ops: [casefold, domain_prefix]
    equivalent_ops: [casefold, domain_prefix]
    ratified: false
    basis: >
      ASSUMED: vCenter SSO resolves local and AD-backed users case-insensitively and
      accepts DOMAIN\name. Not verified against VMware documentation.
  dns_query.parent_domain:
    class: dns_name
    attacker_controlled: "yes"
    try_ops: [casefold, trailing_dot]
    equivalent_ops: [casefold, trailing_dot]
    ratified: false
    basis: >
      RFC 4343: DNS names compare case-insensitively; a trailing dot is the root label.
      The parser lower-cases and strips the dot (dns_query.parent_domain), which is why
      this row is expected to stay ROBUST -- the robust control for the other rows.
