# evasion_findings.yaml -- the CLOSED register of known evasions (adaptive-evasion lane).
#
# Same pattern as eval/twin/oracle_consistency._ACCEPTED: nothing is tolerated unless it is
# listed here with a class, a reproduction and a decision reference.
#
#   class   BUG          the detector keys on something the attack can change for free
#                        (identity respelling, forged attribution, cross-window state loss)
#           TRUST_MODEL  holds because the pipeline trusts an attacker-influenced input
#                        (the record's own clock); reported, owner decides the policy
#           INHERENT     (never listed) thinning, slowing, spreading across truly distinct
#                        entities -- the price of ANY threshold rule; reported as cost, never
#                        as a "fix" item
#   status  open         the only status allowed to stay in the file. A FIXED finding must be
#                        DELETED: an entry that no longer reproduces fails the gate as STALE.
#   repro   how evasion_cost.py re-derives the finding every run
#   rule_sets  where it reproduces today; a listed set that stops reproducing, or a new set
#              that starts to, FAILS (a new evasion must be a deliberate registration).
#
# PRODUCT FIXES ARE OUT OF SCOPE for the lane that wrote this file (it measures). Fix owners
# and schedules are owner decisions, not made here.
version: 1
findings:
  - id: F2-identity-canonicalisation
    class: BUG
    status: open
    first_seen: "2026-10-02"
    summary: >
      RESIDUAL after the F2 fix (owner decision: strip+casefold). WS-4 account group keys are now the ADR-009 canonical
      actor (strip().casefold(), engine.Rule._group_of), so case and whitespace respellings no
      longer split a burst. What still evades: the DOMAIN\ prefix and the UPN suffix. A Windows
      source treats DOMAIN\name, name@upn and name as one principal, ADR-009 does not, so a burst
      split over two source addresses AND two of those forms stays under threshold.
      dc_mass_vm_delete rests on an ASSUMED evasion_tables.yaml row (vCenter SSO not verified).
    repro: {kind: row_flag, flag: respelling_evades, module: evasion_axes, function: respelling_axis}
    rule_sets: [common_lateral_movement, dc_mass_vm_delete]
    decision: "owner decision 2026-10-14: strip+casefold implemented (ADR-009 as ratified); folding DOMAIN\\ / UPN would AMEND ADR-009 and was not chosen -- the residual stays open"

  - id: F4-record-clock-trust
    class: TRUST_MODEL
    status: open
    first_seen: "2026-10-02"
    summary: >
      mcp_agent, db_audit, active_directory, windows_eventlog, vmware_vsphere and opcua_audit take event time
      from the record's own timestamp and ignore meta.received_at (measured; linux_ssh, cisco_asa and dns_query
      do the reverse). Forging ONLY the record clock stretches a burst past any window for free wherever the
      emitting host is attacker-influenced. Inherent to the trust model; the existing timing axes
      move both clocks together and cannot see it.
    repro: {kind: row_flag, flag: clock_forgeable, module: evasion_axes, function: clock_forgeable}
    rule_sets: [agent_tool_call_burst, bank_mass_card_read, common_bruteforce_sourceless, common_lateral_movement,
                common_password_spray, common_rapid_account_lifecycle, dc_mass_vm_delete, ot_new_engineering_connection]
    decision: "owner decision 6 of step 5: add a source-clock-versus-receipt skew guard, or accept the trust model"
