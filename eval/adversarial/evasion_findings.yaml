# evasion_findings.yaml -- the CLOSED register of known evasions (adaptive-evasion lane).
#
# Same pattern as eval/twin/oracle_consistency._ACCEPTED: nothing is tolerated unless it is
# listed here with a class, a reproduction and a decision reference.
#
#   class   BUG          the detector keys on something the attack can change for free
#                        (identity respelling, forged attribution, cross-window state loss)
#           TRUST_MODEL  holds because the pipeline trusts an attacker-influenced input
#                        (the record's own clock); reported, owner decides the policy
#           INHERENT     (never listed) thinning, slowing, spreading across truly distinct
#                        entities -- the price of ANY threshold rule; reported as cost, never
#                        as a "fix" item
#   status  open         the only status allowed to stay in the file. A FIXED finding must be
#                        DELETED: an entry that no longer reproduces fails the gate as STALE.
#   repro   how evasion_cost.py re-derives the finding every run
#   rule_sets  where it reproduces today; a listed set that stops reproducing, or a new set
#              that starts to, FAILS (a new evasion must be a deliberate registration).
#
# PRODUCT FIXES ARE OUT OF SCOPE for the lane that wrote this file (it measures). Fix owners
# and schedules are owner decisions, not made here.
# F4 (record-clock trust) was CLOSED 2026-10-22 and its entry deleted because clock_forgeable no longer reproduces for any
# rule-set. Residuals that are NOT evasions and so are not register entries (see services/ws4-detection/INTERFACE.md):
# delayed/backfilled batches are clamped to receipt time and can form a false-positive burst (opt out with
# FENGARDE_WINDOW_TIME_SOURCE=event); alert ids of clamped events are not stable across re-shipped logs; the clamp is off
# for events without a usable meta.received_at.
version: 1
findings:
  - id: F2-identity-canonicalisation
    class: BUG
    status: open
    first_seen: "2026-10-02"
    summary: >
      CLOSED UNDER A CONFIGURED MAP; OPEN BY DEFAULT (documented residual). Account identity is the ADR-009
      canonical actor (strip().casefold()), and since 2026-10-22 an explicit per-tenant realm alias map
      (contracts/identity_aliases.yaml or $FENGARDE_IDENTITY_ALIASES; services/shared/identity_aliases.py) folds
      DOMAIN\name, name@upn and (with default_realm) the bare name into one identity EVERYWHERE the canonical actor is
      used: WS-4 window groups and alert keys, WS-8 track/incident entity ids, WS-9 entity ids. Measured: with the
      fixture map (eval/adversarial/evasion_alias_fixture.yaml) respelling_evades_mapped is false for every rule-set
      and is a ratcheted floor field. The shipped map is EMPTY because the code never guesses that two names are one
      person, so this row (measured with no map) still reproduces: a burst split over two source addresses AND two
      realm spellings stays under threshold for any tenant that has not listed its realms. Deployments MUST configure
      their realms (contracts/identity-aliases.md). This entry is the registered default residual, not a code defect;
      it goes away only if the owner decides a map ships configured. dc_mass_vm_delete rests on an ASSUMED
      evasion_tables.yaml row (vCenter SSO not verified).
    repro: {kind: row_flag, flag: respelling_evades, module: evasion_axes, function: respelling_axis}
    rule_sets: [common_lateral_movement, dc_mass_vm_delete]
    decision: "owner decision 2026-10-21/22: explicit per-tenant alias map, folded in WS-4/8/9; absent map = unchanged (ADR-009 strip+casefold stands, no guessing)"
