# technique_waivers.yaml -- the CLOSED, DATED waiver list of eval/adversarial/technique_matrix.py.
#
# A rule appears here ONLY because no storyline exercises it yet. The gate never lets that be silent:
#   * `unexercised`: rule file stem -> "YYYY-MM-DD <reason, naming the storyline that will exercise it>".
#     When a storyline lands and the rule fires in it, its entry becomes STALE and the gate FAILS until
#     the line is deleted -- so a storyline's author deletes the lines for the rules it covers.
#   * `no_technique`: rule file stem -> reason. A rule that deliberately carries no `mitre:` block.
#
# One entry per line, alphabetical, so parallel storyline branches touch disjoint lines.
# Dates are the date the entry was written; an entry is never extended by editing its date.

