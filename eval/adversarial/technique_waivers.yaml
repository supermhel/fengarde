# technique_waivers.yaml -- the CLOSED, DATED waiver list of eval/adversarial/technique_matrix.py.
#
# A rule appears here ONLY because no storyline exercises it yet. The gate never lets that be silent:
#   * `unexercised`: rule file stem -> "YYYY-MM-DD <reason, naming the storyline that will exercise it>".
#     When a storyline lands and the rule fires in it, its entry becomes STALE and the gate FAILS until
#     the line is deleted -- so a storyline's author deletes the lines for the rules it covers.
#   * `no_technique`: rule file stem -> reason. A rule that deliberately carries no `mitre:` block.
#
# One entry per line, alphabetical, so parallel storyline branches touch disjoint lines.
# Dates are the date the entry was written; an entry is never extended by editing its date.

unexercised:
  common_ids_high_severity_alert: "2026-11-20 rule added on branch wp/flow-record-rules; no storyline drives a Suricata severity-1 alert yet (candidate: network_credential_abuse once a sensor-alert step exists). Add the storyline step, then delete this line."
  common_large_outbound_flow: "2026-11-20 rule added on branch wp/flow-record-rules; no storyline drives a 1 GiB+ outbound flow yet (candidate: insider_exfil). Add the storyline step, then delete this line."
  common_refused_connection_scan: "2026-11-19 rule added by WP-1.5 (PR #152); no storyline drives a refused-connection scan yet (candidate: network_credential_abuse or it_intrusion recon step). Integration waiver: add the storyline step, then delete this line."
  ot_write_unlisted_source: "2026-11-20 rule added on branch wp/flow-record-rules (default-off, empty allowlist); no storyline drives a sensor-seen Modbus/DNP3 write yet (candidate: ot_opcua_sabotage via a Modbus leg). Add the storyline step, then delete this line."

no_technique:
  agent_tool_call_burst: "2026-10-03 no solid single ATT&CK mapping for a generic tool-call-volume burst; the rule omits the mitre block on purpose (contracts/detection-coverage.md, C3 rule)"
  common_ids_high_severity_alert: "2026-11-20 passthrough of the sensor rule set's own severity-1 tier: the signature's technique varies per signature, so the rule carries no single mitre block (contracts/rules/common_ids_high_severity_alert.yml)"
  common_large_outbound_flow: "2026-11-20 byte-count exfiltration heuristic; no single ATT&CK technique fits honestly (tactic TA0010 only), so the rule omits the mitre block (contracts/rules/common_large_outbound_flow.yml)"
