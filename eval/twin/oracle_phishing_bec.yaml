# =============================================================================
# FENGARDE eval/twin/oracle_phishing_bec.yaml
# Grading ground truth for the phishing -> account takeover -> business-email-
# compromise storyline (storyline_phishing_bec.py):
#   phish_delivery -> user_execution -> c2_beacon -> victim_session
#     -> proxy_pool_logins -> foreign_login -> inbox_rule -> payment_redirect
#
# AUTHORING RULES (written 2026-10-03 BEFORE the storyline builder existed and before the
# pipeline was run against it -- this file was committed first, the builder second):
#   1. A step is expected to fire a rule only where a shipped rule's DOCUMENTED intent covers
#      the behaviour. Nothing here was tuned to observed output. eval/twin/oracle_consistency.py
#      reconciles the two afterwards; every disagreement is either fixed or recorded in its
#      accepted list, never edited away here.
#   2. The rules this oracle leans on are pinned in `provenance` by a digest of their
#      description + detection + siem blocks (eval/twin/oracle_provenance.py). A rule edit fails
#      the check until a human re-reads the rule and re-pins. LIMIT, stated plainly: nothing can
#      prove an oracle was authored before a run; the commit order and the pin are what reduce
#      self-authoring bias, they do not remove it. A third-party labelled corpus is the remedy.
#   3. NO RULE WAS INVENTED. Where no shipped rule covers a step it is declared an honest gap,
#      carrying the ATT&CK technique the step demonstrates and the reason (the technique matrix
#      lists these as "demonstrated but undetected"). ATT&CK ids were checked against the v14
#      technique list from the author's knowledge; the repository vendors no ATT&CK dataset, so
#      this is NOT mechanically verified (only the id's shape is).
#   4. incident_count follows the convention for all oracles (2026-10-03, owner decision): the
#      number of FULL-CHAIN incidents WS-8 actually produces for the storyline. WS-8 tracks never
#      merge (ADR-009/010), so it is 1 only if one entity is carried by EVERY alert-raising step.
#      Here it is: the compromised account is the actor on the beacon, the credential-stuffing
#      burst and the foreign login, so one actor track can span them. (it_intrusion's aspirational
#      1 stays a flagged known membership_ok=False; it is not retargeted here.)
#   5. campaign_membership is REPORTED, never gated (owner decision 2026-10-03).
#   6. HONESTY NOTE on identities: a real Sysmon `User` is `DOMAIN\name` and an IdP `suser` is a
#      UPN. WS-8 compares actor strings verbatim (ADR-009's canonical actor), so a realistic mix
#      would split the account across tracks. The storyline uses ONE spelling of the account on
#      every source so the entity is shared; that is a simplification of the telemetry, and the
#      oracle does not claim WS-8 would bridge the real spellings.
# =============================================================================
schema_version: 1
oracle_id: "phishing-bec-v1"
kind: "attack-chain-grading-oracle"
scope: "phishing-bec"

provenance:
  authored: "2026-10-03"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  rules_read:
    common_beaconing: "b83ae4d66ca4e8634540c5efeb8d35f21b595d2e4426793d76eb4115a7dd8b5e"   # re-read + re-pinned 2026-10-14 (Q15: threshold 6 -> 20)
    common_bruteforce: "f685feb7ab0efe2e0cd9ed3427a2e0466c3a0de785cc28deef3c53a0b585919b"
    common_bruteforce_by_account: "71734317dfda0c8ecfbb1c62e786df21a6e9c81c1d3c53901a3822cb1079df20"
    common_impossible_travel: "10385cf60b19c0d186499f25c119f1e60a7247e41f9b6f36ce7821786e0cb27c"   # re-read + re-pinned 2026-10-20: status stable -> experimental only (logic unchanged)
    common_password_spray: "c565b58f392c8e85ac08049c49d1ab119846540d7bcbea86f0ea2f4e30d1a089"
    # 2026-10-20: the two rules below were written AFTER this oracle, by the same author, to close two declared gaps.
    # They are therefore NOT independent evidence of detection quality; the pins stop silent edits only.
    email_macro_attachment_delivered: "2c85396febd40d213f89fda70a879c0478940596ed26b25faf215833f9219e84"
    m365_inbox_rule_external_forward: "d8a5b0c2ac3c1dab1c82641e3c7df3c60075bc011456863af0638c91238231ca"
    # 2026-10-20: also written after this oracle by the same author, to close the user_execution gap (T1204.002).
    win_office_spawns_shell: "5365f833d20260efc2fafd6081b57526e11fa7bd5e7f243372769ccc9a234e14"

expected_sequence:
  - phish_delivery
  - user_execution
  - c2_beacon
  - victim_session
  - proxy_pool_logins
  - foreign_login
  - inbox_rule
  - payment_redirect

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 3600

# A relationship is declared only where the telemetry carries a SHARED OBSERVABLE at both ends
# (authoring rule 2 of the other oracles). phish_delivery and inbox_rule have no parser, so no
# event, so no entity: no edge is claimed to or from them. victim_session is benign context.
allowed_relationships:
  - {from: user_execution,     to: c2_beacon,          allowed: true, causal_kind: execution}          # same workstation + account
  - {from: c2_beacon,          to: proxy_pool_logins,  allowed: true, causal_kind: credential_access}  # same account
  - {from: proxy_pool_logins,  to: foreign_login,      allowed: true, causal_kind: credential_reuse}   # same account
  - {from: foreign_login,      to: payment_redirect,   allowed: true, causal_kind: impact}             # same account
  # Anti-causal non-edges (the fraud never precedes the access that enabled it):
  - {from: payment_redirect,   to: proxy_pool_logins,  allowed: false, causal_kind: none}
  - {from: foreign_login,      to: user_execution,     allowed: false, causal_kind: none}

detection_points:
  phish_delivery:
    step: phish_delivery
    role: "spear-phishing mail with a malicious attachment is delivered"
    expected_event_source: "mail_gateway message log (class 4009 Email Activity, activity 2 Receive; parser added 2026-10-14)"
    expected_rules:
      - {rule_id: "b9520921-f098-4f6d-b49e-2691ed51711f", title: "Inbound email with a macro-capable attachment was delivered", level: medium, role: spear-phishing attachment detection (rule added 2026-10-20; gap closed)}
    gap: {no_rule_exists: false}

  user_execution:
    step: user_execution
    role: "the user opens the attachment: the office app spawns an encoded PowerShell"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1)"
    expected_rules:
      - {rule_id: "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10", title: "Document host spawned a shell or script host", level: high, role: user-execution detection (rule added 2026-10-20; gap closed)}
    gap: {no_rule_exists: false}

  c2_beacon:
    step: c2_beacon
    role: "20+ outbound connections at a regular interval from the infected workstation"
    expected_event_source: "sysmon EventID 3 (class 4001, activity 7)"
    expected_rules:
      - {rule_id: "f6071829-a3b4-4c53-9d6e-7f8091a2b526", title: "Regular-interval outbound connections from one source (beaconing)", level: medium, role: command-and-control detection}
    gap: {no_rule_exists: false}

  victim_session:
    step: victim_session
    role: "the account's own, benign, earlier login from its home country (enabling telemetry)"
    expected_event_source: "cef authentication success (class 3002, activity 1)"
    context: true
    expected_rules: []
    must_not_fire:
      - "7081a2b3-c405-4de3-be5f-6a7b8c9d0e12"    # a single-country login is not impossible travel
    gap:
      no_rule_exists: true
      reason: >
        Not an attack step: ordinary telemetry that the foreign login is judged against
        (impossible travel needs two countries). Declared so a rule that starts firing on a
        lone home-country login is reported as a stale gap.

  proxy_pool_logins:
    step: proxy_pool_logins
    role: "one account failing authentication from 8+ distinct source addresses in 300 s"
    expected_event_source: "cef authentication failure (class 3002, activity 4)"
    expected_rules:
      - {rule_id: "4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90", title: "Credential stuffing (one account attempted from many distinct source IPs)", level: high, role: distributed credential-stuffing detection}
    must_not_fire:
      - "d83b71c3-93eb-439f-86f9-5985ebcc38cb"    # 15 s apart: nowhere near 10 failures in 60 s
      - "6f1c8a2e-0d3b-4c11-9a21-7b5e2f9a1c01"    # one failure per address: far under the per-IP threshold
    gap: {no_rule_exists: false}

  foreign_login:
    step: foreign_login
    role: "the same account logs in successfully from a second country within the hour"
    expected_event_source: "cef authentication success (class 3002, activity 1) + geo enrichment"
    expected_rules:
      - {rule_id: "7081a2b3-c405-4de3-be5f-6a7b8c9d0e12", title: "Impossible travel (same account, distinct countries in a short window)", level: high, role: account-takeover detection}
    gap: {no_rule_exists: false}

  inbox_rule:
    step: inbox_rule
    role: "the attacker creates a mailbox rule that forwards and hides replies"
    expected_event_source: "m365_audit New-InboxRule (class 6003, activity 1; parser added 2026-10-14)"
    expected_rules:
      - {rule_id: "0ca6b652-ad3a-470b-8d31-f43f97c11799", title: "Mailbox rule forwards mail to an external address", level: high, role: forwarding-rule persistence detection (rule added 2026-10-20; gap closed)}
    gap: {no_rule_exists: false}

  payment_redirect:
    step: payment_redirect
    role: "the vendor's bank account is changed in the finance application"
    expected_event_source: "db_audit UPDATE (class 6005, activity 3)"
    expected_rules: []
    gap:
      no_rule_exists: true
      attack_technique: "T1565.001"      # Data Manipulation: Stored Data Manipulation
      reason: >
        The banking-DB rules cover activity 5 (privileged operation: bank_db_priv_esc) and
        activity 1 (distinct-object reads: bank_mass_card_read). A plain UPDATE (activity 3) on a
        payment-details table has no rule.

# Step dependencies (read by oracle_consistency / scenario_matrix / evasion_search): a step that is
# only detectable BECAUSE of an earlier context step. Dropping the context step blinds the
# dependent by design (no home-country login, no impossible travel); that is a negative control
# for the context step, not collateral damage.
step_dependencies:
  foreign_login: [victim_session]

severity_band:
  score: {min: 40, max: 100}
  severity_id: {min: 3, max: 6}
  dominant_band: "high"

evidence:
  correlation_key: [actor.user.name]
  per_step:
    user_execution:    {fields: [actor.user.name, actor.process.name, src_endpoint.hostname]}
    c2_beacon:         {fields: [src_endpoint.ip, dst_endpoint.ip, actor.user.name]}
    victim_session:    {fields: [actor.user.name, src_endpoint.ip]}
    proxy_pool_logins: {fields: [actor.user.name, src_endpoint.ip]}
    foreign_login:     {fields: [actor.user.name, src_endpoint.ip, src_endpoint.location.country]}
    payment_redirect:  {fields: [actor.user.name, dst_endpoint.hostname, unmapped.db.object]}

incident_membership:
  incident_count: 1          # full-chain incidents WS-8 produces: one actor track spans every alerting step
  incident_key: "phishing-bec"
  include: [phish_delivery, user_execution, c2_beacon, victim_session, proxy_pool_logins, foreign_login, inbox_rule, payment_redirect]
  cross_step_rule_ids:
    - "f6071829-a3b4-4c53-9d6e-7f8091a2b526"
    - "4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90"
    - "7081a2b3-c405-4de3-be5f-6a7b8c9d0e12"

# Read-side campaign view (links incidents sharing a member alert). REPORTED, never gated.
campaign_membership:
  campaign_count: 1
  full_coverage: false   # measured 2026-10-20: the mail/M365 alerts carry no actor, so no single campaign spans every step (F14)


# =============================================================================
# known_gaps -- the disagreements between this oracle and the system that are KNOWN, DATED and
# DECLARED HERE, in the storyline's own answer key (owner decision 2026-11-20; schema and failure
# modes: eval/twin/known_gaps.py). This is declaration data, not oracle semantics: no grader
# scores against it, the mutation probe skips it, and editing it is not an oracle semantic change.
# Every entry is checked from both sides: a disagreement with no entry FAILS, an entry whose kind
# does not match what is observed FAILS, and an entry that no longer reproduces FAILS (STALE) --
# delete it, that is the ratchet working. Migrated 2026-11-20 from the name-keyed tables in
# oracle_consistency / oracle_derive / oracle_mutate; reasons are carried over verbatim.
# =============================================================================
known_gaps:
  # 2026-10-03 phishing_bec: both anti-causal pairs share the compromised account with the steps they must not precede, so the actor track joins them in both directions.
  - kind: order_blind_join
    from: payment_redirect
    to: proxy_pool_logins
    since: '2026-10-02'
    reason: 'directional_discrimination=0.0 (SSOT 2026-10-01): the WS-8 graph joins every forbidden pair
      because the entities at both ends overlap (per-entity tracks never merge, so a shared address/account
      yields an edge in BOTH directions). The oracle''s anti-causal non-edges are therefore not enforceable
      by this correlator. Waived by class, not hidden: closing it means grading edge direction by event
      time or by WS-8 typed caused_by edges, a separate ratified step.'
  - kind: order_blind_join
    from: foreign_login
    to: user_execution
    since: '2026-10-02'
    reason: 'directional_discrimination=0.0 (SSOT 2026-10-01): the WS-8 graph joins every forbidden pair
      because the entities at both ends overlap (per-entity tracks never merge, so a shared address/account
      yields an edge in BOTH directions). The oracle''s anti-causal non-edges are therefore not enforceable
      by this correlator. Waived by class, not hidden: closing it means grading edge direction by event
      time or by WS-8 typed caused_by edges, a separate ratified step.'
  - kind: derive_waiver
    finding: F14
    step: '-'
    item: incident_count
    since: '2026-10-20'
    reason: 'known and measured, not resolved: closing the phish_delivery and inbox_rule gaps (rules email_macro_attachment_delivered,
      m365_inbox_rule_external_forward) adds two alert-raising steps whose entities do not meet the endpoint/identity
      chain: a delivered message has no actor, and the M365 UserId is a UPN (user@corp.example) while every
      other step uses the bare account name (WS-8 compares actors verbatim; the DOMAIN\/UPN residual is
      the open F2 finding). So no incident carries those two steps (incident_membership_ok=False); since
      win_office_spawns_shell the run forms TWO incidents (the account track and a workstation track, shape
      pinned in test_storylines_wide.py); detection coverage rose, chain joining fell. Owner decision pending
      (canonicalise UPN, add a recipient entity, or retarget).'
  - kind: f2_cap
    max: 1
    since: '2026-10-03'
    reason: common_beaconing's periodicity bound (coefficient of variation of the inter-arrival times) is
      not modelled by this static interpreter, so c2_beacon is reported UNDECIDED rather than guessed. The
      engine and the negative twins (5-of-6 beats, irregular interval) cover it.
  - kind: mutant_survivor
    operator: change_incident_count
    outcome: IMPROVED
    max: 1
    since: '2026-10-20'
    reason: 'same fact as it_intrusion''s waiver: since the mail and M365 rules now raise alerts whose entities
      do not meet the account chain (a delivered message has no actor; the M365 UserId is a UPN), incident_membership_ok
      is False on the true run, so lowering incident_count 1->0 turns it True. F14 in oracle_derive.py reports
      the same fact (dated 2026-10-20 waiver); owner decision pending, WS-8 tracks-never-merge untouched'
  - kind: mutant_survivor
    operator: drop_step
    outcome: SURVIVED
    max: 3
    since: '2026-10-13'
    reason: 'no rule fires at phish_delivery / victim_session / inbox_rule (two no-parser gaps, one context
      step): dropping them from the sequence changes no emitted alert and no graded output'
  - kind: mutant_survivor
    operator: flip_gap_to_false
    outcome: SURVIVED
    max: 5
    since: '2026-10-13'
    reason: the five gap steps declare no expected rule and no rule fires there, so nothing reads the gap
      flag; a flip is only observable where a rule fires (same mechanism as ai_to_ot's waived flip_gap_to_false)
  - kind: mutant_survivor
    operator: flip_relationship
    outcome: IMPROVED
    max: 2
    since: '2026-10-13'
    reason: '''payment_redirect->proxy_pool_logins'' and ''foreign_login->user_execution'': a forbidden->allowed
      flip on pairs the graph JOINED in both directions (per_forbidden_pair joined=True, the shared account
      bridges both ends), so re-labelling removes a falling forbidden_joins count and the wrong oracle scores
      BETTER because directional_discrimination=0.0 (SSOT 2026-10-01): the pair is graded and joined, and
      the reverse direction is joined too (reverse_joined=True), so the legacy join predicate cannot tell
      a relation from its reverse; the WS-8 tracks never merge and share entities at both ends'
  - kind: mutant_survivor
    operator: reverse_relationship
    outcome: SURVIVED
    max: 4
    since: '2026-10-13'
    reason: 'directional_discrimination=0.0 (SSOT 2026-10-01): the pair is graded and joined, and the reverse
      direction is joined too (reverse_joined=True), so the legacy join predicate cannot tell a relation
      from its reverse; the WS-8 tracks never merge and share entities at both ends'
  - kind: mutant_survivor
    operator: swap_adjacent_steps
    outcome: SURVIVED
    max: 6
    since: '2026-10-13'
    reason: one of the two swapped steps raises no alert (and the entities are shared across the chain),
      so neither alert order nor the entity-bridge fidelity predicate has anything to disagree about
