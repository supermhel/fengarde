# =============================================================================
# FENGARDE eval/twin/oracle_win_credential_theft.yaml
# Grading ground truth for the Windows credential-theft storyline (storyline_win_credential_theft.py):
#   powershell_cradle -> lsass_dump -> directory_tamper -> service_persistence -> log_clear
#
# AUTHORING RULES (written 2026-10-28 BEFORE the builder was run through the pipeline; the builder
# was written first only so the step labels exist, but this file's expectations come from the five
# rules' own description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: every step is covered by a rule
#      shipped on 2026-10-20 (blind-recall funnel). Each of those rules keys on a parser-set
#      HEURISTIC boolean (or, for the log clear, on the event class itself); the heuristic nature
#      is the rules' own documented scope and is probed by the negative twins in the storyline.
#   2. incident_count: every step is performed by ONE compromised account and (except the DC write)
#      from ONE workstation, so one actor track spans the chain: 1.
#   3. THE FORBIDDEN RELATIONSHIP IS A GENUINE ENTITY-DISJOINTNESS CONTROL. `bystander_log_maintenance`
#      is a different administrator clearing a different server's Security log (the documented
#      false-positive shape of win_audit_log_cleared). It rides in the base build, is NOT in
#      expected_sequence (so it is scored as non-attack activity), and shares no account, host or
#      address with the intrusion. The pair log_clear -> bystander_log_maintenance must not be
#      joined. This is NOT the anti-causal reversed-order pattern of the older oracles, so it is
#      NOT expected to be on oracle_consistency's order-blind accepted list.
#   4. SCOPE HONESTY. All five rules are single-shot heuristics: a legitimate admin script, a
#      backup agent reading lsass, a new service account getting an SPN or a scheduled log
#      maintenance all fire them (their descriptions say so). This storyline shows the rules fire on
#      attack-shaped input and stay silent on one-input-away near-misses; it does NOT show a false
#      positive rate on a real estate. win_audit_log_cleared has no sub-threshold input, so it has
#      no negative twin (the parser's EventID/Channel scope check is the only near-miss, covered by
#      the producer fixtures).
# =============================================================================
schema_version: 1
oracle_id: "win-credential-theft-v1"
kind: "attack-chain-grading-oracle"
scope: "win-credential-theft"

provenance:
  authored: "2026-10-28"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  rules_read:
    win_powershell_suspicious_script: "e6d74f5de73c351be57644faa6e92e8bad91160446ed56aa6a13a5f1db661373"
    win_lsass_access_suspicious: "02de7077b3428d4da203017261de603dc47bc14b919bbe3cb9474df0454aa1e9"
    win_ad_sensitive_attribute_modified: "f0b2f3740c74321e81f447038f32a876559b8e00f04a8989a43e5f45fbc04fd9"
    win_service_installed_suspicious_path: "49515e362fc28a1cd35e55611f9116d735a1608040c24d8df0b6ca65bc4f7100"
    win_audit_log_cleared: "385255313468f912449ed7144d6533882a13ab07ff300f6759bc03ac418158e4"

expected_sequence:
  - powershell_cradle
  - lsass_dump
  - directory_tamper
  - service_persistence
  - log_clear

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 3600

allowed_relationships:
  - {from: powershell_cradle,    to: lsass_dump,          allowed: true,  causal_kind: execution}
  - {from: lsass_dump,           to: directory_tamper,    allowed: true,  causal_kind: credential_access}
  - {from: directory_tamper,     to: service_persistence, allowed: true,  causal_kind: persistence}
  - {from: service_persistence,  to: log_clear,           allowed: true,  causal_kind: defense_evasion}
  - {from: log_clear,            to: bystander_log_maintenance, allowed: false, causal_kind: none}

detection_points:
  powershell_cradle:
    step: powershell_cradle
    role: "script-block logging records a download-and-execute cradle (strong indicator or two weak ones)"
    expected_event_source: "windows_eventlog 4104 (class 1002, activity 6, unmapped.powershell.suspicious)"
    expected_rules:
      - {rule_id: "79a1b4be-2ffb-4aba-8051-f09b4863ffc4", title: "Suspicious PowerShell script content", level: high, role: execution detection (T1059.001)}
    gap: {no_rule_exists: false}

  lsass_dump:
    step: lsass_dump
    role: "an untrusted caller opens lsass.exe with a dump-capable access mask"
    expected_event_source: "sysmon EventID 10 (class 1002, activity 5, unmapped.lsass_access_suspicious)"
    expected_rules:
      - {rule_id: "ed287553-9e4b-45c1-8189-625dfbad7442", title: "Suspicious process access to lsass.exe", level: critical, role: credential dumping (T1003.001)}
    gap: {no_rule_exists: false}

  directory_tamper:
    step: directory_tamper
    role: "the stolen account writes a sensitive AD attribute (SPN / delegation / key credential)"
    expected_event_source: "windows_eventlog 5136 (class 3003, activity 6, unmapped.directory.sensitive_attribute)"
    expected_rules:
      - {rule_id: "4243e2e6-8bd0-4c6e-87ec-574d1ec681a5", title: "Sensitive Active Directory attribute modified", level: high, role: account manipulation (T1098)}
    gap: {no_rule_exists: false}

  service_persistence:
    step: service_persistence
    role: "a service is installed from a user-writable path"
    expected_event_source: "windows_eventlog 7045 (class 1002, activity 3, unmapped.service.suspicious_path)"
    expected_rules:
      - {rule_id: "dcddff84-7500-4360-8acc-14768a2ae0b7", title: "Service installed from a suspicious path", level: high, role: persistence (T1543.003)}
    gap: {no_rule_exists: false}

  log_clear:
    step: log_clear
    role: "the Security event log is cleared (single-shot)"
    expected_event_source: "windows_eventlog 1102 (class 1002, activity 4)"
    expected_rules:
      - {rule_id: "17dcc2b9-4d62-4fc2-9833-83954bf1b902", title: "Windows audit log cleared", level: high, role: defense evasion (T1070.001)}
    gap: {no_rule_exists: false}

# No step's detection needs another step's telemetry: every rule here is a single-event predicate.
step_dependencies: {}

severity_band:
  score: {min: 40, max: 100}
  severity_id: {min: 3, max: 6}
  dominant_band: "high"

evidence:
  correlation_key: [actor.user.name]
  per_step:
    powershell_cradle:   {fields: [actor.user.name, src_endpoint.hostname, unmapped.powershell.indicators]}
    lsass_dump:          {fields: [actor.user.name, actor.process.name, unmapped.target_process, unmapped.granted_access]}
    directory_tamper:    {fields: [actor.user.name, unmapped.directory.attribute, unmapped.directory.object_dn]}
    service_persistence: {fields: [actor.user.name, unmapped.service.name, unmapped.service.path]}
    log_clear:           {fields: [actor.user.name, src_endpoint.hostname]}

incident_membership:
  incident_count: 1          # the one compromised account carries every alert-raising step
  incident_key: "win-credential-theft"
  include: [powershell_cradle, lsass_dump, directory_tamper, service_persistence, log_clear]
  cross_step_rule_ids:
    - "79a1b4be-2ffb-4aba-8051-f09b4863ffc4"
    - "ed287553-9e4b-45c1-8189-625dfbad7442"
    - "4243e2e6-8bd0-4c6e-87ec-574d1ec681a5"
    - "dcddff84-7500-4360-8acc-14768a2ae0b7"
    - "17dcc2b9-4d62-4fc2-9833-83954bf1b902"

# Read-side campaign view (links incidents sharing a member alert). REPORTED, never gated.
campaign_membership:
  campaign_count: 1
  full_coverage: true
