# =============================================================================
# FENGARDE eval/twin/oracle_flow_suricata_c2_exfil.yaml
# Grading ground truth for the Suricata C2/exfil flow storyline (storyline_flow_suricata_c2_exfil.py):
#   c2_checkin -> ad_bruteforce -> c2_tasking -> dns_tunnel -> lateral_logons -> rdp_lateral_alert -> priv_grant
#     -> c2_staging -> exfil_alert -> c2_exfil_ack -> rdp_close -> exfil_close -> c2_close
#
# AUTHORING RULES (written 2026-11-20 BEFORE the builder was run through the pipeline; expectations come from
# the rules' own description/detection/siem blocks and the parser docstrings).
#   1. NO RULE WAS INVENTED. Four steps can fire a shipped rule (AD brute force, DNS tunnelling, lateral logons,
#      a privileged-group add). The nine Suricata alert / flow-record steps are honest gaps: no shipped rule
#      reads a Suricata record.
#   2. causal_links (ADR-012 WP 7, basis network_flow) are DERIVED from the flow_id values the builder mints
#      (eval/twin/flow_kit.py), grouped per sensor, joined through time-ordered neighbours. They are NOT typed here.
#      Most endpoints are gap steps, so most links are unalerted today: no alert-raising step shares a flow with
#      another alert-raising step, hence NO link is gradable on the present rule set (ADR-012: reported, not hidden).
#   3. FORBIDDEN PAIRS. The first three are anti-causal (a later stage never enables an earlier one) and share the
#      workstation and the account with the steps they must not precede. The fourth is the scope control:
#      bystander_other_sensor is a benign alert from a second sensor whose flow_id equals the C2 flow's. It shares
#      no address with the attack and must never be joined.
#   4. INCIDENT. The workstation address (and the account it used) spans every alert-raising step: one ip track,
#      one incident.
# =============================================================================
schema_version: 1
oracle_id: "flow-suricata-c2-exfil-v1"
kind: "attack-chain-grading-oracle"
scope: "flow-suricata-c2-exfil"

provenance:
  authored: "2026-11-20"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only; causal_links derived from the builder's own minted flow keys"
  rules_read:
    common_bruteforce: "f685feb7ab0efe2e0cd9ed3427a2e0466c3a0de785cc28deef3c53a0b585919b"
    common_dns_exfil: "eccf4032d315d46f73cc0bb5b16f96983bda04b3538418a1777aadbcc823008f"
    common_dns_tunnel_by_domain: "e85a4cabcf5e211c12bdb5a8b2949bee0f156096a03eca0ea28c6bde84477fcf"
    common_lateral_movement: "2f010d5cf5adb6de7df93f6a30da3ed32029626dccc912f118af9813d0d4c8ae"
    common_password_spray: "c565b58f392c8e85ac08049c49d1ab119846540d7bcbea86f0ea2f4e30d1a089"
    common_priv_grant: "3d7b783edf6df5e578f154446316404f07d0bcc5837ac9180d00481198f8c14d"

expected_sequence:
  - c2_checkin
  - ad_bruteforce
  - c2_tasking
  - dns_tunnel
  - lateral_logons
  - rdp_lateral_alert
  - priv_grant
  - c2_staging
  - exfil_alert
  - c2_exfil_ack
  - rdp_close
  - exfil_close
  - c2_close

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 21600

allowed_relationships:
  - {from: c2_checkin, to: ad_bruteforce, allowed: true, causal_kind: credential_access}   # same workstation
  - {from: ad_bruteforce, to: c2_tasking, allowed: true, causal_kind: command_and_control}   # same workstation
  - {from: c2_tasking, to: dns_tunnel, allowed: true, causal_kind: command_and_control}   # same workstation
  - {from: dns_tunnel, to: lateral_logons, allowed: true, causal_kind: lateral_movement}   # same workstation
  - {from: lateral_logons, to: rdp_lateral_alert, allowed: true, causal_kind: lateral_movement}   # same workstation and account
  - {from: rdp_lateral_alert, to: priv_grant, allowed: true, causal_kind: privilege}   # same workstation
  - {from: priv_grant, to: c2_staging, allowed: true, causal_kind: command_and_control}   # same workstation
  - {from: c2_staging, to: c2_exfil_ack, allowed: true, causal_kind: exfiltration}   # same C2 flow and workstation
  - {from: exfil_alert, to: c2_exfil_ack, allowed: true, causal_kind: exfiltration}   # same outside address
  - {from: c2_exfil_ack, to: rdp_close, allowed: true, causal_kind: lateral_movement}   # same workstation
  - {from: rdp_close, to: exfil_close, allowed: true, causal_kind: exfiltration}   # same file server
  - {from: exfil_close, to: c2_close, allowed: true, causal_kind: command_and_control}   # same outside address
  - {from: lateral_logons, to: ad_bruteforce, allowed: false, causal_kind: none}   # the lateral logons use the account the brute force had not yet guessed
  - {from: priv_grant, to: ad_bruteforce, allowed: false, causal_kind: none}   # the privileged add can never precede the guess that enabled it
  - {from: priv_grant, to: lateral_logons, allowed: false, causal_kind: none}   # the DC group add cannot precede the logons that reached the servers
  - {from: c2_checkin, to: bystander_other_sensor, allowed: false, causal_kind: none}   # same flow_id VALUE on a different sensor: a different flow, no link

# network_flow truth, DERIVED from the flow keys the builder minted (flow_kit.derive_links), never typed by hand.
# Symmetric: ADR-012 gives the basis no direction of its own; the order shown is event time (ADR-011).
# test_flow_storylines.py re-derives this list and fails when it differs.
causal_links:
  - {from: c2_checkin, to: c2_tasking, basis: network_flow}
  - {from: c2_tasking, to: c2_staging, basis: network_flow}
  - {from: rdp_lateral_alert, to: rdp_close, basis: network_flow}
  - {from: c2_staging, to: c2_exfil_ack, basis: network_flow}
  - {from: exfil_alert, to: exfil_close, basis: network_flow}
  - {from: c2_exfil_ack, to: c2_close, basis: network_flow}

detection_points:
  c2_checkin:
    step: c2_checkin
    role: first IDS alert on the workstation's long TLS flow to an outside address
    expected_event_source: suricata_eve alert (class 4001, activity 99)
    expected_rules: []
    gap:
      no_rule_exists: true
      attack_technique: "T1071.001"
      reason: 'No shipped rule reads a Suricata alert or flow record: the IDS verdict is carried as data (unmapped.ids.*, unmapped.suricata.flow.*) and nothing selects it. The link on this step is an unalerted endpoint until one does.'

  ad_bruteforce:
    step: ad_bruteforce
    role: the workstation fails logon 11-13 times in under a minute
    expected_event_source: active_directory 4625 (class 3002, activity 4 Failure)
    expected_rules:
      - {rule_id: "6f1c8a2e-0d3b-4c11-9a21-7b5e2f9a1c01", title: Brute force (many failed logons from one source), level: high, role: credential access (T1110)}
    must_not_fire:
      - "4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90"   # one account, not many
    gap: {no_rule_exists: false}

  c2_tasking:
