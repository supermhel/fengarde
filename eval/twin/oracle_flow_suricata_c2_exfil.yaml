    role: the account adds backdoor-svc to a privileged group on the DC
    expected_event_source: windows_eventlog 4728 (class 3003, activity 5)
    expected_rules:
      - {rule_id: "7d3e9a52-1f6c-4a88-9b3d-2e5c8f1a6d40", title: Privileged group membership grant, level: high, role: persistence (T1098)}
    gap: {no_rule_exists: false}

  c2_staging:
    step: c2_staging
    role: third IDS alert on the same TLS flow
    expected_event_source: suricata_eve alert
    expected_rules: []
    gap:
      no_rule_exists: true
      attack_technique: "T1105"
      reason: 'No shipped rule reads a Suricata alert or flow record: the IDS verdict is carried as data (unmapped.ids.*, unmapped.suricata.flow.*) and nothing selects it. The link on this step is an unalerted endpoint until one does.'

  exfil_alert:
