# =============================================================================
# FENGARDE eval/twin/oracle_excel_loader_domain_abuse.yaml
# Grading ground truth for the keyed Excel-loader spawn-chain storyline (storyline_excel_loader_domain_abuse.py):
#   loader_shell -> ps_encoded -> tool_download -> ps_cradle -> lsass_read -> directory_tamper -> group_escalation -> service_persistence -> stage2_shell -> shadow_delete -> sched_task -> log_clear
#
# AUTHORING RULES (rewritten 2026-11-24 for the spawn-chain restructure; every expectation comes from the rules' own
# description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: every step is covered by a shipped rule.
#   2. incident_count: one compromised account carries every step (the two DC-side steps are performed by the same
#      account): 1.
#   3. THE FORBIDDEN RELATIONSHIPS are the anti-causal reversals of allowed ones: log_clear -> loader_shell,
#      group_escalation -> lsass_read, shadow_delete -> ps_encoded. They share the account with the steps they must not
#      precede, so the actor track joins them in both directions; they are recorded as order_blind_join known gaps.
#   4. causal_links (ADR-012 WP 7) are DERIVED from the builder's RAW Sysmon records by sysmon_tree.derive_links, never
#      typed by hand. TRIGGER LEVEL AND SPAWN ONLY: step B is linked from step A only when B's alert-raising record (the
#      one the builder marks as the step's trigger) is a Sysmon EID 1 whose ParentProcessGuid equals the ProcessGuid of
#      A's trigger. ps_cradle (4104), directory_tamper (5136) and group_escalation (4728) are Windows-log alerts without
#      a parent key: they stay in the sequence for incident realism and are never link endpoints. Their helper process
#      records (the recon children, ldifde, net group) are context, never graded truth.
#   5. SCOPE HONESTY. Every rule here is a single-shot heuristic: this shows they fire on attack-shaped input, not a
#      false-positive rate on a real estate.
# =============================================================================
