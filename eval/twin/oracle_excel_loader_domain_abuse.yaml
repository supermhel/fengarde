# =============================================================================
# FENGARDE eval/twin/oracle_excel_loader_domain_abuse.yaml
# Grading ground truth for the keyed Excel-loader storyline (storyline_excel_loader_domain_abuse.py):
#   loader_shell -> ps_cradle -> lsass_read -> directory_tamper -> group_escalation -> log_clear
#
# AUTHORING RULES (written 2026-11-19 BEFORE the builder was run through the pipeline; the builder was
# written first only so the step labels and the raw process-tree keys exist; every expectation here comes
# from the six rules' own description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: win_office_spawns_shell,
#      win_powershell_suspicious_script, win_lsass_access_suspicious, win_ad_sensitive_attribute_modified,
#      common_priv_grant, win_audit_log_cleared each cover one step.
#   2. incident_count: one compromised account carries every step (the two DC-side steps are performed by the
#      same account): 1.
#   3. THE FORBIDDEN RELATIONSHIPS are the anti-causal reversals of allowed ones: log_clear -> loader_shell,
#      group_escalation -> lsass_read, directory_tamper -> ps_cradle. They share the account with the steps they
#      must not precede, so the actor track joins them in both directions; they are recorded on
#      oracle_consistency's order-blind accepted list, not hidden. Their job is the ADR-011 n gap.
#   4. causal_links (ADR-012 WP 7) are DERIVED from the builder's RAW Sysmon records by
#      sysmon_tree.derive_links (ProcessGuid lineage), never typed by hand; the storyline's test pins this block
#      to that derivation. `via: spawn` = child ParentProcessGuid == parent ProcessGuid (the ADR table);
#      `via: acting_process` = an EID 3 / EID 10 event done by the process an earlier EID 1 created.
#   5. SCOPE HONESTY. Every rule here is a single-shot heuristic: this shows they fire on attack-shaped input,
#      not a false-positive rate on a real estate.
# =============================================================================
schema_version: 1
oracle_id: "excel-loader-domain-abuse-v1"
kind: "attack-chain-grading-oracle"
scope: "excel-loader-domain-abuse"

provenance:
  authored: "2026-11-19"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  rules_read:
    win_office_spawns_shell: "5365f833d20260efc2fafd6081b57526e11fa7bd5e7f243372769ccc9a234e14"
    win_powershell_suspicious_script: "e6d74f5de73c351be57644faa6e92e8bad91160446ed56aa6a13a5f1db661373"
    win_lsass_access_suspicious: "02de7077b3428d4da203017261de603dc47bc14b919bbe3cb9474df0454aa1e9"
    win_ad_sensitive_attribute_modified: "f0b2f3740c74321e81f447038f32a876559b8e00f04a8989a43e5f45fbc04fd9"
    common_priv_grant: "3d7b783edf6df5e578f154446316404f07d0bcc5837ac9180d00481198f8c14d"
    win_audit_log_cleared: "385255313468f912449ed7144d6533882a13ab07ff300f6759bc03ac418158e4"
    # 2026-11-21: pinned AFTER this oracle was authored, by the same author, once the EID 1 process-creation rules
    # (wp/eid1-process-rules) began firing on this storyline's raw process-tree records. NOT independent evidence:
    # the pin stops silent edits only.
    win_lsass_dump_cmdline: "59c684aa473d0ffdda0d168bfa1488833e6395dd9a6dc074eb89c393b9905df1"
    win_event_log_cleared_cmdline: "dccea56d6d175feda9afa3d1c2d8ff1088ab2aa2cc6d05dc0e2a57b2ec649eb7"

expected_sequence:
  - loader_shell
  - ps_cradle
  - lsass_read
  - directory_tamper
  - group_escalation
  - log_clear

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 3600

allowed_relationships:
  - {from: loader_shell,      to: ps_cradle,        allowed: true,  causal_kind: execution}
  - {from: ps_cradle,         to: lsass_read,       allowed: true,  causal_kind: credential_access}
  - {from: lsass_read,        to: directory_tamper, allowed: true,  causal_kind: persistence}
  - {from: directory_tamper,  to: group_escalation, allowed: true,  causal_kind: privilege_escalation}
  - {from: group_escalation,  to: log_clear,        allowed: true,  causal_kind: defense_evasion}
  - {from: log_clear,         to: loader_shell,     allowed: false, causal_kind: none}
  - {from: group_escalation,  to: lsass_read,       allowed: false, causal_kind: none}
  - {from: directory_tamper,  to: ps_cradle,        allowed: false, causal_kind: none}

detection_points:
  loader_shell:
    step: loader_shell
    role: "a document host (Excel) starts a script host (mshta)"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.suspicious)"
    expected_rules:
      - {rule_id: "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10", title: "Document host spawned a shell or script host", level: high, role: user execution (T1204.002)}
    gap: {no_rule_exists: false}

  ps_cradle:
    step: ps_cradle
    role: "script-block logging records a download-and-execute cradle"
    expected_event_source: "windows_eventlog 4104 (class 1002, activity 6, unmapped.powershell.suspicious)"
    expected_rules:
      - {rule_id: "79a1b4be-2ffb-4aba-8051-f09b4863ffc4", title: "Suspicious PowerShell script content", level: high, role: execution detection (T1059.001)}
    gap: {no_rule_exists: false}

  lsass_read:
    step: lsass_read
    role: "an untrusted caller opens lsass.exe with a dump-capable access mask"
    expected_event_source: "sysmon EventID 10 (class 1002, activity 5, unmapped.lsass_access_suspicious)"
    expected_rules:
      - {rule_id: "ed287553-9e4b-45c1-8189-625dfbad7442", title: "Suspicious process access to lsass.exe", level: critical, role: credential dumping (T1003.001)}
      - {rule_id: "c933c309-6991-402e-ad83-332213c30856", title: "LSASS memory dump started from the command line", level: critical, role: credential-dumping detection on the dumper's process-creation event (T1003.001) (rule added 2026-11-21; the storyline's raw process tree already carried this command line)}
    gap: {no_rule_exists: false}

  directory_tamper:
    step: directory_tamper
    role: "the stolen account writes a sensitive AD attribute (SPN / delegation / key credential)"
    expected_event_source: "windows_eventlog 5136 (class 3003, activity 6, unmapped.directory.sensitive_attribute)"
    expected_rules:
      - {rule_id: "4243e2e6-8bd0-4c6e-87ec-574d1ec681a5", title: "Sensitive Active Directory attribute modified", level: high, role: account manipulation (T1098)}
    gap: {no_rule_exists: false}

  group_escalation:
    step: group_escalation
    role: "a member is added to a privileged global group (single-shot)"
    expected_event_source: "windows_eventlog 4728 (class 3003, activity 5)"
    expected_rules:
      - {rule_id: "7d3e9a52-1f6c-4a88-9b3d-2e5c8f1a6d40", title: "Privileged group membership grant", level: high, role: account manipulation (T1098)}
    gap: {no_rule_exists: false}

  log_clear:
    step: log_clear
    role: "the Security event log is cleared (single-shot)"
    expected_event_source: "windows_eventlog 1102 (class 1002, activity 4)"
    expected_rules:
      - {rule_id: "17dcc2b9-4d62-4fc2-9833-83954bf1b902", title: "Windows audit log cleared", level: high, role: defense evasion (T1070.001)}
      - {rule_id: "cebb9ee4-a72c-48d3-9aad-06b3aff0860c", title: "Event log cleared from the command line", level: high, role: defense-evasion detection on the wevtutil cl process-creation event (T1070.001) (rule added 2026-11-21; the storyline's raw process tree already carried this command line)}
    gap: {no_rule_exists: false}

# No step's detection needs another step's telemetry: every rule here is a single-event predicate.
step_dependencies: {}

severity_band:
  score: {min: 40, max: 100}
  severity_id: {min: 3, max: 6}
  dominant_band: "high"

evidence:
  correlation_key: [actor.user.name]
  per_step:
    loader_shell:     {fields: [actor.user.name, actor.process.name, unmapped.process_launch.parent]}
    ps_cradle:        {fields: [actor.user.name, src_endpoint.hostname, unmapped.powershell.indicators]}
    lsass_read:       {fields: [actor.process.name, unmapped.target_process, unmapped.granted_access]}
    directory_tamper: {fields: [actor.user.name, unmapped.directory.attribute, unmapped.directory.object_dn]}
    group_escalation: {fields: [actor.user.name, unmapped.target_user.name]}
    log_clear:        {fields: [actor.user.name, src_endpoint.hostname]}

incident_membership:
  incident_count: 1
  incident_key: "excel-loader-domain-abuse"
  include: [loader_shell, ps_cradle, lsass_read, directory_tamper, group_escalation, log_clear]
  cross_step_rule_ids:
