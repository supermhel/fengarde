# =============================================================================
# FENGARDE eval/twin/oracle_flow_zeek_ot_pivot.yaml
# Grading ground truth for the Zeek OT-pivot flow storyline (storyline_flow_zeek_ot_pivot.py):
#   refused_scan -> ssh_bruteforce -> dns_tunnel_open -> modbus_recon -> lateral_logons -> dns_tunnel_stage -> priv_grant
#     -> dns_backup_open -> modbus_write -> dns_backup_resume -> dns_tunnel_exfil -> modbus_restore -> dns_tunnel_final
#     -> modbus_close -> dns_tunnel_close
#
# Two Zeek DNS-over-TCP connections each raise one alert per burst (common_dns_exfil: 40 distinct names / 60 s, alert id
# per 60 s bucket): the tunnel's four bursts share one uid (3 links), the backup channel's two bursts share another
# (1 link). Four gradable network_flow links. The Modbus session and the conn.log rows are declared gaps
# (ot_write_unlisted_source is default-off) and context only.
#
# AUTHORING RULES (written 2026-11-24 BEFORE the new builder was run through the pipeline; expectations come from the
# rules' own description/detection/siem blocks and the parser docstrings).
#   1. NO RULE WAS INVENTED. A step that no shipped rule reads is an honest gap and its records are CONTEXT, never a
#      link endpoint.
#   2. causal_links (ADR-012 WP 7, basis network_flow) are DERIVED from the flow keys the builder mints on its TRIGGER
#      records (eval/twin/flow_kit.py), grouped per sensor scope, joined through time-ordered neighbours: n alerts on one
#      flow give n-1 links. They are NOT typed here. test_flow_storylines.py re-derives the list and cross-checks every
#      trigger declaration against the alerts the real detector raises.
#   3. ONE ATTRIBUTION RULE FOR FOLDED ALERTS (grader, report.py, test_timeline_order, this oracle): an alert id minted by
#      two steps belongs to the EARLIEST step. This storyline folds nothing: every step on a flow sits in its own rule
#      bucket (severity-1 hits more than one hour apart, DNS bursts more than 60 s apart) or on a different rule.
#   4. FORBIDDEN PAIRS are anti-causal (a later stage never enables an earlier one) and share the host and the account
#      with the steps they must not precede; the last one is the scope/entity control (the bystander shares an address
#      or a flow-id VALUE with the attack and no flow KEY).
#   5. INCIDENT. One host address spans every alert-raising step: one ip track, one incident.
# =============================================================================
