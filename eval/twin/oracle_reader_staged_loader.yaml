expected_sequence:
  - reader_shell
  - ps_encoded
  - ps_cradle
  - lsass_read
  - tool_download
  - directory_tamper
  - service_persistence
  - sched_task
  - shadow_delete
  - account_add
  - log_clear

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 3600

allowed_relationships:
  - {from: reader_shell,        to: ps_encoded,          allowed: true,  causal_kind: execution}
  - {from: ps_encoded,          to: ps_cradle,           allowed: true,  causal_kind: execution}
  - {from: ps_cradle,           to: lsass_read,          allowed: true,  causal_kind: credential_access}
  - {from: lsass_read,          to: tool_download,       allowed: true,  causal_kind: ingress_tool_transfer}
  - {from: tool_download,       to: directory_tamper,    allowed: true,  causal_kind: account_manipulation}
  - {from: directory_tamper,    to: service_persistence, allowed: true,  causal_kind: persistence}
  - {from: service_persistence, to: sched_task,          allowed: true,  causal_kind: persistence}
  - {from: sched_task,          to: shadow_delete,       allowed: true,  causal_kind: impact}
  - {from: shadow_delete,       to: account_add,         allowed: true,  causal_kind: persistence}
  - {from: account_add,         to: log_clear,           allowed: true,  causal_kind: defense_evasion}
  - {from: log_clear,           to: reader_shell,        allowed: false, causal_kind: none}
  - {from: sched_task,          to: ps_cradle,           allowed: false, causal_kind: none}
  - {from: directory_tamper,    to: lsass_read,          allowed: false, causal_kind: none}

detection_points:
  reader_shell:
    step: reader_shell
    role: "a document host (the PDF reader) starts a command shell"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.suspicious)"
    expected_rules:
      - {rule_id: "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10", title: "Document host spawned a shell or script host", level: high, role: user execution (T1204.002)}
    gap: {no_rule_exists: false}

  ps_encoded:
    step: ps_encoded
    role: "the shell starts a PowerShell with an encoded command"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "df8465f8-c959-404a-b7dd-611c7f084ee2", title: "PowerShell started with an encoded command", level: medium, role: execution detection on the process-creation event (T1059.001)}
    gap: {no_rule_exists: false}

  ps_cradle:
    step: ps_cradle
    role: "script-block logging records a download-and-execute cradle"
    expected_event_source: "windows_eventlog 4104 (class 1002, activity 6, unmapped.powershell.suspicious)"
    expected_rules:
      - {rule_id: "79a1b4be-2ffb-4aba-8051-f09b4863ffc4", title: "Suspicious PowerShell script content", level: high, role: execution detection (T1059.001)}
    gap: {no_rule_exists: false}

  lsass_read:
    step: lsass_read
    role: "the loader the PowerShell staged is started against lsass.exe and opens it with a dump-capable access mask"
    expected_event_source: "sysmon EventID 1 + EventID 10 (class 1002, activity 5, unmapped.lsass_access_suspicious)"
    expected_rules:
      - {rule_id: "c933c309-6991-402e-ad83-332213c30856", title: "LSASS memory dump started from the command line", level: critical, role: credential-dumping detection on the loader's process-creation event (T1003.001)}
      - {rule_id: "ed287553-9e4b-45c1-8189-625dfbad7442", title: "Suspicious process access to lsass.exe", level: critical, role: credential dumping (T1003.001)}
    gap: {no_rule_exists: false}

  tool_download:
    step: tool_download
    role: "the loader fetches its next-stage module with certutil"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "0de0758f-a62c-405b-adcf-fb1d602cd321", title: "certutil used to download a file", level: high, role: ingress tool transfer (T1105)}
    gap: {no_rule_exists: false}

  directory_tamper:
    step: directory_tamper
    role: "the stolen account writes a sensitive AD attribute (SPN / delegation / key credential)"
    expected_event_source: "windows_eventlog 5136 (class 3003, activity 6, unmapped.directory.sensitive_attribute)"
    expected_rules:
      - {rule_id: "4243e2e6-8bd0-4c6e-87ec-574d1ec681a5", title: "Sensitive Active Directory attribute modified", level: high, role: account manipulation (T1098)}
    gap: {no_rule_exists: false}

  service_persistence:
    step: service_persistence
    role: "the loader creates a service whose image path is in a user-writable folder (sc.exe create, then Event 7045)"
    expected_event_source: "sysmon EventID 1 + windows_eventlog 7045 (class 1002, activity 3, unmapped.service.suspicious_path)"
    expected_rules:
      - {rule_id: "1abfb057-d081-401d-be13-547958235343", title: "Service created from the command line (sc.exe create)", level: medium, role: persistence detection on the sc.exe create process-creation event (T1543.003)}
      - {rule_id: "dcddff84-7500-4360-8acc-14768a2ae0b7", title: "Service installed from a suspicious path", level: high, role: persistence (T1543.003)}
    gap: {no_rule_exists: false}

  sched_task:
    step: sched_task
    role: "the loader registers a scheduled task"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "976d13c4-7cb5-4b94-be44-1e623af130b9", title: "Scheduled task created from the command line (schtasks /create)", level: low, role: persistence (T1053.005)}
    gap: {no_rule_exists: false}

  shadow_delete:
    step: shadow_delete
    role: "the loader deletes the volume shadow copies"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "d34cce6e-4cb8-4566-a8cf-ee13dc054256", title: "Volume shadow copies deleted or recovery disabled from the command line", level: high, role: inhibit system recovery (T1490)}
    gap: {no_rule_exists: false}

  account_add:
    step: account_add
    role: "the loader adds a local backdoor account"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "f909babc-7b4d-46f3-a2eb-b0ea711fa8c9", title: "Local account created or added to Administrators from the command line (net user /add)", level: high, role: persistence (T1136.001)}
    gap: {no_rule_exists: false}

  log_clear:
    step: log_clear
    role: "the loader clears the Security event log (wevtutil cl, then Event 1102)"
    expected_event_source: "sysmon EventID 1 + windows_eventlog 1102 (class 1002, activity 4)"
    expected_rules:
      - {rule_id: "cebb9ee4-a72c-48d3-9aad-06b3aff0860c", title: "Event log cleared from the command line", level: high, role: defense-evasion detection on the wevtutil cl process-creation event (T1070.001)}
      - {rule_id: "17dcc2b9-4d62-4fc2-9833-83954bf1b902", title: "Windows audit log cleared", level: high, role: defense evasion (T1070.001)}
    gap: {no_rule_exists: false}

