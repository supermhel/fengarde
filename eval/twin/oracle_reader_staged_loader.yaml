# =============================================================================
# FENGARDE eval/twin/oracle_reader_staged_loader.yaml
# Grading ground truth for the keyed PDF-reader staged-loader spawn-chain storyline (storyline_reader_staged_loader.py):
#   reader_shell -> ps_encoded -> ps_cradle -> lsass_read -> tool_download -> directory_tamper -> service_persistence -> sched_task -> shadow_delete -> account_add -> log_clear
#
# AUTHORING RULES (rewritten 2026-11-24 for the spawn-chain restructure; every expectation comes from the rules' own
# description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: every step is covered by a shipped rule.
#   2. incident_count: one compromised account carries every step (the DC-side step is performed by the same
#      account): 1.
#   3. THE FORBIDDEN RELATIONSHIPS are the anti-causal reversals of allowed ones: log_clear -> reader_shell,
#      sched_task -> ps_cradle, directory_tamper -> lsass_read. They share the account with the steps they must not
#      precede, so the actor track joins them in both directions; they are recorded as order_blind_join known gaps.
#   4. causal_links (ADR-012 WP 7) are DERIVED from the builder's RAW Sysmon records by sysmon_tree.derive_links, never
#      typed by hand. TRIGGER LEVEL AND SPAWN ONLY: step B is linked from step A only when B's alert-raising record (the
#      one the builder marks as the step's trigger) is a Sysmon EID 1 whose ParentProcessGuid equals the ProcessGuid of
#      A's trigger. ps_cradle (4104) and directory_tamper (5136 on the DC) are alerts without a parent key: they stay in
#      the sequence for incident realism and are never link endpoints; their helper process records (the recon
#      children, ldifde) are context, never graded truth. The loader's step (lsass_read) is the parent of six steps.
#   5. SCOPE HONESTY. Every rule here is a single-shot heuristic: this shows they fire on attack-shaped input, not a
#      false-positive rate on a real estate.
# =============================================================================
schema_version: 1
oracle_id: "reader-staged-loader-v2"
kind: "attack-chain-grading-oracle"
scope: "reader-staged-loader"

provenance:
  authored: "2026-11-24"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  telemetry: "synthetic: every record is authored by the storyline builder (Emitter.add stamps meta.twin_synthetic); no real Sysmon or Windows event capture exists in the repository"
  rules_read:
    win_office_spawns_shell: "5365f833d20260efc2fafd6081b57526e11fa7bd5e7f243372769ccc9a234e14"
    win_powershell_encoded_command: "a693a8261d8aba9da49035624ae6701ed8b7e17a055f43d26fb29b7643fbb7b2"
    win_powershell_suspicious_script: "e6d74f5de73c351be57644faa6e92e8bad91160446ed56aa6a13a5f1db661373"
    win_lsass_dump_cmdline: "59c684aa473d0ffdda0d168bfa1488833e6395dd9a6dc074eb89c393b9905df1"
    win_lsass_access_suspicious: "02de7077b3428d4da203017261de603dc47bc14b919bbe3cb9474df0454aa1e9"
    win_certutil_download: "3d751c1356060870f4194a22fa7b9e55922982225197efd2d5272d8f32b25a0c"
    win_ad_sensitive_attribute_modified: "f0b2f3740c74321e81f447038f32a876559b8e00f04a8989a43e5f45fbc04fd9"
    win_service_created_cmdline: "3e6c7ba1dd4c8a9ef190c25952a92c2534f91c535e6a26f094eea3ab3d1bddf5"
    win_service_installed_suspicious_path: "49515e362fc28a1cd35e55611f9116d735a1608040c24d8df0b6ca65bc4f7100"
    win_scheduled_task_created: "b3e05e756fe0636a901653babc2e7dc682e82dbd15a2bfbba042999fda1aa747"
    win_shadow_copy_deleted: "f8f1b55bbc71f3ab378a6dca8644d6e2692ce970c0d8da1644eab17f80ef82d2"
    win_local_account_created: "f2437dd80680623b678d07c04dd06f2dd27c0a08759ed95a97830d703be1dc15"
    win_event_log_cleared_cmdline: "dccea56d6d175feda9afa3d1c2d8ff1088ab2aa2cc6d05dc0e2a57b2ec649eb7"
