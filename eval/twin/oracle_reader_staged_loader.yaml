  - {from: lsass_read, to: shadow_delete, basis: process_tree, via: spawn}
  - {from: lsass_read, to: tool_download, basis: process_tree, via: spawn}
  - {from: ps_encoded, to: lsass_read, basis: process_tree, via: spawn}
  - {from: reader_shell, to: ps_encoded, basis: process_tree, via: spawn}
