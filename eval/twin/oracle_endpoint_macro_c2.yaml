# =============================================================================
# FENGARDE eval/twin/oracle_endpoint_macro_c2.yaml
# Grading ground truth for the keyed macro-to-C2 storyline (storyline_endpoint_macro_c2.py):
#   macro_shell -> ps_cradle -> lsass_read -> service_persistence -> c2_beacon -> log_clear
#
# AUTHORING RULES (written 2026-11-19 BEFORE the builder was run through the pipeline; the builder was
# written first only so the step labels and the raw process-tree keys exist; every expectation here comes
# from the six rules' own description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: every step is covered by a shipped rule
#      (win_office_spawns_shell, win_powershell_suspicious_script, win_lsass_access_suspicious,
#      win_service_installed_suspicious_path, common_beaconing, win_audit_log_cleared).
#   2. incident_count: first written as 1 (one account, one workstation). CORRECTED 2026-11-19, after reading
#      report._incident_membership_grade and before the oracle was re-scored: that field counts the incidents
#      carrying the FULL chain, and a chain whose every alert names the same account AND the same workstation is
#      carried by BOTH WS-8 tracks (the actor track and the device track; tracks never merge), so the intent-first
#      answer is 2, not 1. (The storylines whose DC-side steps leave the workstation have one full-chain track.)
#   3. THE FORBIDDEN RELATIONSHIPS are the anti-causal reversals of allowed ones (a later step cannot cause
#      an earlier one): log_clear -> macro_shell, c2_beacon -> lsass_read, service_persistence -> ps_cradle.
#      Like the older storylines' reversed pairs they share the account and host with the steps they must
#      not precede, so the actor track joins them in both directions; they are recorded on
#      oracle_consistency's order-blind accepted list, not hidden. Their job here is the ADR-011 n gap:
#      each survives to two distinct timed edges of one incident graph.
#   4. causal_links (ADR-012 WP 7) are DERIVED from the builder's RAW Sysmon records by
#      sysmon_tree.derive_links (parent -> child process lineage by ProcessGuid), never typed by hand;
#      the storyline's test pins this block to that derivation for several seeds. `via: spawn` is the ADR
#      table's rule (child ParentProcessGuid == parent ProcessGuid); `via: acting_process` marks an
#      EID 3 / EID 10 event done BY the process an earlier EID 1 created.
#   5. SCOPE HONESTY. Every rule here is a single-shot heuristic or a coarse volume rule; the storyline
#      shows they fire on attack-shaped input, not a false-positive rate on a real estate.
# =============================================================================
schema_version: 1
oracle_id: "endpoint-macro-c2-v1"
kind: "attack-chain-grading-oracle"
scope: "endpoint-macro-c2"

provenance:
  authored: "2026-11-19"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  rules_read:
    win_office_spawns_shell: "5365f833d20260efc2fafd6081b57526e11fa7bd5e7f243372769ccc9a234e14"
    win_powershell_suspicious_script: "e6d74f5de73c351be57644faa6e92e8bad91160446ed56aa6a13a5f1db661373"
    win_lsass_access_suspicious: "02de7077b3428d4da203017261de603dc47bc14b919bbe3cb9474df0454aa1e9"
    win_service_installed_suspicious_path: "49515e362fc28a1cd35e55611f9116d735a1608040c24d8df0b6ca65bc4f7100"
    common_beaconing: "b83ae4d66ca4e8634540c5efeb8d35f21b595d2e4426793d76eb4115a7dd8b5e"
    win_audit_log_cleared: "385255313468f912449ed7144d6533882a13ab07ff300f6759bc03ac418158e4"

expected_sequence:
  - macro_shell
  - ps_cradle
  - lsass_read
  - service_persistence
  - c2_beacon
  - log_clear

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 3600

allowed_relationships:
  - {from: macro_shell,          to: ps_cradle,           allowed: true,  causal_kind: execution}
  - {from: ps_cradle,            to: lsass_read,          allowed: true,  causal_kind: credential_access}
  - {from: lsass_read,           to: service_persistence, allowed: true,  causal_kind: persistence}
  - {from: service_persistence,  to: c2_beacon,           allowed: true,  causal_kind: command_and_control}
  - {from: c2_beacon,            to: log_clear,           allowed: true,  causal_kind: defense_evasion}
  - {from: log_clear,            to: macro_shell,         allowed: false, causal_kind: none}
  - {from: c2_beacon,            to: lsass_read,          allowed: false, causal_kind: none}
  - {from: service_persistence,  to: ps_cradle,           allowed: false, causal_kind: none}

detection_points:
  macro_shell:
    step: macro_shell
    role: "a document host (Word) starts a PowerShell"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.suspicious)"
    expected_rules:
      - {rule_id: "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10", title: "Document host spawned a shell or script host", level: high, role: user execution (T1204.002)}
    gap: {no_rule_exists: false}

  ps_cradle:
    step: ps_cradle
    role: "script-block logging records a download-and-execute cradle"
    expected_event_source: "windows_eventlog 4104 (class 1002, activity 6, unmapped.powershell.suspicious)"
    expected_rules:
      - {rule_id: "79a1b4be-2ffb-4aba-8051-f09b4863ffc4", title: "Suspicious PowerShell script content", level: high, role: execution detection (T1059.001)}
    gap: {no_rule_exists: false}

  lsass_read:
    step: lsass_read
    role: "an untrusted caller opens lsass.exe with a dump-capable access mask"
    expected_event_source: "sysmon EventID 10 (class 1002, activity 5, unmapped.lsass_access_suspicious)"
    expected_rules:
      - {rule_id: "ed287553-9e4b-45c1-8189-625dfbad7442", title: "Suspicious process access to lsass.exe", level: critical, role: credential dumping (T1003.001)}
    gap: {no_rule_exists: false}

  service_persistence:
    step: service_persistence
    role: "a service is installed from a user-writable path"
    expected_event_source: "windows_eventlog 7045 (class 1002, activity 3, unmapped.service.suspicious_path)"
    expected_rules:
      - {rule_id: "dcddff84-7500-4360-8acc-14768a2ae0b7", title: "Service installed from a suspicious path", level: high, role: persistence (T1543.003)}
    gap: {no_rule_exists: false}

  c2_beacon:
    step: c2_beacon
    role: "20+ accepted outbound connections from one source at a regular interval"
    expected_event_source: "sysmon EventID 3 (class 4001, activity 7)"
    expected_rules:
      - {rule_id: "f6071829-a3b4-4c53-9d6e-7f8091a2b526", title: "Regular-interval outbound connections from one source (beaconing)", level: medium, role: command and control (T1071)}
    gap: {no_rule_exists: false}

  log_clear:
    step: log_clear
    role: "the Security event log is cleared (single-shot)"
    expected_event_source: "windows_eventlog 1102 (class 1002, activity 4)"
    expected_rules:
      - {rule_id: "17dcc2b9-4d62-4fc2-9833-83954bf1b902", title: "Windows audit log cleared", level: high, role: defense evasion (T1070.001)}
    gap: {no_rule_exists: false}

# No step's detection needs another step's telemetry: every rule here keys on its own events.
step_dependencies: {}

severity_band:
  score: {min: 40, max: 100}
  severity_id: {min: 3, max: 6}
  dominant_band: "high"

evidence:
  correlation_key: [actor.user.name]
  per_step:
    macro_shell:         {fields: [actor.user.name, actor.process.name, unmapped.process_launch.parent]}
    ps_cradle:           {fields: [actor.user.name, src_endpoint.hostname, unmapped.powershell.indicators]}
    lsass_read:          {fields: [actor.process.name, unmapped.target_process, unmapped.granted_access]}
    service_persistence: {fields: [actor.user.name, unmapped.service.name, unmapped.service.path]}
    c2_beacon:           {fields: [src_endpoint.ip, dst_endpoint.ip]}
    log_clear:           {fields: [actor.user.name, src_endpoint.hostname]}

incident_membership:
  incident_count: 2          # actor track + device track each carry the whole single-host chain (see authoring rule 2)
  incident_key: "endpoint-macro-c2"
  include: [macro_shell, ps_cradle, lsass_read, service_persistence, c2_beacon, log_clear]
  cross_step_rule_ids:
    - "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10"
    - "79a1b4be-2ffb-4aba-8051-f09b4863ffc4"
    - "ed287553-9e4b-45c1-8189-625dfbad7442"
    - "dcddff84-7500-4360-8acc-14768a2ae0b7"
    - "f6071829-a3b4-4c53-9d6e-7f8091a2b526"
    - "17dcc2b9-4d62-4fc2-9833-83954bf1b902"

# Read-side campaign view (links incidents sharing a member alert). REPORTED, never gated.
campaign_membership:
  campaign_count: 1
  full_coverage: true

# ADR-012 WP 7: process-tree links DERIVED from the builder's raw Sysmon keys (never hand-typed; the
# storyline's test fails if this block differs from sysmon_tree.derive_links over seeds 7, 11 and 23).
causal_links:
  - {from: macro_shell, to: log_clear, basis: process_tree, via: spawn}
  - {from: macro_shell, to: lsass_read, basis: process_tree, via: spawn}
  - {from: macro_shell, to: ps_cradle, basis: process_tree, via: spawn}
  - {from: macro_shell, to: service_persistence, basis: process_tree, via: spawn}
  - {from: service_persistence, to: c2_beacon, basis: process_tree, via: acting_process}
