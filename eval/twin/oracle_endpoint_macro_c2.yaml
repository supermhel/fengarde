  - {from: ps_encoded, to: lsass_read, basis: process_tree, via: spawn}
  - {from: ps_encoded, to: service_persistence, basis: process_tree, via: spawn}
  - {from: ps_encoded, to: tool_download, basis: process_tree, via: spawn}
