# =============================================================================
# FENGARDE eval/twin/oracle_endpoint_macro_c2.yaml
# Grading ground truth for the keyed macro-to-C2 spawn-chain storyline (storyline_endpoint_macro_c2.py):
#   macro_shell -> ps_encoded -> ps_cradle -> tool_download -> lsass_read -> service_persistence -> c2_beacon -> log_clear -> shadow_delete -> sched_task -> account_add
#
# AUTHORING RULES (rewritten 2026-11-24 for the spawn-chain restructure; every expectation comes from the rules' own
# description/detection blocks and the parser docstrings, not from observed output).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared: every step is covered by a shipped rule.
#   2. incident_count is 2: one account on one workstation, so BOTH WS-8 tracks (actor and device; tracks never merge)
#      carry the full chain.
#   3. THE FORBIDDEN RELATIONSHIPS are the anti-causal reversals of allowed ones (a later step cannot cause an earlier
#      one): account_add -> macro_shell, c2_beacon -> lsass_read, shadow_delete -> ps_encoded. Like the older storylines'
#      reversed pairs they share the account and host with the steps they must not precede, so the actor track joins
#      them in both directions; they are recorded as order_blind_join known gaps, not hidden.
#   4. causal_links (ADR-012 WP 7) are DERIVED from the builder's RAW Sysmon records by sysmon_tree.derive_links, never
#      typed by hand. TRIGGER LEVEL AND SPAWN ONLY: step B is linked from step A only when B's alert-raising record (the
#      one the builder marks as the step's trigger) is a Sysmon EID 1 whose ParentProcessGuid equals the ProcessGuid of
#      A's trigger. The steps ps_cradle (4104), c2_beacon (EID 3) and the 7045 / 1102 records are alerts without a parent
#      key: they are in the sequence for incident realism and are never link endpoints. Process relations that are not
#      trigger-to-trigger (the EID 3 beacon, the recon children) are context, never in the graded set.
#   5. SCOPE HONESTY. Every rule here is a single-shot heuristic or a coarse volume rule; the storyline shows they
#      fire on attack-shaped input, not a false-positive rate on a real estate.
# =============================================================================
