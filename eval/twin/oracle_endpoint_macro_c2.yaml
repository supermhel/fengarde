detection_points:
  macro_shell:
    step: macro_shell
    role: "a document host (Word) starts a command shell"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.suspicious)"
    expected_rules:
      - {rule_id: "5b7e0d3a-91c4-4f6e-8a2d-3c1f9e7b4a10", title: "Document host spawned a shell or script host", level: high, role: user execution (T1204.002)}
    gap: {no_rule_exists: false}

  ps_encoded:
    step: ps_encoded
    role: "the shell starts a PowerShell with an encoded command"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "df8465f8-c959-404a-b7dd-611c7f084ee2", title: "PowerShell started with an encoded command", level: medium, role: execution detection on the process-creation event (T1059.001)}
    gap: {no_rule_exists: false}

  ps_cradle:
    step: ps_cradle
    role: "script-block logging records a download-and-execute cradle"
    expected_event_source: "windows_eventlog 4104 (class 1002, activity 6, unmapped.powershell.suspicious)"
    expected_rules:
      - {rule_id: "79a1b4be-2ffb-4aba-8051-f09b4863ffc4", title: "Suspicious PowerShell script content", level: high, role: execution detection (T1059.001)}
    gap: {no_rule_exists: false}

  tool_download:
    step: tool_download
    role: "certutil fetches the next-stage tool over HTTP"
    expected_event_source: "sysmon EventID 1 (class 1002, activity 1, unmapped.process_launch.command_line_lc)"
    expected_rules:
      - {rule_id: "0de0758f-a62c-405b-adcf-fb1d602cd321", title: "certutil used to download a file", level: high, role: ingress tool transfer (T1105)}
    gap: {no_rule_exists: false}

  lsass_read:
    step: lsass_read
    role: "a dumper started by the PowerShell opens lsass.exe with a dump-capable access mask"
    expected_event_source: "sysmon EventID 1 + EventID 10 (class 1002, activity 5, unmapped.lsass_access_suspicious)"
    expected_rules:
      - {rule_id: "c933c309-6991-402e-ad83-332213c30856", title: "LSASS memory dump started from the command line", level: critical, role: credential-dumping detection on the dumper's process-creation event (T1003.001)}
      - {rule_id: "ed287553-9e4b-45c1-8189-625dfbad7442", title: "Suspicious process access to lsass.exe", level: critical, role: credential dumping (T1003.001)}
    gap: {no_rule_exists: false}

  service_persistence:
    step: service_persistence
    role: "a service is created for the implant (sc.exe create, then Event 7045)"
    expected_event_source: "sysmon EventID 1 + windows_eventlog 7045 (class 1002, activity 3, unmapped.service.suspicious_path)"
    expected_rules:
      - {rule_id: "1abfb057-d081-401d-be13-547958235343", title: "Service created from the command line (sc.exe create)", level: medium, role: persistence detection on the sc.exe create process-creation event (T1543.003)}
      - {rule_id: "dcddff84-7500-4360-8acc-14768a2ae0b7", title: "Service installed from a suspicious path", level: high, role: persistence (T1543.003)}
    gap: {no_rule_exists: false}

  c2_beacon:
    step: c2_beacon
    role: "20+ accepted outbound connections from one source at a regular interval"
    expected_event_source: "sysmon EventID 3 (class 4001, activity 7)"
    expected_rules:
      - {rule_id: "f6071829-a3b4-4c53-9d6e-7f8091a2b526", title: "Regular-interval outbound connections from one source (beaconing)", level: medium, role: command and control (T1071)}
    gap: {no_rule_exists: false}

  log_clear:
    step: log_clear
    role: "a second PowerShell clears the Security event log (Clear-EventLog, then Event 1102)"
    expected_event_source: "sysmon EventID 1 + windows_eventlog 1102 (class 1002, activity 4)"
    expected_rules:
      - {rule_id: "cebb9ee4-a72c-48d3-9aad-06b3aff0860c", title: "Event log cleared from the command line", level: high, role: defense-evasion detection on the Clear-EventLog process-creation event (T1070.001)}
      - {rule_id: "17dcc2b9-4d62-4fc2-9833-83954bf1b902", title: "Windows audit log cleared", level: high, role: defense evasion (T1070.001)}
    gap: {no_rule_exists: false}

  shadow_delete:
    step: shadow_delete
    role: "the clearing PowerShell deletes the volume shadow copies"
