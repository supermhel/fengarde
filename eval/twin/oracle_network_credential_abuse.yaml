# =============================================================================
# FENGARDE eval/twin/oracle_network_credential_abuse.yaml
# Grading ground truth for the network credential-abuse storyline
# (storyline_network_credential_abuse.py):
#   recon_sweep -> password_spray -> slow_stuffing
#
# AUTHORING RULES (written 2026-10-28 BEFORE the builder was run through the pipeline; expectations
# come from the rules' own description/detection/siem blocks and the parser docstrings).
#   1. NO RULE WAS INVENTED and NO MISSING-RULE GAP is declared. common_port_sweep,
#      common_password_spray_by_source and common_credential_stuffing_sustained all shipped
#      2026-10-14..20 against gaps their sibling rules' descriptions recorded.
#   2. NAMING. The spray step is T1110.003 (ONE source -> many accounts); the stuffing step is
#      T1110.004 (MANY sources -> ONE account). The two are inverses and the oracle keeps them on
#      separate steps with separate rules; neither step's rule is declared on the other.
#   3. THE SLOW TIER, STATED PRECISELY. slow_stuffing spreads 21-24 failures over ~4 h, one new
#      address every 10 minutes. The 300 s burst rule (common_password_spray, 8 distinct sources)
#      is therefore declared must_not_fire at that step: the rule's own description says it is
#      invisible to a rotating-pool campaign, which is why the sustained tier exists.
#   4. common_port_scan (vertical: distinct PORTS on one host) is declared must_not_fire at the sweep
#      step: the sweep hits ONE port on many hosts, the shape its description says it scores as a
#      constant 1. common_bruteforce (10 failures / 60 s) is declared must_not_fire at the spray
#      step: the spray fails one account every 25 s, deliberately under any per-source volume rule.
#   5. incident_count: the sweeping address is also the spray source and the stuffing pool's last
#      address, and the account the spray ends on is the account the stuffing targets, so one ip
#      track (and one actor track) spans the chain: 1.
#   6. THE FORBIDDEN RELATIONSHIP IS A GENUINE ENTITY-DISJOINTNESS CONTROL. `bystander_stale_password`
#      is a real user whose saved password is stale, failing from 22 mobile-carrier addresses in a few hours --
#      the DOCUMENTED false-positive shape of common_credential_stuffing_sustained (its own
#      description names it). It rides in the base build, is NOT in expected_sequence (scored as
#      non-attack activity) and shares no account or address with the attack. slow_stuffing ->
#      bystander_stale_password must not be joined.
#   7. SCOPE HONESTY. 20 distinct sources in 24 h is "the starting point the independent review
#      proposed, not a measured site value" (the rule's words). This storyline shows the tier fires
#      on a slow rotating pool and stays silent at 19; it does not show that 20 is the right number
#      for any estate. Likewise the sweep rule is a denied-connection counter: a sweep that lands on
#      open ports is not counted (its description), and this storyline does not claim otherwise.
#      The 24 h window edge is NOT exercised: the order-control gate requires a storyline span far below the correlator's 24 h horizon (< 6 h), so the pool is compressed to ~4 h (10 min per new address, still never 8 sources inside 300 s). A pool spread over a full day is covered only by the rule's own fixtures.
# =============================================================================
schema_version: 1
oracle_id: "network-credential-abuse-v1"
kind: "attack-chain-grading-oracle"
scope: "network-credential-abuse"

provenance:
  authored: "2026-10-28"
  pipeline_run_before_authoring: false
  basis: "rule description/detection/siem blocks and parser docstrings only"
  rules_read:
    common_port_sweep: "ba865ca0603fcc06fa6fdbac0e9672ffdfaddd579b2645198b8dab02d9ec4b63"
    common_password_spray_by_source: "5d50da95db7a3b27fb7ecc8aca924aae869e33d2e343ac76264b4ddea1177108"
    common_credential_stuffing_sustained: "c76596d59674bed3db2cbb5646946de99924ff22c3f24be09ae02c6a5ecfc764"
    common_password_spray: "c565b58f392c8e85ac08049c49d1ab119846540d7bcbea86f0ea2f4e30d1a089"

expected_sequence:
  - recon_sweep
  - password_spray
  - slow_stuffing

sequence_constraints:
  strict_order: true
  allow_extra_steps: false
  max_clock_span_seconds: 21600

allowed_relationships:
  - {from: recon_sweep,    to: password_spray, allowed: true,  causal_kind: credential_access}
  - {from: password_spray, to: slow_stuffing,  allowed: true,  causal_kind: credential_access}
  - {from: slow_stuffing,  to: bystander_stale_password, allowed: false, causal_kind: none}

detection_points:
  recon_sweep:
    step: recon_sweep
    role: "one outside address is denied against 15+ distinct inside hosts inside 60 s (horizontal sweep)"
    expected_event_source: "cisco_asa %ASA-4-106023 deny (class 4001, activity 6)"
    expected_rules:
      - {rule_id: "d4a91b7c-62e8-4c3f-95a0-1e8b7d2f6c33", title: "Horizontal sweep (one source denied across many distinct hosts)", level: medium, role: network service discovery (T1046)}
    must_not_fire:
      - "1d2c3b4a-5e6f-4708-8a91-0b1c2d3e4f05"   # common_port_scan: the sweep uses ONE port, not 15 distinct ports
    gap: {no_rule_exists: false}

  password_spray:
    step: password_spray
    role: "the same address fails logon against 8+ distinct accounts inside 300 s (true spraying)"
    expected_event_source: "active_directory 4625 (class 3002, activity 4 Failure)"
    expected_rules:
      - {rule_id: "8c2f6a14-3d97-4e05-b1a8-7f4d9c0e5b26", title: "Password spray (one source failing against many distinct accounts)", level: high, role: password spraying (T1110.003)}
    must_not_fire:
      - "6f1c8a2e-0d3b-4c11-9a21-7b5e2f9a1c01"   # common_bruteforce: one failure per account every 25 s is under 10 / 60 s
    gap: {no_rule_exists: false}

  slow_stuffing:
    step: slow_stuffing
    role: "one account fails from 20+ distinct source addresses inside 24 h, never 8 inside 300 s"
    expected_event_source: "active_directory 4625 (class 3002, activity 4 Failure)"
    expected_rules:
      - {rule_id: "9cfa2df1-e480-4260-aefb-0e7a1701bb43", title: "Sustained credential stuffing (one account from many distinct source IPs over 24 hours)", level: medium, role: slow-tier credential stuffing (T1110.004)}
    must_not_fire:
      - "4f8a2c61-9e3d-4b57-8a1c-6d2e5f7a8b90"   # common_password_spray (300 s burst tier): the pool rotates one address per ~10 min
    gap: {no_rule_exists: false}

step_dependencies: {}

severity_band:
  score: {min: 40, max: 100}
  severity_id: {min: 3, max: 6}
  dominant_band: "high"

evidence:
  correlation_key: [src_endpoint.ip]
  per_step:
    recon_sweep:    {fields: [src_endpoint.ip, dst_endpoint.ip]}
    password_spray: {fields: [src_endpoint.ip, actor.user.name]}
    slow_stuffing:  {fields: [actor.user.name, src_endpoint.ip]}

incident_membership:
  incident_count: 1          # the attacker address + the victim account span every alert-raising step
  incident_key: "network-credential-abuse"
  include: [recon_sweep, password_spray, slow_stuffing]
  cross_step_rule_ids:
    - "d4a91b7c-62e8-4c3f-95a0-1e8b7d2f6c33"
    - "8c2f6a14-3d97-4e05-b1a8-7f4d9c0e5b26"
    - "9cfa2df1-e480-4260-aefb-0e7a1701bb43"

campaign_membership:
  campaign_count: 1
  full_coverage: true
