# Security Insights (v2.2.0) — machine-readable security posture for FENGARDE.
#
# Every claim here is sourced from the public repository itself (SECURITY.md,
# CONTRIBUTING.md, .github/workflows/, SSOT.md §2 proven-vs-claim discipline).
# Kept in sync BY HAND with those files — same convention as the OpenSSF badge
# form: this file is a point-in-time self-report, not an auto-generated one.
# Bump header.last-updated/last-reviewed whenever a sourced fact changes.
header:
  schema-version: 2.2.0
  last-updated: "2026-10-22"
  last-reviewed: "2026-10-22"
  url: https://raw.githubusercontent.com/supermhel/fengarde/main/SECURITY-INSIGHTS.yml

project:
  name: FENGARDE
  homepage: https://supermhel.github.io/fengarde/
  documentation:
    quickstart-guide: https://github.com/supermhel/fengarde#quickstart
    release-process: https://github.com/supermhel/fengarde/blob/main/CHANGELOG.md
  administrators:
    - name: Mel Dylan Djomou
      email: dylandjomou@yahoo.de
      social: https://github.com/supermhel
      primary: true
  repositories:
    - name: fengarde
      url: https://github.com/supermhel/fengarde
      comment: |
        Open-core IT/AI/OT SIEM pipeline (raw security logs -> OCSF ->
        correlation rules -> alerts -> incidents), Apache-2.0. fengarde-sec,
        the paid LLM layer, is a separate private repository and is not part
        of this file.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Mel Dylan Djomou
      email: dylandjomou@yahoo.de
      primary: true
    policy: https://github.com/supermhel/fengarde/blob/main/SECURITY.md
    comment: |
      Reporting process per SECURITY.md. Private reports are accepted via
      GitHub's Security -> "Report a vulnerability" (private disclosure);
      acknowledgement within a few business days, coordinated disclosure
      timeline for confirmed vulnerabilities. No bug bounty is offered.

repository:
  url: https://github.com/supermhel/fengarde
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Mel Dylan Djomou
      email: dylandjomou@yahoo.de
      social: https://github.com/supermhel
      primary: true
  documentation:
    contributing-guide: https://github.com/supermhel/fengarde/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/supermhel/fengarde/blob/main/SECURITY.md
  license:
    expression: Apache-2.0
    url: https://github.com/supermhel/fengarde/blob/main/LICENSE
  release:
    automated-pipeline: true
    changelog: https://github.com/supermhel/fengarde/blob/main/CHANGELOG.md
    distribution-points:
      - uri: https://github.com/supermhel/fengarde/releases
        comment: GitHub Releases (signed source/blobs + container image set)
      - uri: https://ghcr.io/supermhel
        comment: Container images, one per workstream service, pushed and signed keyless
    attestations:
      - name: SLSA v0.2 provenance (generator-generic) + keyless cosign signature
        predicate-uri: https://slsa.dev/provenance/v0.2
        location: https://github.com/supermhel/fengarde/releases
        comment: |
          Every release runs .github/workflows/release.yml: cosign KEYLESS
          (OIDC) signing of the tarball and each image, SLSA v0.2 provenance
          (predicateType read from the v0.11.3 provenance) produced by the official SLSA generator's generic generate-provenance
          reusable workflow. No private key or secret is used. (SBOM freshness
          -- sbom.json must match every requirements.txt -- is gated in ci.yml
          on every PR, not in release.yml.)
  security:
    assessments:
      self:
        evidence: https://github.com/supermhel/fengarde/blob/main/SSOT.md
        date: "2026-10-14"
        name: SSOT.md section 2 (proven vs. claim)
        comment: |
          The repo's own honesty discipline: every gate/measurement is marked
          proven-by-execution or claim, and fabricated history is labeled
          (eval/trend.jsonl keeps its pre-fix fabricated pilot row with its
          own comment block rather than deleting it).
      third-party:
        - evidence: https://api.securityscorecards.dev/projects/github.com/supermhel/fengarde
          date: "2026-10-22"
          name: OpenSSF Scorecard (live API)
          comment: |
            Score 8.6/10 at commit f9065dd (API read 2026-10-22). 10/10:
            Security-Policy, Token-Permissions, SAST (CodeQL), Fuzzing (19
            Atheris targets nightly), Vulnerabilities, CI-Tests, Maintained,
            Dangerous-Workflow, Dependency-Update-Tool, Binary-Artifacts,
            License, Packaging. Weaker, all disclosed: Code-Review 0 (0/8
            approved changesets as read; single maintainer), Contributors 3 (one organization), Signed-Releases
            6 (2 of the last 3 releases carried signed artifacts; releases
            before v0.11.3 have no verifiable signed provenance, see
            SECURITY.md), Pinned-Dependencies 9 (a dependency not pinned by
            hash), CII-Best-Practices 5 (badge detected: Passing).
            Branch-Protection returned an internal API error (-1), not a
            score. OpenSSF Best Practices badge (project 14443): level
            passing, 100% of the passing criteria as read from
            bestpractices.dev on 2026-10-22.
    champions:
      - name: Mel Dylan Djomou
        email: dylandjomou@yahoo.de
        primary: true
    # Schema v2.2.0's SecurityPosture is closed (assessments / champions /
    # tools only): the tooling is listed as `tools` entries. None of them
    # publishes an in-toto attestation, so every `results` is empty.
    tools:
      - name: CodeQL
        type: SAST
        rulesets: [security-extended]
        integration: {adhoc: false, ci: true, release: false}
        results: {}
        comment: codeql.yml, Python; every PR, every push to main, weekly.
      - name: gitleaks
        type: secret
        rulesets: [.gitleaks.toml]
        integration: {adhoc: false, ci: true, release: false}
        results: {}
        comment: ci.yml secret scan with the repo's .gitleaks.toml.
      - name: pip-audit
        type: SCA
        rulesets: [default]
        integration: {adhoc: false, ci: true, release: false}
        results: {}
        comment: ci.yml, --strict over every pinned services/*/requirements.txt.
      - name: Dependabot
        type: SCA
        rulesets: [default]
        integration: {adhoc: true, ci: false, release: false}
        results: {}
        comment: weekly pip updates per service directory plus GitHub Actions (.github/dependabot.yml).
      - name: Atheris
        type: fuzzing
        rulesets: [default]
        integration: {adhoc: false, ci: true, release: false}
        results: {}
        comment: fuzz.yml nightly, 19 parser targets; Hypothesis property tests run in the PR gate.
      - name: actionlint + tools/verify_action_pins.py
        type: other
        rulesets: [default]
        integration: {adhoc: false, ci: true, release: false}
        results: {}
        comment: workflow lint and SHA-pin integrity of every action reference (ci.yml).
