# HA opt-in profile -- Redis Sentinel + OpenSearch 3-node cluster.
#
# Default stack is untouched: `make up` / `docker compose up` still brings up
# the single-instance Redis + OpenSearch defined in docker-compose.yml. This
# file only takes effect when the `ha` profile is explicitly requested.
#
# MSSP-hosted-central tier startup:
#   export REDIS_PASSWORD=$(openssl rand -hex 16)
#   make ha-up
#
# The profile:
# - adds 1 Redis primary + 2 replicas + 3 Sentinels on an internal `ha` network
# - replaces single-node OpenSearch with a 3-node cluster on the same network
# - overrides the existing application services so the bus talks to Sentinel
#   and the indexer talks to the cluster's first node
# - starts a one-shot `provision-ha` container that installs index templates
#   + ISM policies against the cluster once it is healthy
#
# Existing index templates already declare `number_of_replicas: 1`; no
# application-code mapping change is needed for replica shards.

services:
  # Disable single-instance services when HA is active.
  #
  # Live-verified bug (2026-08-05): `profiles: [ha]` here does the OPPOSITE of
  # "disable" -- Compose activates a service when ONE of its listed profiles is
  # requested, so tagging these `[ha]` and then invoking `--profile ha up`
  # (exactly what `make ha-up` does) makes them start ALONGSIDE the HA cluster,
  # not instead of it. Confirmed live: both `siem-bus` (plain) and
  # `siem-bus-ha-1..3` were `Up (healthy)` simultaneously, and devkit-feeder's
  # traffic went to the plain instance (its REDIS_URL is hardcoded to
  # `redis:6379`, unaffected by this file) while the Sentinel-managed cluster
  # sat at zero events. `[standard]` fixes it: a plain `docker compose up`
  # (this file not included) never requests `--profile standard`, so these
  # stay profile-less there and start exactly as before (unaffected, matching
  # this file's original intent) -- but once ha.yml's override replaces their
  # profile list with `[standard]`, `--profile ha up` no longer matches them
  # at all, since only "ha" was requested.
  redis:
    profiles: [standard]
  opensearch:
    profiles: [standard]
  dashboards:
    profiles: [standard]
  provision:
    profiles: [standard]
  devkit-feeder:
    profiles: [standard]

  # ---- Redis HA: 1 primary + 2 replicas + 3 Sentinels ----
  redis-1:
    image: redis:7-alpine
    container_name: siem-bus-ha-1
    profiles: [ha]
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        # FIX 23: min-replicas-to-write 1 / min-replicas-max-lag 10 make the
        # primary REFUSE writes when no replica is connected (or all replicas
        # lag >10s). Without this the primary silently accepts + ack events it
        # has not replicated; if the primary then dies, the replica promoted to
        # primary never received the acked tail -- silent event loss on exactly
        # the failover path Sentinel exists to survive. Trade-off: while every
        # replica is down the primary goes read-only (write-availability lost),
        # which is the honest cost of not losing the acked tail. See SSOT.md §2.
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --min-replicas-to-write 1 --min-replicas-max-lag 10;
      else
        echo "REDIS_PASSWORD must be set for HA" >&2; exit 1;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
    volumes: ["redis-data-ha-1:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Static IP -- see the `ha` network's ipam block at the bottom of this file
    # for why the Redis/Sentinel nodes are pinned rather than left dynamic.
    #
    # REDIS_PRIMARY_IP is the SINGLE source of truth for the initial primary's
    # address. It is interpolated here, into redis-2/redis-3's `--replicaof`,
    # and into each Sentinel's REDIS_SENTINEL_PRIMARY_HOST. It used to be
    # written out literally in all five places with nothing keeping them in
    # sync: an operator who set REDIS_SENTINEL_PRIMARY_HOST (the only one that
    # was configurable) moved the Sentinels but left the replicas still trying
    # to replicate from 172.28.0.11, producing a monitored primary with zero
    # replicas -- and Sentinel cannot promote anything when there is no
    # candidate, so HA was silently defeated by the one knob the file advertised.
    #
    # Must be a literal IPv4 address, not a hostname: `ipv4_address` below only
    # accepts an address, and handing Sentinel an IP is the entire point of the
    # DNS fix documented in redis-sentinel-entrypoint.sh.
    networks:
      ha:
        ipv4_address: ${REDIS_PRIMARY_IP:-172.28.0.11}

  redis-2:
    image: redis:7-alpine
    container_name: siem-bus-ha-2
    profiles: [ha]
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --replicaof ${REDIS_PRIMARY_IP:-172.28.0.11} 6379 --masterauth "$$REDIS_PASSWORD" --requirepass "$$REDIS_PASSWORD";
      else
        echo "REDIS_PASSWORD must be set for HA" >&2; exit 1;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
    volumes: ["redis-data-ha-2:/data"]
    depends_on: {redis-1: {condition: service_healthy}}
    networks:
      ha:
        ipv4_address: 172.28.0.12

  redis-3:
    image: redis:7-alpine
    container_name: siem-bus-ha-3
    profiles: [ha]
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --replicaof ${REDIS_PRIMARY_IP:-172.28.0.11} 6379 --masterauth "$$REDIS_PASSWORD" --requirepass "$$REDIS_PASSWORD";
      else
        echo "REDIS_PASSWORD must be set for HA" >&2; exit 1;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
    volumes: ["redis-data-ha-3:/data"]
    depends_on: {redis-1: {condition: service_healthy}}
    networks:
      ha:
        ipv4_address: 172.28.0.13

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: siem-sentinel-ha-1
    profiles: [ha]
    command: ["sh", "/redis-sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
      # Must match redis-1's pinned ipv4_address above. Declared here so the
      # compose file stays the single source of truth for the address; the
      # entrypoint carries the same value only as a fallback default. A
      # hostname still works (the entrypoint resolves it once at startup) but
      # an IP is what keeps Sentinel off the resolver entirely.
      - REDIS_SENTINEL_PRIMARY_HOST=${REDIS_PRIMARY_IP:-172.28.0.11}
    volumes:
      - ./redis-sentinel-entrypoint.sh:/redis-sentinel-entrypoint.sh:ro
      - redis-sentinel-ha-1:/data
    depends_on: [redis-1, redis-2, redis-3]
    networks:
      ha:
        ipv4_address: 172.28.0.21
    ports: ["127.0.0.1:26379:26379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: siem-sentinel-ha-2
    profiles: [ha]
    command: ["sh", "/redis-sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
      # Must match redis-1's pinned ipv4_address above. Declared here so the
      # compose file stays the single source of truth for the address; the
      # entrypoint carries the same value only as a fallback default. A
      # hostname still works (the entrypoint resolves it once at startup) but
      # an IP is what keeps Sentinel off the resolver entirely.
      - REDIS_SENTINEL_PRIMARY_HOST=${REDIS_PRIMARY_IP:-172.28.0.11}
    volumes:
      - ./redis-sentinel-entrypoint.sh:/redis-sentinel-entrypoint.sh:ro
      - redis-sentinel-ha-2:/data
    depends_on: [redis-sentinel-1]
    networks:
      ha:
        ipv4_address: 172.28.0.22
    ports: ["127.0.0.1:26380:26379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: siem-sentinel-ha-3
    profiles: [ha]
    command: ["sh", "/redis-sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting HA Redis}
      # Must match redis-1's pinned ipv4_address above. Declared here so the
      # compose file stays the single source of truth for the address; the
      # entrypoint carries the same value only as a fallback default. A
      # hostname still works (the entrypoint resolves it once at startup) but
      # an IP is what keeps Sentinel off the resolver entirely.
      - REDIS_SENTINEL_PRIMARY_HOST=${REDIS_PRIMARY_IP:-172.28.0.11}
    volumes:
      - ./redis-sentinel-entrypoint.sh:/redis-sentinel-entrypoint.sh:ro
      - redis-sentinel-ha-3:/data
    depends_on: [redis-sentinel-1]
    networks:
      ha:
        ipv4_address: 172.28.0.23
    ports: ["127.0.0.1:26381:26379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- OpenSearch HA: 3-node cluster ----
  opensearch-1:
    image: opensearchproject/opensearch:2.13.0
    container_name: siem-store-ha-1
    profiles: [ha]
    environment:
      - cluster.name=fengarde
      - node.name=opensearch-1
      - network.host=0.0.0.0
      - network.publish_host=opensearch-1
      - discovery.seed_hosts=opensearch-1:9300,opensearch-2:9300,opensearch-3:9300
      - cluster.initial_master_nodes=opensearch-1,opensearch-2,opensearch-3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: ["os-data-ha-1:/usr/share/opensearch/data"]
    depends_on:
      opensearch-2: {condition: service_healthy}
      opensearch-3: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ha]
    ports: ["127.0.0.1:9201:9200"]

  opensearch-2:
    image: opensearchproject/opensearch:2.13.0
    container_name: siem-store-ha-2
    profiles: [ha]
    environment:
      - cluster.name=fengarde
      - node.name=opensearch-2
      - network.host=0.0.0.0
      - network.publish_host=opensearch-2
      - discovery.seed_hosts=opensearch-1:9300,opensearch-2:9300,opensearch-3:9300
      - cluster.initial_master_nodes=opensearch-1,opensearch-2,opensearch-3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: ["os-data-ha-2:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ha]
    ports: ["127.0.0.1:9202:9200"]

  opensearch-3:
    image: opensearchproject/opensearch:2.13.0
    container_name: siem-store-ha-3
    profiles: [ha]
    environment:
      - cluster.name=fengarde
      - node.name=opensearch-3
      - network.host=0.0.0.0
      - network.publish_host=opensearch-3
      - discovery.seed_hosts=opensearch-1:9300,opensearch-2:9300,opensearch-3:9300
      - cluster.initial_master_nodes=opensearch-1,opensearch-2,opensearch-3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: ["os-data-ha-3:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ha]
    ports: ["127.0.0.1:9203:9200"]

  # ---- HA-specific Dashboards ----
  dashboards-ha:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: siem-dashboards-ha
    profiles: [ha]
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch-1:9200","http://opensearch-2:9200","http://opensearch-3:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks: [ha]
    ports: ["127.0.0.1:5602:5601"]
    depends_on:
      opensearch-1: {condition: service_healthy}
      opensearch-2: {condition: service_healthy}
      opensearch-3: {condition: service_healthy}

  # ---- Provision templates/policies against the HA cluster ----
  provision-ha:
    image: curlimages/curl:8.7.1
    container_name: siem-provision-ha
    profiles: [ha]
    # Live-verified bug (2026-08-05, found only by bringing the FULL profile up
    # rather than the Redis subset): this service had no `networks:` at all, so
    # it landed on the base file's `default` network while opensearch-1..3 live
    # on `ha`. It could not resolve `opensearch-1`, sat forever on provision.sh's
    # "Waiting for OpenSearch at http://opensearch-1:9200 ..." loop, and NEVER
    # installed anything -- confirmed against the running cluster: 0 index
    # templates, 0 ISM policies. An HA deployment therefore indexed into
    # whatever dynamic mappings OpenSearch inferred, with no retention policy
    # at all, instead of the contract mappings in contracts/opensearch-mappings.
    #
    # Same defect class as the app-service `networks: [default, ha]` fix
    # documented above, and missed by that pass because this is an HA-ONLY
    # service defined here rather than an override of a base-file service, so
    # it was not in the list of overrides being audited. `depends_on:
    # opensearch-1 service_healthy` was satisfied the whole time -- proving the
    # target is healthy is not proving THIS container can route to it.
    networks: [ha]
    volumes:
      - ../contracts/opensearch-mappings:/mappings:ro
      - ./provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    restart: "no"
    environment:
      - OPENSEARCH_URL=http://opensearch-1:9200
    depends_on:
      opensearch-1: {condition: service_healthy}

  # ---- Application service overrides for HA ----
  # These keep the existing service names so `docker compose up --profile ha`
  # still brings up the full stack, but route the bus and storage to the HA
  # backends instead of the single-instance ones.
  #
  # `depends_on: !override {...}` (not plain `depends_on: {...}`) on every one of
  # these -- live-verified bug (2026-08-05): Compose MERGES `depends_on` maps
  # across -f files by key, it does not replace them. Without `!override`, e.g.
  # ws1-collectors ends up depending on BOTH `redis-1` (this override) AND the
  # base file's `redis` (unioned in from docker-compose.yml) -- and once the
  # single-instance disable fix above correctly excludes `redis` from the
  # active service set, that merged-in dependency on a service that will never
  # start makes the whole `up`/`down` invocation fail with "depends on
  # undefined service". `!override` tells Compose to replace this key outright
  # instead of merging it, which is what every one of these overrides always
  # intended.
  #
  # `networks: [default, ha]` on every one of these -- second live-verified bug
  # found in the same pass, past the point where `depends_on`/env looked
  # correct: none of these services were ever attached to the `ha` network
  # redis-1..3/the Sentinels/opensearch-1..3 actually live on. `depends_on`
  # being satisfied only proves the target container is healthy, not that
  # THIS container can reach it -- these stayed on the base file's implicit
  # `default` network only, so every one of them sat `unhealthy` with
  # `redis.exceptions.ConnectionError: Error -2 connecting to redis:6379. Name
  # or service not known.` in its logs (the sentinel-discovery path silently
  # falling back to `_RedisSentinelBus`'s initial/dead URL after
  # `Sentinel.discover_master()` itself failed with a plain network
  # `ConnectionError` to all three sentinel hosts -- confirmed live from
  # inside the container, not inferred). `default` is kept alongside `ha` so
  # these can still reach each other (WS-7's proxy to WS-6's API, etc.)
  # exactly as before.

  ws1-collectors:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # !override replaces the base file's whole depends_on map (Compose spec
    # merge semantics) -- ws1-spool-init must be re-listed here or the HA
    # profile silently loses the wait-for-chown ordering the base file's own
    # depends_on establishes (caught while wiring the base fix, not assumed
    # to carry over).
    depends_on: !override
      redis-1: {condition: service_healthy}
      ws1-spool-init: {condition: service_completed_successfully}
    networks: [default, ha]

  ws2-normalization:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on: !override {redis-1: {condition: service_healthy}}
    networks: [default, ha]

  ws3-indexer:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # FIX H6 wiring (2026-08-06): OpenSearchStore accepts a comma-separated
      # node list (storage/opensearch.py) and rotates to the next node on a
      # connection-level failure. Pointing this at ALL THREE nodes is what
      # actually turns the H6 code on -- it landed pointed at opensearch-1
      # only, so the failover it implements was dead code in the one compose
      # file (HA) that exists specifically to exercise it: the cluster stays
      # green on any single node loss, but the writer (pinned to opensearch-1
      # alone) would still go down with it.
      - OPENSEARCH_URL=http://opensearch-1:9200,http://opensearch-2:9200,http://opensearch-3:9200
    depends_on: !override
      redis-1: {condition: service_healthy}
      opensearch-1: {condition: service_healthy}
      opensearch-2: {condition: service_healthy}
      opensearch-3: {condition: service_healthy}
    networks: [default, ha]

  ws4-detection:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on: !override {redis-1: {condition: service_healthy}}
    networks: [default, ha]

  ws5-ai:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on: !override {redis-1: {condition: service_healthy}}
    networks: [default, ha]

  # M7 Track Y follow-up (2026-08-05): WS-6 gained its own assets.updates bus
  # consumer the same day this HA profile already existed, and was never
  # wired in here -- live-verified gap, caught by actually bringing HA up
  # rather than assumed fixed because the single-instance path was tested.
  # Without this override WS-6 depends on the now-correctly-excluded plain
  # `redis` (unsatisfiable) and, even if it somehow started, its bus consumer
  # would try BUS_BACKEND=redis against a host that isn't running.
  ws6-inventory:
    environment:
      - FENGARDE_API_KEY=${FENGARDE_API_KEY:-}
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on: !override {redis-1: {condition: service_healthy}}
    networks: [default, ha]

  # ws7-dashboard has NO override block here at all -- deliberately, not by
  # omission. Gap-hunt finding (2026-08-23): one used to exist, setting
  # BUS_BACKEND/REDIS_SENTINEL_HOSTS/REDIS_SENTINEL_MASTER/REDIS_PASSWORD,
  # copy-pasted from every other workstream's real Sentinel migration. Dead
  # config: ws7-dashboard's container is pure nginx:alpine (see its
  # Dockerfile) -- no Python/JS process runs inside it, and its nginx
  # template (templates/default.conf.template) only ever substitutes
  # ${FENGARDE_API_KEY} and ${DASHBOARD_AUTH_REALM}, never any of those 4
  # vars. Harmless (the dashboard never touched the bus), but misleading:
  # reading the override list made it look like every base-file service had
  # its bus wiring correctly ported to HA, when for ws7 it was inert
  # copy-paste. It also never carried `depends_on: !override` /
  # `networks: [default, ha]` the way every other ws1-ws8 override does --
  # correctly: it only talks to ws3-indexer/ws6-inventory over the `default`
  # network and needs no `ha`-network reachability. If a future ws7-dashboard
  # split ever adds a real bus consumer, it will need a real override block
  # (env vars AND the networking pattern) added here -- this comment exists
  # so that addition isn't silently skipped under an "it's just ws7"
  # assumption the way the dead env vars above were.

  # 2026-08-20: same gap class as the ws6-inventory row above, found the same
  # way -- by actually running `--profile ha up` rather than assuming the
  # override list stayed in sync with the base compose file. WS-8 correlation
  # (added 2026-08-18, after this HA profile's app-service overrides were
  # last written) was never added here: without this block, `ws8-correlation`
  # (no profile tag, always active) still `depends_on: redis` from the base
  # file, which THIS file tags `profiles: [standard]` to disable under `ha`
  # -- an unsatisfiable dependency that made `docker compose --profile ha up`
  # refuse to start the whole project ("depends on undefined service redis"),
  # not just fail to wire WS-8 into the cluster.
  ws8-correlation:
    environment:
      - BUS_BACKEND=redis-sentinel
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on: !override {redis-1: {condition: service_healthy}}
    networks: [default, ha]

networks:
  # Explicit subnet so the Redis + Sentinel nodes can be pinned to static IPs.
  #
  # Live-verified bug (2026-08-05): Sentinel was monitoring the primary by the
  # hostname `redis-1` with `resolve-hostnames yes`, which makes it re-resolve
  # that name on its event loop on every health check. Once the primary
  # container dies the name stops resolving, and the lookup takes the stock
  # 5s resolv.conf upstream timeout (measured: 0.00s for a live name, 5.06s for
  # a dead one) -- well past Sentinel's hardcoded 2000ms TILT trigger. Sentinel
  # tilted, suspended failover for 30s, retried the same dead name on exit, and
  # re-tilted forever: `+sdown master` but never `+odown`, zero promotions, the
  # whole cluster stuck write-dead on primary loss. Full write-up in
  # redis-sentinel-entrypoint.sh's header comment.
  #
  # Pinning the Redis nodes means the address Sentinel is handed at boot stays
  # valid for the life of the cluster, so it never needs the resolver again.
  # .11-.13 = Redis primary/replicas, .21-.23 = Sentinels. Application services
  # attaching to this network stay dynamic (Docker's IPAM allocates from the
  # low end and skips these reservations), so nothing else here has to change.
  ha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Dynamic allocations are confined to the TOP half of the subnet so
          # they can never take a pinned address. Without this, Docker's IPAM
          # hands out dynamic IPs sequentially from .2 upward, straight through
          # the .11-.13/.21-.23 block above -- and this profile puts 10
          # containers on this network with no ipv4_address (opensearch-1..3,
          # dashboards-ha, ws1..ws6), which is enough to reach .11. Reproduced:
          # 10 dynamic containers on a bare 172.28.0.0/24 take .2-.11, after
          # which `docker run --ip 172.28.0.11` fails with "Address already in
          # use". `make ha-up` normally survives on start ordering alone
          # (redis-1 has no depends_on, the app services all wait on it), which
          # is exactly why this stayed invisible -- but a partial `up`, a
          # `--force-recreate` of redis-1 while the rest are running, or one
          # more ha-attached service turns it into a hard startup failure.
          #
          # Must be CIDR-aligned: Docker silently normalizes a misaligned range
          # rather than rejecting it (172.28.0.24/27 -> 172.28.0.0/27, which
          # would confine every dynamic container into .0-.31 and guarantee the
          # collision instead of preventing it -- verified against the daemon).
          # .128/25 is aligned and leaves .2-.127 free for pinned addresses.
          ip_range: 172.28.0.128/25

volumes:
  redis-data-ha-1: {}
  redis-data-ha-2: {}
  redis-data-ha-3: {}
  redis-sentinel-ha-1: {}
  redis-sentinel-ha-2: {}
  redis-sentinel-ha-3: {}
  os-data-ha-1: {}
  os-data-ha-2: {}
  os-data-ha-3: {}
