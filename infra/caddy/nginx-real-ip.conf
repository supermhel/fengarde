# Mounted into ws7's nginx by infra/docker-compose.tls.yml (TLS profile only).
# Caddy overwrites X-Forwarded-For with the address it saw (it trusts no upstream proxy by default), so the last
# untrusted hop is the real client. ONLY Caddy's fixed address is trusted (docker-compose.tls.yml pins it with
# ipam + ipv4_address; keep the three values in step, tools/test_tls_profile.py checks it): any other container on the
# compose network that sends X-Forwarded-For straight to ws7 is an ordinary client and its header is ignored.
set_real_ip_from 172.31.250.2;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
