# Mounted into ws7's nginx by infra/docker-compose.tls.yml (TLS profile only).
# Caddy overwrites X-Forwarded-For with the address it saw (it trusts no upstream proxy by default), so the last
# untrusted hop is the real client. Trusted = the compose network's private ranges; narrow to Caddy's subnet if other
# containers share the network (`docker network inspect <project>_default`).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
