# Phase 0 dev infrastructure: message bus + storage + provisioning.
# Service containers (WS-1..WS-7) are added by each workstream skeleton.

services:
  redis:
    image: redis:7-alpine
    container_name: siem-bus
    ports: ["127.0.0.1:6379:6379"]
    # v0.4 Track S3: REDIS_PASSWORD is opt-in. Unset (default) = no auth, same
    # as before. Set it to require AUTH on the bus (:6379 is the spine --
    # anyone reaching it can inject/consume every topic).
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    volumes: ["redis-data:/data"]
    healthcheck:
      # R3-#21: no more silent unauth fallback. With REDIS_PASSWORD set the
      # ONLY healthy answer is a successful AUTH ping; falling back to a bare
      # `redis-cli ping` made a wrong/rotated password report healthy while the
      # bus rejected everyone. Auth off => plain ping is correct.
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || exit 1; else redis-cli ping | grep -q PONG || exit 1; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: siem-store
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    # v0.4 Track S4: security plugin stays OFF (TLS/cert overhead disproportionate
    # to this stack's scope); the mitigation is not publishing beyond localhost.
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["os-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: siem-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  provision:
    image: curlimages/curl:8.7.1
    container_name: siem-provision
    depends_on:
      opensearch: { condition: service_healthy }
    volumes:
      - ../contracts/opensearch-mappings:/mappings:ro
      - ./provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    restart: "no"

  # Live-Docker-caught (2026-08-21): a fresh named volume's mount point is
  # created by Docker as root:root, and ws1-collectors runs as a non-root
  # user (UID 10001, Dockerfile) -- without this, the FIRST real write into
  # the volume (BoundedSpool creating spool.jsonl, or its own _rewrite()
  # tempfile) hits Permission denied. One-shot chown, same restart:"no"
  # pattern as `provision` above; runs once per volume lifetime, no-op
  # (and near-instant) once ownership is already correct.
  ws1-spool-init:
    image: busybox:1.36
    container_name: siem-ws1-spool-init
    volumes:
      - ws1-spool:/var/lib/fengarde/spool
    entrypoint: ["chown", "10001:999", "/var/lib/fengarde/spool"]
    restart: "no"

  # R3-20: one-shot chown for ws3-indexer's audit/RBAC named volume. Same
  # one-shot + restart:"no" pattern as ws1-spool-init above: a fresh named
  # volume mounts root:root, but ws3-indexer runs as uid 10001 (Dockerfile
  # USER app), so the first audit.jsonl or RBAC sqlite write would Permission
  # denied without this. No-op once ownership is already correct.
  ws3-indexer-init:
    image: busybox:1.36
    container_name: siem-ws3-indexer-init
    volumes:
      - ws3-indexer-data:/app/ws3-indexer/data
    entrypoint: ["chown", "10001:10001", "/app/ws3-indexer/data"]
    restart: "no"

  # ---- workstream services (build context = repo root) ----
  ws1-collectors:
    build: { context: .., dockerfile: services/ws1-collectors/Dockerfile }
    restart: unless-stopped
    # Publish the syslog UDP listener so devices (and the smoke test) can send to it.
    ports: ["5514:5514/udp"]
    environment:
      - BUS_BACKEND=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # B2 ingest-edge shedding (default 2000/s; explicit here for visibility).
      - SYSLOG_MAX_EVENTS_PER_SEC=2000
      # Zero-loss spool is opt-in and unset by default, same as always -- set
      # SYSLOG_SPOOL_PATH to a FILE inside the named volume mounted below
      # (see SECURITY.md §8) + optional SYSLOG_SPOOL_MAX_BYTES to enable it.
      # MUST be a file path, not the bare mount directory -- BoundedSpool
      # opens it as a file; pointing it at the directory itself used to fail
      # silently (IsADirectoryError swallowed by a broad except OSError,
      # zero-loss spool inert with zero error), now fails loud at startup
      # instead (services/ws1-collectors/collectors/spool.py). Ingestion-
      # edge-redundancy design doc (fengarde-sec) step 1: the volume now
      # exists and survives a container recreate -- before this, an operator
      # who set SYSLOG_SPOOL_PATH without ALSO hand-editing this file to add
      # a volume mount got a spool that lived on the container's writable
      # layer and vanished on recreate, silently defeating the entire point
      # of enabling it.
      # - SYSLOG_SPOOL_PATH=/var/lib/fengarde/spool/spool.jsonl
    volumes:
      - ws1-spool:/var/lib/fengarde/spool
    depends_on:
      redis: { condition: service_healthy }
      ws1-spool-init: { condition: service_completed_successfully }
    # v0.4: /health now reports 503 when a worker can't reach the bus, so a
    # wedged-but-alive service is detectable/restartable (was a static "ok").
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws2-normalization:
    build: { context: .., dockerfile: services/ws2-normalization/Dockerfile }
    restart: unless-stopped
    environment: ["BUS_BACKEND=redis", "REDIS_PASSWORD=${REDIS_PASSWORD:-}", "REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0"]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws3-indexer:
    build: { context: .., dockerfile: services/ws3-indexer/Dockerfile }
    restart: unless-stopped
    environment:
      - BUS_BACKEND=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - STORAGE_BACKEND=opensearch
      - OPENSEARCH_URL=http://opensearch:9200
      # Triage API listener. Internal only -- the dashboard nginx proxies to
      # ws3-indexer:8013 container-to-container; NOT published to the host.
      - TRIAGE_PORT=8013
      # v0.4 Track S1: opt-in shared-secret auth (unset = open + warning log).
      - FENGARDE_API_KEY=${FENGARDE_API_KEY:-}
      # R3-20: audit.jsonl (default /app/ws3-indexer/storage/audit.jsonl) and the
      # opt-in RBAC sqlite (FENGARDE_RBAC_DB) must survive a container recreate --
      # point both into the named volume mounted at /app/ws3-indexer/data below.
      # RBAC stays UNOFFBIG (the pre-M4.2 default) unless the operator sets
      # FENGARDE_RBAC_DB to a path inside this same volume.
      - FENGARDE_AUDIT_LOG=/app/ws3-indexer/data/audit.jsonl
      # - FENGARDE_RBAC_DB=/app/ws3-indexer/data/rbac.sqlite
    # Deploy fix (same bug class as ws1's spool volume, live-docker-caught
    # 2026-08-21): a fresh named volume is created root:root, but this service
    # drops to uid 10001 (Dockerfile USER app) -- without a one-shot chown the
    # FIRST audit write (and any RBAC sqlite) hits Permission denied. ws3-data-init
    # chowns /app/ws3-indexer/data to 10001 before the service starts.
    volumes:
      - ws3-indexer-data:/app/ws3-indexer/data
    depends_on:
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      ws3-indexer-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  ws4-detection:
    build: { context: .., dockerfile: services/ws4-detection/Dockerfile }
    restart: unless-stopped
    environment: ["BUS_BACKEND=redis", "REDIS_PASSWORD=${REDIS_PASSWORD:-}", "REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0"]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8004/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws5-ai:
    build: { context: .., dockerfile: services/ws5-ai/Dockerfile }
    restart: unless-stopped
    environment: ["BUS_BACKEND=redis", "REDIS_PASSWORD=${REDIS_PASSWORD:-}", "REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0"]
    depends_on: { redis: { condition: service_healthy } }
    # set OLLAMA_URL to enable the local LLM; otherwise StubLLM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8005/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws8-correlation:
    build: { context: .., dockerfile: services/ws8-correlation/Dockerfile }
    restart: unless-stopped
    environment: ["BUS_BACKEND=redis", "REDIS_PASSWORD=${REDIS_PASSWORD:-}", "REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0"]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8008/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws6-inventory:
    build: { context: .., dockerfile: services/ws6-inventory/Dockerfile }
    restart: unless-stopped
    # v0.4: bind to loopback by default. The inventory API has a WRITE surface
    # (POST /assets/upsert) that is open unless FENGARDE_API_KEY is set, so it must
    # not be reachable from the LAN out of the box. Publish on 0.0.0.0 explicitly
    # only after setting a key (see SECURITY.md).
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["inventory-data:/data"]
    depends_on: { redis: { condition: service_healthy } }
    # R3-19: bus-consumer health (INVENTORY_BUS_HEALTH_PORT, default 8006) is the
    # live liveness signal -- the consumer daemon thread can die while the HTTP
    # server keeps answering (gap-hunt #24). Wired since 2026-08-26; now enforced.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8006/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      # v0.4 Track S1: opt-in shared-secret auth (unset = open + warning log).
      - FENGARDE_API_KEY=${FENGARDE_API_KEY:-}
      # M7 Track Y follow-up (2026-08-05): starts the assets.updates bus
      # consumer thread (services/ws6-inventory/bus_consumer.py) alongside
      # the HTTP server. Without this, the consumer code exists but never
      # runs -- BUS_BACKEND unset is exactly the zero-infra/HTTP-only path
      # bus_consumer.py's own tests exercise, same convention as every other
      # workstream's BUS_BACKEND=redis line above.
      - BUS_BACKEND=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # M7 Track Y: per-tenant baseline window. Devices first seen inside this
      # window after a tenant appears are treated as pre-existing inventory
      # (populate, don't alert), so standing the service up against an existing
      # segment doesn't emit one alert per device already on it. Documented as a
      # tunable since it shipped but never exposed here, so the only way to
      # change it was editing this file -- added 2026-08-11 while running the
      # new-device path end to end, which needs 0 to observe a sighting without
      # waiting out the default hour.
      - INVENTORY_BASELINE_SECONDS=${INVENTORY_BASELINE_SECONDS:-3600}

  ws7-dashboard:
    build: { context: .., dockerfile: services/ws7-dashboard/Dockerfile }
    restart: unless-stopped
    # v0.4: bind to loopback by default. The dashboard nginx proxies triage WRITE
    # calls to ws3 (injecting the key server-side), so an open dashboard on the
    # LAN is an open write path. Publish on 0.0.0.0 only behind your own auth/VPN.
    # (Syslog 5514 deliberately stays on all interfaces -- remote devices must
    # reach it to ship logs.)
    ports: ["127.0.0.1:8080:80"]
    depends_on: [ws6-inventory]
    # R3-19: nginx:alpine ships busybox `wget` (not curl/python), so the liveness
    # probe is a wget GET of the root page (fails on non-2xx) -- functionally the
    # "curl -f http://localhost/" check, written to the image's actual tooling.
    # 2026-08-27 live-verified: `localhost` can resolve to ::1 first; nginx:alpine
    # binds 0.0.0.0:80 (IPv4) only, so `wget http://localhost/` got "Connection
    # refused" and the container never reported healthy. Probe 127.0.0.1 (IPv4)
    # explicitly -- this is why the universal container-smoke caught ws7-dashboard
    # as unhealthy while its nginx was actually up.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # v0.4 Track S1: forwarded to ws3-indexer on the triage proxy so the
      # browser never holds the key. Must match ws3-indexer's FENGARDE_API_KEY.
      - FENGARDE_API_KEY=${FENGARDE_API_KEY:-}
      # v0.4 Track S2: "off" = no dashboard auth (default). See
      # infra/docker-compose.auth.yml for the opt-in override.
      - DASHBOARD_AUTH_REALM=off
    # v0.4 Track S2: dashboard basic-auth is opt-in via a compose OVERRIDE file
    # (infra/docker-compose.auth.yml), not baked in here -- a conditional bind
    # mount of a possibly-missing host file would break the zero-friction
    # `docker compose up` quickstart for everyone who hasn't set it up. See
    # SECURITY.md and infra/docker-compose.auth.yml for the opt-in path.

  # DX2-live: one-shot feeder. Injects an SSH brute-force burst into raw.events
  # so a fresh `docker compose up` yields a REAL alert in the dashboard with no
  # manual step. Exits 0 after producing the burst; idempotent (deterministic ids).
  devkit-feeder:
    build: { context: .., dockerfile: services/devkit-feeder/Dockerfile }
    restart: "no"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      redis: { condition: service_healthy }

  # M7 observability (2026-07-22). Opt-in profile -- `docker compose up`
  # (no --profile flag) is byte-for-byte unaffected, same convention as
  # infra/docker-compose.auth.yml's opt-in dashboard auth override. Bring up
  # with: docker compose -f infra/docker-compose.yml --profile observability up
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: siem-prometheus
    profiles: [observability]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [ws1-collectors, ws2-normalization, ws3-indexer, ws4-detection, ws5-ai, ws8-correlation]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: siem-grafana
    profiles: [observability]
    environment:
      # Opt-in profile, loopback-only port -- same "no auth surprise" posture
      # as every other opt-in layer in this stack (SECURITY.md). Change this
      # before exposing Grafana beyond localhost. GF_SECURITY_ADMIN_PASSWORD
      # was hardcoded to the literal "admin" with no override -- unlike
      # every other credential in this file (REDIS_PASSWORD,
      # FENGARDE_API_KEY, FENGARDE_ADMIN_PASSWORD, ...), there was no way to
      # set a real value without editing this file directly.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  redis-data:
  os-data:
  inventory-data:
  prometheus-data:
  grafana-data:
  ws1-spool:
  # R3-20: ws3-indexer persists audit.jsonl + opt-in RBAC sqlite (FENGARDE_RBAC_DB).
  ws3-indexer-data:
