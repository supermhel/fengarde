# FENGARDE homelab deployment profile -- HTTP spool drain enablement (2026-11-06).
#
# WARNING: PR #154 (WP-2.1) ALSO adds `infra/docker-compose.homelab.yml` (the full
# homelab profile: named volumes, loopback publishing, memory ceilings, the syslog
# spool). Both branches add this path, so git reports an add/add conflict for
# whichever merges second; resolve by hand and keep the INGEST_HTTP_SPOOL_PATH line
# below in the ws1-collectors environment.
#
# This file lands only the piece that belongs to the "HTTP spool drain" change: it
# switches on the HTTP/JSON ingest spool in the ws1-spool volume the base compose
# already mounts.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.homelab.yml up -d
#
# What this enables: with INGEST_HTTP_SPOOL_PATH set, an HTTP/JSON ingest 202s
# ("accepted for later delivery") when the bus is down and the collector's
# http-json-spool-drain thread replays the spool into the bus once it returns
# (test_http_spool_drain.py). Replay is AT-LEAST-ONCE (a crash can re-send up to 500
# events; WS-3 dedupes on ingest_id); events the bus keeps rejecting go to
# <spool>.dead; see /metrics http_spool_*.

services:
  ws1-collectors:
    environment:
      # HTTP/JSON zero-loss spool: bounded on-disk fallback when the bus is
      # down, drained by the collector's own http-json-spool-drain thread.
      # Needs the ws1-spool volume (already mounted by the base file).
      - INGEST_HTTP_SPOOL_PATH=/var/lib/fengarde/spool/http-spool.jsonl
