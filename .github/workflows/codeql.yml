name: CodeQL

# M2 supply-chain trust signal (PLAN_C Tier 2.2). Static analysis for
# security vulnerabilities across the Python codebase.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 4 * * 1"  # weekly, Monday 04:42 UTC

# Least-privilege default (Scorecard TokenPermissionsID); the analyze job
# re-grants itself security-events: write below, which is all it needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:python"
