name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default for every job (Scorecard TokenPermissionsID):
# nothing in this workflow writes to the repo or its APIs.
permissions:
  contents: read

jobs:
  # Secret-scanning gate: fail the build if any credential/secret is committed.
  # Uses the official gitleaks action. Public OSS repo => no GITLEAKS_LICENSE needed.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history so gitleaks can scan all commits, not just the tip.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # Lets the action post a summary / comment on pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CI SPLIT (see CONTRIBUTING.md "CI layout"). `bash run_all_tests.sh` used to be ONE ~25-30 min serial
  # step. It is now the same script run as tiers (GATE_TIER=<name>, see the tier_on blocks in
  # run_all_tests.sh; tools/test_gate_tiers.py proves the tiers together cover every stanza):
  #   fast-gate  - every PR/push, the quick tier (contract validator, parsers, rules, services, guards)
  #   eval-*     - the eval harness as parallel jobs, only on PRs touching tools/ci_eval_filter.py's paths;
  #                artifact consumers (eval-report, eval-gates) run after their producers, artifacts handed over
  #                with upload/download-artifact (eval/twin/fingerprint.py stamps them, so a stale one fails loud)
  #   full-gate  - the unmodified full script on every push to main (and on manual runs), so nothing is dropped
  #   contract-tests - the REQUIRED check name, kept; now an aggregator that is green only when every tier that
  #                should have run is green. Branch protection needs no change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Does this PR touch anything the eval harness measures?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Non-PR runs (main push, manual) take the full-gate job instead of the eval tier jobs.
          if [ "$EVENT" != "pull_request" ]; then
            echo "eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: any problem computing or reading the diff runs the eval jobs.
          # --no-renames lists BOTH sides of a rename (moving a rule out of contracts/rules must count);
          # -z + core.quotePath=false keep unusual file names intact.
          run_eval=true
          if git -c core.quotePath=false diff --name-only --no-renames -z "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.z"; then
            if out=$(python3 tools/ci_eval_filter.py -z < "$RUNNER_TEMP/changed.z") && { [ "$out" = true ] || [ "$out" = false ]; }; then
              run_eval=$out
            else
              echo "filter failed or printed '$out' -- running the eval jobs"
            fi
            echo "changed files:"
            tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
          else
            echo "git diff failed -- running the eval jobs"
          fi
          echo "eval=$run_eval" >> "$GITHUB_OUTPUT"

  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        # redis: services/shared/test_bus_redis_fallback.py needs the client
        # lib importable to exercise its non-ImportError propagation case (no
        # server required -- see that file's module docstring). Without it,
        # `import redis` inside _RedisBus.__init__ raises ImportError before
        # the test's forced ValueError is ever reached, so the test can only
        # ever hit the fallback branch and always fails.
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - name: Gate tier fast
        env:
          GATE_TIER: fast
          PYTHON: python3
        run: bash run_all_tests.sh

  # Eval: twin self-checks, negative controls, oracle cross-check/mutation, detection-accuracy controls. Produces oracle_consistency.latest.json.
  eval-twin:
    needs: [changes]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - name: Gate tier eval-twin
        env:
          GATE_TIER: eval-twin
          PYTHON: python3
        run: bash run_all_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-out-twin
          path: eval/twin/out/
          if-no-files-found: error
          retention-days: 2

  # Eval: adversarial Layer A + curated corpus B. Produces matrix.latest.json + corpus.latest.json.
  eval-layers:
    needs: [changes]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - name: Gate tier eval-layers
        env:
          GATE_TIER: eval-layers
          PYTHON: python3
        run: bash run_all_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-out-layers
          path: eval/adversarial/out/
          if-no-files-found: error
          retention-days: 2

  # Eval: scenario matrix, ATT&CK technique matrix, evasion search/cost, noise dilution. Produces scenario_matrix/evasion_search/... .latest.json.
  eval-matrix:
    needs: [changes]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - name: Gate tier eval-matrix
        env:
          GATE_TIER: eval-matrix
          PYTHON: python3
        run: bash run_all_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-out-matrix
          path: eval/adversarial/out/
          if-no-files-found: error
          retention-days: 2

  # Eval: twin report + chain/causal/phase-3.5 tests. report.py reads matrix.latest.json from eval-layers; produces report.latest.json.
  eval-report:
    needs: [changes, eval-layers]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eval-out-layers
          path: eval/adversarial/out
      - name: Gate tier eval-report
        env:
          GATE_TIER: eval-report
          PYTHON: python3
        run: bash run_all_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-out-report
          path: eval/twin/report.latest.json
          if-no-files-found: error
          retention-days: 2

  # Eval: ratchet check + baseline guard + scorecard check/lint. CONSUMES every artifact above, so it runs last; fetch-depth 0 so the ratchet guard has origin/main.
  eval-gates:
    needs: [changes, eval-twin, eval-layers, eval-matrix, eval-report]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eval-out-twin
          path: eval/twin/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eval-out-layers
          path: eval/adversarial/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eval-out-matrix
          path: eval/adversarial/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eval-out-report
          path: eval/twin
      - name: Regenerate the fire_check artifact (the exact command of the gate's fire_check stanza; seconds)
        run: python3 eval/attack/fire_check.py
      - name: Gate tier eval-gates
        env:
          GATE_TIER: eval-gates
          PYTHON: python3
        run: bash run_all_tests.sh

  # The unmodified full script: exactly what contract-tests ran before the split. Runs on every push to main
  # (and manually), so a merge that the PR-time path filter let through unmeasured still meets the whole gate.
  full-gate:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-hypothesis-redis.txt
      - name: Full zero-infra gate
        run: PYTHON=python3 bash run_all_tests.sh

  # REQUIRED CHECK (branch protection name unchanged). Green only if every tier that should have run did:
  # the eval tiers must be success when the PR touched eval paths and skipped otherwise, full-gate must be
  # success on non-PR runs and skipped on PRs. A skipped/cancelled/failed tier anywhere else is red.
  contract-tests:
    needs: [changes, fast-gate, eval-twin, eval-layers, eval-matrix, eval-report, eval-gates, full-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every tier green (or correctly skipped)
        env:
          EVENT: ${{ github.event_name }}
          RUN_EVAL: ${{ needs.changes.outputs.eval }}
          R_CHANGES: ${{ needs.changes.result }}
          R_FAST: ${{ needs.fast-gate.result }}
          R_TWIN: ${{ needs.eval-twin.result }}
          R_LAYERS: ${{ needs.eval-layers.result }}
          R_MATRIX: ${{ needs.eval-matrix.result }}
          R_REPORT: ${{ needs.eval-report.result }}
          R_GATES: ${{ needs.eval-gates.result }}
          R_FULL: ${{ needs.full-gate.result }}
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok:   $1 = $2"; else echo "FAIL: $1 = $2 (expected $3)"; fail=1; fi
          }
          case "$RUN_EVAL" in
            true) eval_want=success ;;
            false) eval_want=skipped ;;
            *) echo "FAIL: changes.outputs.eval is '$RUN_EVAL', expected true or false"; fail=1; eval_want=success ;;
          esac
          if [ "$EVENT" = "pull_request" ]; then full_want=skipped; else full_want=success; fi
          check changes "$R_CHANGES" success
          check fast-gate "$R_FAST" success
          check eval-twin "$R_TWIN" "$eval_want"
          check eval-layers "$R_LAYERS" "$eval_want"
          check eval-matrix "$R_MATRIX" "$eval_want"
          check eval-report "$R_REPORT" "$eval_want"
          check eval-gates "$R_GATES" "$eval_want"
          check full-gate "$R_FULL" "$full_want"
          exit "$fail"

  # Phase 6 integrity is deliberately separate from the long zero-infra
  # matrix: it has full history for the PR-time baseline guard and exercises
  # the acceptance controls even when no evaluation artifacts are cached.
  ratchet-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ratchet dependencies
        run: pip install --require-hashes -r .github/ci-requirements/yaml.txt
      - name: Phase 6 acceptance controls
        run: python eval/twin/test_ratchet.py
      - name: Phase 6 PR baseline guard
        run: python eval/twin/ratchet.py guard --base origin/main
      - name: Evasion floor may not be lowered without a recorded reason (Q2)
        run: python tools/check_floor_lowering.py --base origin/main

  # Integration gate: the Redis-path mechanisms (runner ack/redelivery/DLQ) against a
  # REAL broker. This is the tier that catches anything the memory bus can't model.
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-redis.txt
      - name: Runner ack + XAUTOCLAIM redelivery + DLQ on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_runner.py
      - name: P0-5 acked-stream reaper (trim_acked) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_trim_acked.py
      - name: P1-7 real consumer backlog signal (lag) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_lag.py
      - name: P1-8 XREADGROUP batch size on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_read_count.py
      # P1-8 remainder (2026-08-20): _RedisBus.ack_batch()'s pipelined XACK is
      # a genuinely different code path from _MemoryBus's dict-pop loop, and
      # the zero-infra gate only ever exercises the latter. Asserts the real
      # PEL actually drains (via XPENDING) and that a partial batch acks ONLY
      # the ids it was handed -- an over-acking pipeline would silently
      # swallow messages whose handler never ran, which no fake can catch.
      - name: P1-8 remainder pipelined XACK batching on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_ack_batching.py
      # FIX M16 (2026-08-06): Redis session + window backends against a REAL
      # broker -- test_sessions.py's Redis path is gated on SESSION_TEST_REDIS=1
      # (skipped in the zero-infra gate), and test_window.py runs the window
      # algorithm under the redis bus env so the window path is exercised in CI.
      - name: Session store (memory + Redis backends) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
          SESSION_TEST_REDIS: "1"
          # FIX 5 follow-up (2026-08-06): RedisSessionStore now refuses to
          # construct without this set (mandatory session signing) -- a
          # throwaway CI-only value, never used for anything but this job.
          FENGARDE_SESSION_SECRET: ci-test-session-secret-not-for-production
        run: python services/shared/test_sessions.py
      - name: Stateful window counter on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/ws4-detection/test_window.py
      - name: hit_distinct Lua fallback (Redis < 6.2 path) on real Redis
        env:
          FENGARDE_E2E_STRICT: "1"
          REDIS_URL: redis://localhost:6379/0
        run: python services/ws4-detection/test_window_redis_live.py

  # Q11 (owner decision 2026-10-14, proven 2026-10-20): the hit_distinct Lua fallback on a REAL Redis older
  # than 6.2 (no ZADD GT). The redis-integration job above runs Redis 7 with the Lua path merely FORCED; this
  # job runs the same parity test on redis 6.0 and asserts the server really is < 6.2 and auto-detect picks Lua.
  redis-legacy:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml-redis.txt
      - name: hit_distinct Lua fallback on a real Redis 6.0
        env:
          FENGARDE_E2E_STRICT: "1"
          REDIS_URL: redis://localhost:6379/0
          REDIS_EXPECT_LEGACY: "1"
        run: python services/ws4-detection/test_window_redis_live.py

  # FIX M26 (2026-08-06): live OpenSearch integration. ws3's storage layer and
  # the migration tool have live-cluster paths that no other CI job exercises
  # (the zero-infra gate uses fakes/in-memory); this job runs them against a
  # genuine single-node OpenSearch so a broken live path can't sit undetected.
  opensearch-integration:
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.13.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml.txt
      - name: Live OpenSearch integration tests
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: |
          python services/ws3-indexer/storage/test_opensearch_live.py
          python tools/test_migrate_opensearch.py
      # SSOT.md's triage-row correction (2026-08-21): this proves the OCC/CAS
      # lost-update guard under REAL concurrent writers, not just a fake
      # transport -- was opt-in-only via `make test-live` and had gone stale
      # in SSOT.md as "not yet exercised against a live cluster" because
      # nothing forced it to run automatically. Wired in so that can't recur.
      - name: OCC/CAS holds under real concurrent writers
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: python services/ws3-indexer/storage/test_opensearch_cas_concurrency_live.py
      # Gap-hunt finding (2026-08-23): this pins the 2026-08-19 per-thread-
      # connection fix (http.client.ResponseNotReady: Idle under real
      # multi-thread contention on ONE shared OpenSearchStore -- the exact
      # shape ws3-indexer's real daemon uses). Same "opt-in via make
      # test-live, never actually run automatically" shape as the CAS test
      # above before this session fixed it. Needs only a single reachable
      # OPENSEARCH_URL (skips cleanly otherwise), so it belongs here --
      # unlike test_opensearch_ha_failover_live.py (make test-live only,
      # deliberately NOT wired here: it needs `docker compose kill` against
      # a real 3-node HA profile, the same "needs actual multi-container
      # orchestration control, not just a services: container" reason
      # `make chaos`/`make ha-verify` also stay out of CI).
      - name: Shared OpenSearchStore survives real concurrent request/response cycles
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: python services/ws3-indexer/storage/test_opensearch_shared_store_concurrent_live.py

  # Gap-hunt finding (2026-08-23): test_mfa_live_e2e.py existed, passed, and
  # caught a real production defect once (2026-08-11: MFA silently inert in
  # the deployed image, green in every other test) -- but was reachable by
  # NO make target at all, only a manual `docker cp` + `docker exec` runbook
  # step in its own docstring. The exact regression it was written for could
  # have recurred silently forever. It needs the DEPLOYED image's own module
  # layout (that's the whole point -- the bug was in module resolution under
  # that layout, invisible to any in-process test), so it can't just run
  # against a checkout; this job builds the real ws3-indexer image and runs
  # it inside a container the same way the docstring's runbook does.
  ws3-mfa-live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build the real ws3-indexer image
        run: docker build -f services/ws3-indexer/Dockerfile -t ws3-indexer-mfa-e2e .
      - name: Run MFA/TOTP live e2e inside the deployed image
        run: |
          docker run -d --name mfa-e2e ws3-indexer-mfa-e2e tail -f /dev/null
          docker cp services/ws3-indexer/test_mfa_live_e2e.py mfa-e2e:/tmp/test_mfa_live_e2e.py
          docker exec mfa-e2e python /tmp/test_mfa_live_e2e.py
      - name: Cleanup
        if: always()
        run: docker rm -f mfa-e2e || true

  # Gap-hunt finding (2026-08-23): tools/ot_new_device_e2e.py's own docstring
  # says it "closes the gap" that the ot_new_device_on_segment rule had only
  # ever fired on its own anti-dormancy fixture, never on a real producer --
  # but that live proof was a one-time manual run (SSOT.md/CHANGELOG.md
  # record it as "LIVE-VERIFIED END TO END 2026-08-11"), reachable by NO make
  # target or CI job. Same shape as the MFA-e2e gap above, just needing the
  # FULL live stack (WS-6's bus consumer -> raw.events -> WS-2 -> WS-4 -> WS-3)
  # rather than one image. Also fixed a real, separate bug found while wiring
  # this in: the script hardcoded `http://opensearch-1:9200`, an HA-PROFILE-
  # ONLY hostname that doesn't exist on the plain stack its own docstring
  # instructs running it against -- it had never actually worked. Live-
  # verified both directions before wiring: fails with a connection error on
  # the old hardcoded hostname, passes end-to-end once it reads the real
  # OPENSEARCH_URL out of the ws3-indexer container instead.
  ot-new-device-live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Bring up the full stack
        # INVENTORY_BASELINE_SECONDS=0: the test's own docstring requires
        # this -- a first sighting inside the default 3600s baseline window
        # is treated as pre-existing inventory BY DESIGN (populate, don't
        # alert), so the script would SKIP (not fail) without it.
        env:
          INVENTORY_BASELINE_SECONDS: "0"
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for the stack to report healthy
        # Gap-hunt (2026-08-26): `ps` (no `-a`) lists only RUNNING containers,
        # so a stack that's still building/starting -- or one that crashed
        # entirely -- both show zero non-running rows and this used to pass
        # on iteration 1 either way. Count against the compose file's own
        # service list (via `ps -a`, which includes not-yet-ready/exited
        # containers) instead of trusting an absence of bad rows. Some
        # services (devkit-feeder, provision, ws1-spool-init) are one-shot
        # init jobs that exit 0 by design and never reach `running` -- treat
        # a clean exit as ready too, alongside a running+healthy container.
        run: |
          expected=$(docker compose -f infra/docker-compose.yml config --services | wc -l)
          for _ in $(seq 1 60); do
            total=$(docker compose -f infra/docker-compose.yml ps -a --services | wc -l)
            # Pipe-delimited, not space-delimited: `.Health` renders as an
            # empty string on a container with no healthcheck, and a
            # space-joined format collapses that into a missing field under
            # awk's default whitespace splitting -- shifting ExitCode into
            # the Health column and silently breaking the exited-container
            # branch below.
            ready=$(docker compose -f infra/docker-compose.yml ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' \
                    | awk -F'|' '($2=="running" && $3!="starting" && $3!="unhealthy") || ($2=="exited" && $4=="0") {c++} END{print c+0}')
            if [ "$total" -eq "$expected" ] && [ "$ready" -eq "$expected" ]; then
              echo "stack running ($ready/$expected)"; exit 0
            fi
            sleep 5
          done
          echo "stack did not reach healthy within 5 minutes"
          docker compose -f infra/docker-compose.yml ps -a
          exit 1
      - name: Run OT new-device live e2e
        # FENGARDE_E2E_STRICT=1: this job guarantees every precondition the
        # script checks (docker up, BUS_BACKEND=redis, baseline=0) -- so here
        # a [SKIP] can only mean the job itself is broken, and must fail the
        # job rather than pass vacuously (review finding, 2026-08-27).
        env:
          FENGARDE_E2E_STRICT: "1"
        run: python tools/ot_new_device_e2e.py
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # React console (WS-7): the dev-tooling majors bumped in the supply-chain pin change (vite, vitest, plugin-react) are
  # only exercised by a real install, type-check, build and test run -- nothing else in CI builds the console.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ws7-dashboard/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test

  # M2 code-quality floor (PLAN_C Tier 2.3). Lint blocks; coverage blocks at the
  # MEASURED baseline (see tools/coverage_gate.py) not the unmet-for-WS-3 85%
  # target -- see that file's docstring for why. mypy is BLOCKING as of
  # 2026-07-22 (0 findings across all 8 workstreams; ws9-resolver added
  # 2026-09-02, also 0 findings): see pyproject.toml's [tool.mypy] comment.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        # hypothesis: the coverage gate runs parsers/test_property_hardening.py
        # (tools/coverage_gate.py line ~33), which imports it -- without it the
        # gate dies on ModuleNotFoundError before measuring anything.
        run: pip install --require-hashes -r .github/ci-requirements/quality.txt
      - name: ruff (blocking)
        run: ruff check services/ tools/
      - name: mypy (blocking -- see pyproject.toml)
        run: |
          for ws in services/ws1-collectors services/ws2-normalization services/ws3-indexer \
                    services/ws4-detection services/ws5-ai services/ws6-inventory \
                    services/ws8-correlation services/ws9-resolver services/shared tools \
                    eval/twin; do
            mypy "$ws" --explicit-package-bases --ignore-missing-imports
          done
      - name: coverage gate (ws2/ws3/shared/ws4/ws6/ws8/ws9, blocking at measured baseline)
        run: python tools/coverage_gate.py
      # FIX M10 (2026-08-06, reverted same day): a version of this step made
      # mutmut BLOCKING on the theory that pyproject.toml's [tool.mutmut]
      # "governs the pass/fail threshold" -- it doesn't. That section has no
      # threshold field at all (mutmut has no such setting), and nothing in
      # this pipeline parses `mutmut results` to compare a rate against one.
      # `mutmut run` exits non-zero whenever ANY mutant survives, so dropping
      # `|| true` here would fail this job on every run at the measured ~72%
      # survival baseline -- not on a regression, on the baseline itself.
      # Reverted to informational until a real threshold parser exists (e.g.
      # grep `mutmut results` output for the survived count and compare
      # against a number actually stored in [tool.mutmut]).
      - name: mutmut (informational, non-blocking -- see pyproject.toml [tool.mutmut])
        run: |
          pip install --require-hashes -r .github/ci-requirements/mutmut.txt
          python -m mutmut run || true
          python -m mutmut results || true
          echo "mutmut survival rate is informational (pyproject.toml [tool.mutmut]) -- not blocking CI, no threshold parser exists yet"
      - name: SBOM freshness (blocking -- sbom.json must match requirements.txt)
        run: |
          pip install --require-hashes -r .github/ci-requirements/cyclonedx.txt
          python tools/generate_sbom.py --check

  # Dependency-vulnerability audit of every service's pinned requirements.txt.
  # Dependabot IS enabled (.github/dependabot.yml, pip + github-actions) -- an
  # earlier version of this comment said it was disabled by owner decision,
  # which stopped being true when that config landed. The two are
  # complementary, not redundant: Dependabot opens PRs when a NEWER version
  # exists, this job fails CI when a PINNED version has a known CVE, which is
  # the case that would otherwise sit and age quietly if nobody merges the
  # bump. Fixing either is still a manual, reviewed version bump.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit all pinned service dependencies
        run: |
          pip install --require-hashes -r .github/ci-requirements/pip-audit.txt
          failed=""
          for req in services/*/requirements.txt; do
            echo "=== $req ==="
            pip-audit --requirement "$req" --strict || failed="$failed $req"
          done
          if [ -n "$failed" ]; then
            echo "vulnerable pins in:$failed"
            exit 1
          fi

  # Build every service image. Nothing else in CI proves the Dockerfiles
  # actually build (the zero-infra gate never touches them; PR#2's live runs
  # did, but only on a developer machine). A broken Dockerfile should fail
  # here, not on an operator's first `make up`.
  # 2026-08-27: universal container smoke -- build -> run -> health-check across
  # EVERY app service. Closes the gap the other two live-e2e jobs (ws3-mfa,
  # ot-new-device) leave open: they cover 2 services, and `docker-build` only
  # builds. That means an image that BUILDS but does not BOOT (or whose health
  # endpoint 404s, or whose /metrics is empty) shipped unchecked. This job
  # brings up the full compose stack and runs tools/container_smoke.py, which
  # execs into EVERY service container and asserts its health endpoint responds.
  # Live-verified locally 2026-08-27 against the real stack: 8/8 green -- and it
  # caught a real bug (ws7-dashboard's compose healthcheck used http://localhost/
  # which resolved to ::1 on nginx:alpine's IPv4-only bind, so the container
  # never reported healthy; fixed to 127.0.0.1 in infra/docker-compose.yml).
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Bring up the full stack and build every image
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for the stack to report healthy
        # Same health-wait the ot-new-device job uses (ps -a includes exited
        # init jobs; pipe-delimited so empty Health doesn't shift ExitCode).
        run: |
          expected=$(docker compose -f infra/docker-compose.yml config --services | wc -l)
          for _ in $(seq 1 90); do
            total=$(docker compose -f infra/docker-compose.yml ps -a --services | wc -l)
            ready=$(docker compose -f infra/docker-compose.yml ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' \
                    | awk -F'|' '($2=="running" && $3!="starting" && $3!="unhealthy") || ($2=="exited" && $4=="0") {c++} END{print c+0}')
            if [ "$total" -eq "$expected" ] && [ "$ready" -eq "$expected" ]; then
              echo "stack running ($ready/$expected)"; exit 0
            fi
            sleep 5
          done
          echo "stack did not reach healthy within 7.5 minutes"
          docker compose -f infra/docker-compose.yml ps -a
          exit 1
      - name: Run universal container smoke (per-service health across all 8)
        # FENGARDE_E2E_STRICT=1: this job brings the stack up itself, so a
        # [SKIP] here can only mean the job is broken (review finding,
        # 2026-08-27) -- same rationale as the ot-new-device job above.
        env:
          FENGARDE_E2E_STRICT: "1"
        run: python tools/container_smoke.py
      - name: Companion rules live e2e (split attacks alert via the companion only; ordinary attack alerts once)
        env:
          FENGARDE_E2E_STRICT: "1"
        run: python tools/live_companion_e2e.py
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build all service images
        run: docker compose -f infra/docker-compose.yml build

  # P3-2/P3-3 (2026-07-21 audit fix plan): declared ATT&CK/ATLAS coverage
  # scorecard, published as a CI artifact every run (SigmaHQ does the
  # equivalent for its rule repo). Zero infra, zero prerequisites -- pure
  # metadata parsed from contracts/rules/*.yml's mitre: blocks. See
  # eval/attack/coverage_layer.py's module docstring for why this is
  # DECLARED coverage only, not proof a technique's mapped rule actually
  # fires (that's the separate, dataset-gated `make eval-detection` lane,
  # deliberately not run in CI -- see eval/detection_accuracy/README.md).
  # M7 (2026-07-22): eval/attack/fire_check.py closes the narrower gap in
  # between -- proves a tagged rule fires on its OWN real producer fixture
  # (zero infra, no dataset needed, so it DOES run here, unlike
  # eval-detection). Still not real-world validation; see that file's
  # module docstring for the declared-vs-fired-vs-real-world distinction.
  attack-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes -r .github/ci-requirements/yaml.txt
      - name: Coverage scorecard tests
        run: python eval/attack/test_coverage_layer.py
      - name: Build scorecard + Navigator layers
        run: python eval/attack/coverage_layer.py
      - name: MITRE empirical firing check (blocking -- a tagged rule that never fires is a real defect)
        run: python eval/attack/fire_check.py
      # Must run in CI, not just locally: the boundary probes assert that a
      # rule does NOT fire, and a broken harness makes that assertion pass.
      # These tests mutate real rules until they ARE too loose and require
      # each probe to go red, so they are what keeps the boundary numbers
      # above from being unfalsifiable.
      - name: fire_check boundary-probe sensitivity (blocking -- a green negative must be able to go red)
        run: python eval/attack/test_fire_check.py
      # Now SHA-pinned like this file's other actions. It was previously left
      # on a floating tag with a NOTE saying it had been authored offline with
      # no way to verify a real commit SHA -- that blocker is gone: the pin
      # below is `refs/tags/v7.0.1` on actions/upload-artifact, resolved and
      # checked against the tag rather than copied from a release page. The
      # same SHA already pins this action in fuzz.yml and scorecard.yml, so
      # all three now agree.
      - name: Upload Navigator layer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: attack-navigator-layers
          path: eval/attack/out/

  # Lint the workflow files themselves (this directory is executable config;
  # the unresolvable `ossf/scorecard-action@v2` tag shipped broken and sat
  # undetected until its first live run -- actionlint-class checks are the
  # gate for that file class).
  # Validates the HA compose overlay actually resolves. Nothing else in CI
  # does -- docker-build/container-smoke above only exercise the base file.
  # This exact bug class ("new service added to the base compose, never
  # given an HA override, so --profile ha breaks on an unsatisfiable
  # `depends_on: redis`") has recurred three times: ws6, ws8 (both fixed
  # 2026-08-20), ws9 (found and fixed by a 2026-09-04 gap-hunt after landing
  # 2026-09-02 with zero CI signal). Config resolution only -- no live infra,
  # seconds not minutes.
  ha-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: HA profile resolves (docker compose config, no containers started)
        run: |
          REDIS_PASSWORD=ci-config-check-only \
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.ha.yml \
              --profile ha config >/dev/null

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2
      # actionlint catches malformed workflows; it does not check that a pin
      # points at a commit that exists. That is the `ossf/scorecard-action@v2`
      # failure verbatim, and it matters most for scorecard.yml, which has no
      # `pull_request` trigger -- nothing else in PR CI reads that file. This
      # step does, because a workflow with no PR trigger is still just a file
      # on disk and can be validated without executing it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Action pins resolve to the versions their comments claim
        run: python tools/verify_action_pins.py
