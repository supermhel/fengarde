name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for every job (Scorecard TokenPermissionsID):
# nothing in this workflow writes to the repo or its APIs.
permissions:
  contents: read

jobs:
  # Secret-scanning gate: fail the build if any credential/secret is committed.
  # Uses the official gitleaks action. Public OSS repo => no GITLEAKS_LICENSE needed.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history so gitleaks can scan all commits, not just the tip.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # Lets the action post a summary / comment on pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Zero-infra gate: contract tests + runner/window/evaluator + both e2e on the memory bus.
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        # redis: services/shared/test_bus_redis_fallback.py needs the client
        # lib importable to exercise its non-ImportError propagation case (no
        # server required -- see that file's module docstring). Without it,
        # `import redis` inside _RedisBus.__init__ raises ImportError before
        # the test's forced ValueError is ever reached, so the test can only
        # ever hit the fallback branch and always fails.
        run: pip install pyyaml hypothesis redis
      - name: Full zero-infra gate
        run: PYTHON=python3 bash run_all_tests.sh

  # Integration gate: the Redis-path mechanisms (runner ack/redelivery/DLQ) against a
  # REAL broker. This is the tier that catches anything the memory bus can't model.
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml redis
      - name: Runner ack + XAUTOCLAIM redelivery + DLQ on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_runner.py
      - name: P0-5 acked-stream reaper (trim_acked) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_trim_acked.py
      - name: P1-7 real consumer backlog signal (lag) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_lag.py
      - name: P1-8 XREADGROUP batch size on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_bus_read_count.py
      # P1-8 remainder (2026-08-20): _RedisBus.ack_batch()'s pipelined XACK is
      # a genuinely different code path from _MemoryBus's dict-pop loop, and
      # the zero-infra gate only ever exercises the latter. Asserts the real
      # PEL actually drains (via XPENDING) and that a partial batch acks ONLY
      # the ids it was handed -- an over-acking pipeline would silently
      # swallow messages whose handler never ran, which no fake can catch.
      - name: P1-8 remainder pipelined XACK batching on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/shared/test_ack_batching.py
      # FIX M16 (2026-08-06): Redis session + window backends against a REAL
      # broker -- test_sessions.py's Redis path is gated on SESSION_TEST_REDIS=1
      # (skipped in the zero-infra gate), and test_window.py runs the window
      # algorithm under the redis bus env so the window path is exercised in CI.
      - name: Session store (memory + Redis backends) on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
          SESSION_TEST_REDIS: "1"
          # FIX 5 follow-up (2026-08-06): RedisSessionStore now refuses to
          # construct without this set (mandatory session signing) -- a
          # throwaway CI-only value, never used for anything but this job.
          FENGARDE_SESSION_SECRET: ci-test-session-secret-not-for-production
        run: python services/shared/test_sessions.py
      - name: Stateful window counter on real Redis
        env:
          BUS_BACKEND: redis
          REDIS_URL: redis://localhost:6379/0
        run: python services/ws4-detection/test_window.py

  # FIX M26 (2026-08-06): live OpenSearch integration. ws3's storage layer and
  # the migration tool have live-cluster paths that no other CI job exercises
  # (the zero-infra gate uses fakes/in-memory); this job runs them against a
  # genuine single-node OpenSearch so a broken live path can't sit undetected.
  opensearch-integration:
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.13.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Live OpenSearch integration tests
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: |
          python services/ws3-indexer/storage/test_opensearch_live.py
          python tools/test_migrate_opensearch.py
      # SSOT.md's triage-row correction (2026-08-21): this proves the OCC/CAS
      # lost-update guard under REAL concurrent writers, not just a fake
      # transport -- was opt-in-only via `make test-live` and had gone stale
      # in SSOT.md as "not yet exercised against a live cluster" because
      # nothing forced it to run automatically. Wired in so that can't recur.
      - name: OCC/CAS holds under real concurrent writers
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: python services/ws3-indexer/storage/test_opensearch_cas_concurrency_live.py

  # M2 code-quality floor (PLAN_C Tier 2.3). Lint blocks; coverage blocks at the
  # MEASURED baseline (see tools/coverage_gate.py) not the unmet-for-WS-3 85%
  # target -- see that file's docstring for why. mypy is BLOCKING as of
  # 2026-07-22 (0 findings across all 8 workstreams): see pyproject.toml's
  # [tool.mypy] comment.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        # hypothesis: the coverage gate runs parsers/test_property_hardening.py
        # (tools/coverage_gate.py line ~33), which imports it -- without it the
        # gate dies on ModuleNotFoundError before measuring anything.
        run: pip install ruff mypy coverage pyyaml types-PyYAML hypothesis
      - name: ruff (blocking)
        run: ruff check services/ tools/
      - name: mypy (blocking -- see pyproject.toml)
        run: |
          for ws in services/ws1-collectors services/ws2-normalization services/ws3-indexer \
                    services/ws4-detection services/ws5-ai services/ws6-inventory \
                    services/ws8-correlation services/shared tools; do
            mypy "$ws" --explicit-package-bases --ignore-missing-imports
          done
      - name: coverage gate (ws2/ws3/shared/ws4/ws6, blocking at measured baseline)
        run: python tools/coverage_gate.py
      # FIX M10 (2026-08-06, reverted same day): a version of this step made
      # mutmut BLOCKING on the theory that pyproject.toml's [tool.mutmut]
      # "governs the pass/fail threshold" -- it doesn't. That section has no
      # threshold field at all (mutmut has no such setting), and nothing in
      # this pipeline parses `mutmut results` to compare a rate against one.
      # `mutmut run` exits non-zero whenever ANY mutant survives, so dropping
      # `|| true` here would fail this job on every run at the measured ~72%
      # survival baseline -- not on a regression, on the baseline itself.
      # Reverted to informational until a real threshold parser exists (e.g.
      # grep `mutmut results` output for the survived count and compare
      # against a number actually stored in [tool.mutmut]).
      - name: mutmut (informational, non-blocking -- see pyproject.toml [tool.mutmut])
        run: |
          pip install mutmut
          python -m mutmut run || true
          python -m mutmut results || true
          echo "mutmut survival rate is informational (pyproject.toml [tool.mutmut]) -- not blocking CI, no threshold parser exists yet"
      - name: SBOM freshness (blocking -- sbom.json must match requirements.txt)
        run: |
          pip install cyclonedx-bom
          python tools/generate_sbom.py --check

  # Dependency-vulnerability audit of every service's pinned requirements.txt.
  # Dependabot IS enabled (.github/dependabot.yml, pip + github-actions) -- an
  # earlier version of this comment said it was disabled by owner decision,
  # which stopped being true when that config landed. The two are
  # complementary, not redundant: Dependabot opens PRs when a NEWER version
  # exists, this job fails CI when a PINNED version has a known CVE, which is
  # the case that would otherwise sit and age quietly if nobody merges the
  # bump. Fixing either is still a manual, reviewed version bump.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit all pinned service dependencies
        run: |
          pip install pip-audit
          failed=""
          for req in services/*/requirements.txt; do
            echo "=== $req ==="
            pip-audit --requirement "$req" --strict || failed="$failed $req"
          done
          if [ -n "$failed" ]; then
            echo "vulnerable pins in:$failed"
            exit 1
          fi

  # Build every service image. Nothing else in CI proves the Dockerfiles
  # actually build (the zero-infra gate never touches them; PR#2's live runs
  # did, but only on a developer machine). A broken Dockerfile should fail
  # here, not on an operator's first `make up`.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build all service images
        run: docker compose -f infra/docker-compose.yml build

  # P3-2/P3-3 (2026-07-21 audit fix plan): declared ATT&CK/ATLAS coverage
  # scorecard, published as a CI artifact every run (SigmaHQ does the
  # equivalent for its rule repo). Zero infra, zero prerequisites -- pure
  # metadata parsed from contracts/rules/*.yml's mitre: blocks. See
  # eval/attack/coverage_layer.py's module docstring for why this is
  # DECLARED coverage only, not proof a technique's mapped rule actually
  # fires (that's the separate, dataset-gated `make eval-detection` lane,
  # deliberately not run in CI -- see eval/detection_accuracy/README.md).
  # M7 (2026-07-22): eval/attack/fire_check.py closes the narrower gap in
  # between -- proves a tagged rule fires on its OWN real producer fixture
  # (zero infra, no dataset needed, so it DOES run here, unlike
  # eval-detection). Still not real-world validation; see that file's
  # module docstring for the declared-vs-fired-vs-real-world distinction.
  attack-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Coverage scorecard tests
        run: python eval/attack/test_coverage_layer.py
      - name: Build scorecard + Navigator layers
        run: python eval/attack/coverage_layer.py
      - name: MITRE empirical firing check (blocking -- a tagged rule that never fires is a real defect)
        run: python eval/attack/fire_check.py
      # Must run in CI, not just locally: the boundary probes assert that a
      # rule does NOT fire, and a broken harness makes that assertion pass.
      # These tests mutate real rules until they ARE too loose and require
      # each probe to go red, so they are what keeps the boundary numbers
      # above from being unfalsifiable.
      - name: fire_check boundary-probe sensitivity (blocking -- a green negative must be able to go red)
        run: python eval/attack/test_fire_check.py
      # Now SHA-pinned like this file's other actions. It was previously left
      # on a floating tag with a NOTE saying it had been authored offline with
      # no way to verify a real commit SHA -- that blocker is gone: the pin
      # below is `refs/tags/v7.0.1` on actions/upload-artifact, resolved and
      # checked against the tag rather than copied from a release page. The
      # same SHA already pins this action in fuzz.yml and scorecard.yml, so
      # all three now agree.
      - name: Upload Navigator layer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: attack-navigator-layers
          path: eval/attack/out/

  # Lint the workflow files themselves (this directory is executable config;
  # the unresolvable `ossf/scorecard-action@v2` tag shipped broken and sat
  # undetected until its first live run -- actionlint-class checks are the
  # gate for that file class).
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2
      # actionlint catches malformed workflows; it does not check that a pin
      # points at a commit that exists. That is the `ossf/scorecard-action@v2`
      # failure verbatim, and it matters most for scorecard.yml, which has no
      # `pull_request` trigger -- nothing else in PR CI reads that file. This
      # step does, because a workflow with no PR trigger is still just a file
      # on disk and can be validated without executing it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Action pins resolve to the versions their comments claim
        run: python tools/verify_action_pins.py
