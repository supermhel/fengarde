# Nightly detection-accuracy evaluation (WP-0.2-A + WP-0.2-B).
#
# Re-measures detection quality on a schedule and appends ONE row to the
# committed trend file eval/trend.jsonl so a published macro-F1 number cannot
# silently decay into a claim nobody regenerated.
#
# This is an OPT-IN LIVE lane, deliberately NOT part of the zero-infra PR gate
# (ci.yml / run_all_tests.sh): it fetches the two GITIGNORED third-party
# corpora (EVTX-ATTACK-SAMPLES, splunk/attack_data) and replays them through
# the real WS-2 -> WS-4 pipeline. It must not fail the zero-infra gate just
# because a corpus download is unavailable, but a download that is ATTEMPTED
# and ERRORS must fail LOUDLY (never a silent skip), while an
# intentionally-off lane (repo var NIGHTLY_EVAL_MODE=quality-only) skips
# cleanly with a message.
#
# fire_check.py is intentionally NOT wired here: it is already a BLOCKING step
# of the zero-infra gate (run_all_tests.sh, M7) and runs on its own synthetic
# fixtures. This nightly lane is for the CORPUS oracle runs (evtx/splunk) which
# are today manual -- see eval/detection_accuracy/README.md.
#
# Actions are SHA-pinned to 40-char commit SHAs, matching the convention used
# across every workflow in this repo (ci.yml pins all 35 uses; see
# tools/verify_action_pins.py).
name: Nightly Eval

on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least-privilege default (mirrors ci.yml): read repo contents; the only write
# is the per-run trend artifact upload (actions/upload-artifact), which --
# as in ci.yml's attack-scorecard job -- needs no extra repo write scope.
permissions:
  contents: read

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # no step pushes or calls the API
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        # python-evtx: required by the EVTX corpus lane (both corpora eval
        # scripts SKIP cleanly without it, but this lane fetches the corpus so
        # it is a real dependency here, not optional). Hash-pinned like every
        # services/*/requirements.txt, so a new upstream release can't move
        # the published numbers without a commit.
        run: pip install --require-hashes -r eval/requirements.txt

      # ---- corpus fetch (opt-in live lane) --------------------------------
      # NIGHTLY_EVAL_MODE is a repository variable:
      #   unset / "corpus"  -> fetch both corpora at the commits PINNED in
      #                        eval/detection_accuracy/fetch_corpora.sh; a failed
      #                        fetch FAILS the job loudly (never silent).
      #   "quality-only"    -> skip the fetch + evtx/splunk lanes cleanly; the
      #                        zero-infra quality canary + trend row still run.
      - name: Fetch corpus corpora (EVTX-ATTACK-SAMPLES + splunk/attack_data)
        env:
          NIGHTLY_EVAL_MODE: ${{ vars.NIGHTLY_EVAL_MODE }}
        run: |
          set -euo pipefail
          if [ "${NIGHTLY_EVAL_MODE:-corpus}" = "quality-only" ]; then
            echo "[SKIP] NIGHTLY_EVAL_MODE=quality-only -- corpus fetch + evtx/splunk lanes disabled; clean skip, not a failure."
            exit 0
          fi
          # Q13 (2026-10-14): fetched at the commits pinned in corpus_manifest.json (a plain
          # --depth 1 clone measured whatever HEAD was that night), splunk/attack_data with
          # GIT_LFS_SKIP_SMUDGE and only the pre-registered LFS subset pulled (a full clone is
          # > 9 GB). fetch_corpora.py exits 1 on any failed fetch or pull -- never a silent skip.
          git lfs install --skip-repo
          python eval/detection_accuracy/fetch_corpora.py             --corpus evtx-attack-samples --corpus splunk-attack-data --corpus evtx-to-mitre

      # ---- eval entry points ----------------------------------------------
      - name: Detection-quality canary (macro-F1 floor, zero-infra)
        run: python tools/detection_quality_eval.py

      # Both scripts also skip cleanly on a missing corpus dir (see their own
      # module docstrings), so this `if:` isn't load-bearing for correctness --
      # it just makes quality-only mode actually skip the STEP (matching what
      # the fetch step's own message claims) instead of running it to print a
      # skip message.
      - name: EVTX oracle replay (corpus lane)
        if: vars.NIGHTLY_EVAL_MODE != 'quality-only'
        run: python eval/detection_accuracy/evtx_eval.py

      - name: Splunk attack_data oracle replay (corpus lane)
        if: vars.NIGHTLY_EVAL_MODE != 'quality-only'
        run: python eval/detection_accuracy/splunk_eval.py

      # Blind recall over third-party LABELLED datasets (labels by the dataset authors, not by
      # this repo). --require-corpus: a missing corpus FAILS instead of reporting an empty pass.
      - name: Blind recall on pinned third-party corpora (corpus lane)
        if: vars.NIGHTLY_EVAL_MODE != 'quality-only'
        run: python eval/detection_accuracy/blind_recall.py --require-corpus

      # ---- append ONE trend row ------------------------------------------
      # Reads the gitignored evtx/splunk result JSONs each lane just wrote,
      # recomputes the detection-quality macro-F1, and appends a single
      # schema-v1 row to the committed eval/trend.jsonl. The logic lives in a
      # tested script (was inline here until the PR #96 review) so a local
      # reproduction runs exactly this code (benchmark/reproduction.md).
      - name: Append ONE trend row to eval/trend.jsonl
        run: python tools/append_trend_row.py

      # ---- WP-1-F: AI-to-OT twin scorecard (zero-infra, runs nightly) -----
      # The full twin (plc sim -> scenario -> real parsers -> real detector ->
      # oracle grading) is memory-bus/in-process, so this lane needs no
      # container. It appends its own twin row to the SAME trend file and
      # writes eval/twin/report.json, uploaded with the trend artifact below.
      - name: WP-1-F twin scorecard
        run: python eval/twin/report.py

      # Phase 6 controls are deterministic and independent of the optional
      # third-party corpora. The atom baseline itself remains a PR/CI gate;
      # this nightly lane only rechecks the control and fingerprint machinery.
      - name: Phase 6 ratchet acceptance controls
        run: python eval/twin/test_ratchet.py

      # ---- WP-0.2-B: assert the rule-health Prometheus series is present ----
      # The WS-4 watchdog (services/ws4-detection/main.py record_fire() /
      # rule_health_metrics(), served by services/shared/runner.py on PORT,
      # default 8004) emits rule_last_fired_timestamp:<id> and rule_never_fired:<id>.
      # PROMETHEUS_METRICS_URL is a repository variable:
      #   set      -> scrape /metrics/prom; fail LOUDLY if unreachable OR if no
      #               rule-health series is present (a live surface asserted).
      #   unset    -> not configured in this repo -> clean skip, not a failure.
      - name: WP-0.2-B -- assert rule-health Prometheus series present
        env:
          PROMETHEUS_METRICS_URL: ${{ vars.PROMETHEUS_METRICS_URL }}
        run: |
          url="${PROMETHEUS_METRICS_URL:-}"
          if [ -z "$url" ]; then
            echo "[SKIP] PROMETHEUS_METRICS_URL unset -- WS-4 rule-health surface not configured in this repo; clean skip, not a failure."
            exit 0
          fi
          echo "Scraping $url"
          body="$(curl -fsS --max-time 30 "$url")" \
            || { echo "[FAIL] cannot scrape $url (is the WS-4 watchdog daemon serving /metrics/prom?)"; exit 1; }
          if printf '%s' "$body" | grep -Eq 'rule_(last_fired_timestamp|never_fired):'; then
            echo "[OK] rule-health series present in /metrics/prom"
          else
            echo "[FAIL] /metrics/prom reachable but no rule_last_fired_timestamp:/rule_never_fired: series present"
            exit 1
          fi

      # ------- persist the (grown) trend file beyond the run ----------------
      # Row is appended in-place above; the whole file (schema header + every
      # accumulated row) is published as a per-run artifact. This job does NOT
      # push back to main (least-privilege contents: read; "do not auto-commit"
      # convention) -- rows live in the committed seed file and the per-run
      # artifacts, appended again by whoever runs the lane locally.
      # Phase 5 item 6 (2026-09-04): regenerate the internal trend viewer
      # against the row this run just appended (in-runner file, matching the
      # "this job does NOT push back to main" convention every other step
      # here already holds -- eval/trend.jsonl itself is the same: appended
      # in-runner, only landed in git by whoever runs the lane locally).
      - name: Regenerate eval/trend_viewer.html
        run: python tools/generate_trend_viewer.py

      # ---- Phase 5 item 8 (2026-10-14): public benchmark packaging ---------
      # Reads the latest corpus + twin rows from the trend file (including the
      # row this run just appended) and rewrites benchmark/results.json in the
      # public schema. Same commit convention as trend_viewer: this job does
      # NOT push back to main -- the regenerated file rides the per-run
      # artifact (below) and lands in git when whoever runs the lane commits
      # it locally (the committed seed is the deliverable).
      - name: Regenerate benchmark/results.json (public packaging of latest rows)
        run: python tools/generate_benchmark.py

      - name: Upload detection-accuracy trend artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: detection-accuracy-trend
          path: |
            eval/trend.jsonl
            eval/twin/report.json
            eval/trend_viewer.html
            benchmark/results.json
          if-no-files-found: error

      - name: Upload blind-recall results (corpus lane)
        if: vars.NIGHTLY_EVAL_MODE != 'quality-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: blind-recall-results
          path: eval/detection_accuracy/blind_recall_results.json
          if-no-files-found: error
