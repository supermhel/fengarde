name: Nightly fuzz (coverage-guided, matrix of parsers)

# M1 correctness gate (PLAN_C Tier 1.2): coverage-guided byte-level fuzzing,
# complementing the value-level Hypothesis property tests that run on every
# push (see contract-tests in ci.yml). Nightly, not per-push -- a useful fuzz
# budget is minutes, not seconds, and doesn't belong blocking a PR.
on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily -- off the hour, avoids the GH Actions stampede
  workflow_dispatch: {}     # manual trigger for on-demand runs
  # R3-30: run a bounded fuzz smoke on PRs touching parsers/fuzz harness so a
  # regression in a parser is caught at review time, not only by the nightly.
  # Scope matrix-heavy fuzzing to the paths that actually recomp jthe harness;
  # paths-only avoids using PR time on unrelated docs/config changes.
  pull_request:
    paths:
      - "services/ws2-normalization/parsers/**"
      - "services/ws*/**"
      - "tools/fuzz/**"

# Least-privilege default (Scorecard TokenPermissionsID): fuzzing only reads
# the repo; corpus cache + crash-artifact upload need no extra token scope.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # L8 (2026-08-06 fix): grew from the original 3 to 5 parsers -- db_audit
      # (GRANT/priv-parse, FIX-3-adjacent) and vmware_vsphere (VM operation
      # classification) round out the high-value text parsers.
      # 2026-08-13 audit: extended to all 17 registered parsers (was 5/17).
      # k8s_audit/cloudtrail/modbus_anomaly/inventory_diff use the run_json
      # harness (tools/fuzz/_common.py) since their parse() requires
      # raw['raw'] to already be a dict; every other target uses the
      # original string-based harness (some of those parsers json.loads a
      # string internally, so the same harness still exercises their real
      # field-handling logic, not just the isinstance guard).
      matrix:
        target: [linux_ssh, cisco_asa, windows_eventlog, db_audit, vmware_vsphere,
                 generic_syslog, dns_query, cef, sysmon, active_directory,
                 opcua_audit, n8n_audit, mcp_agent,
                 k8s_audit, cloudtrail, modbus_anomaly, inventory_diff]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install atheris
        run: pip install atheris
      - name: Restore corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tools/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for 10 minutes
        run: |
          mkdir -p tools/fuzz/corpus/${{ matrix.target }}
          cd tools/fuzz
          python fuzz_${{ matrix.target }}.py -max_total_time=600 corpus/${{ matrix.target }}
      - name: Upload crashing input (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: tools/fuzz/crash-*
          if-no-files-found: ignore
