# DCO (Developer Certificate of Origin) check — Phase 5 item 10 (2026-10-14).
#
# PR-gated ONLY, never retroactive: every commit a PR would merge must carry a
# `Signed-off-by:` trailer, matching the commit's author email, certifying DCO
# v1.1. Existing history (which has no trailers) is deliberately untouched —
# the check only inspects `base.sha..head.sha`. Implemented with the local git
# toolchain (tools/check_dco.py, unit-tested by tools/test_check_dco.py), so
# there is no third-party action to SHA-pin and nothing new to trust. Checked
# PER COMMIT and FAIL-CLOSED (a missing base sha is a red check, never a green
# skip) — see the script's docstring for the review findings that drove both.
#
# Action pins verified by tools/verify_action_pins.py (runs in ci.yml).
name: DCO

on:
  pull_request:

# Least-privilege default (mirrors every other workflow): read-only contents.
permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # DCO grades ONLY the contributor's real commits, never GitHub's synthetic
      # merge ref: the default checkout on a pull_request event is
      # refs/pull/N/merge, an auto-created base+head merge commit that CANNOT
      # carry a human Signed-off-by trailer -- grading that range made the gate
      # count commits=6 signed_off=5 (commits=5 signed=5 against the true head)
      # and block every PR despite all commits being fully signed (proven
      # 2026-10-14, PR #96). Pin the checkout to the PR head so the gate grades
      # exactly the commit list GitHub itself lists on the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Only git metadata is read; no step needs the token afterwards.
          persist-credentials: false
      - name: Every commit signed off (DCO v1.1)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_dco.py "${BASE_SHA}"
