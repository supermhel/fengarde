# fuzz_k8s_audit, fuzz_linux_ssh, fuzz_m365_audit, fuzz_mail_gateway, fuzz_mcp_agent, fuzz_modbus_anomaly,
# fuzz_n8n_audit, fuzz_opcua_audit, fuzz_sysmon, fuzz_vmware_vsphere,
# fuzz_windows_eventlog