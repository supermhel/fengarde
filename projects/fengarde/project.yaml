homepage: "https://github.com/supermhel/fengarde"
main_repo: "https://github.com/supermhel/fengarde"
language: python
# TODO(dylandjomou): confirm this identity before submitting the project to
# OSS-Fuzz -- the primary contact receives ClusterFuzz crash reports and
# needs Google-account access.
primary_contact: "dylandjomou@yahoo.de"
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
architectures:
  - x86_64

# Fuzz targets (19): one atheris harness per parser, compiled by build.sh
